const W4=[
{id:'read',sub:'eng',t:'Reading scientific text',pre:[],
learn:`<p>Scientific texts are dense, so read in layers. <b>Survey</b> first: title, abstract, headings, figures and conclusion. <b>Question</b>: what do I need to learn? <b>Read</b> actively in sections, marking the <b>claim</b> and the <b>evidence</b> in each paragraph. <b>Recite</b>: close the page and say the main point in your own words. <b>Review</b> later, spaced out. This is the SQ3R method.</p><p>Look for <b>signpost words</b>: however, therefore, because, in contrast, for example. Decode unknown terms from context and word parts. Separate <b>facts</b> (evidence-backed statements), <b>inferences</b> (conclusions drawn from facts) and <b>opinions</b>. In a research paper the abstract states the question, methods, results and conclusion; check that the conclusion really follows from the results.</p>`,
recall:[{q:'What does SQ3R stand for?',a:'Survey, Question, Read, Recite, Review.'},{q:'What is the difference between a fact and an inference?',a:'A fact is an evidence-backed statement; an inference is a conclusion drawn from facts.'},{q:'What does an abstract contain?',a:'The question, methods, main results and conclusion of a paper.'}],
apply:[{q:'Which word signals a contrast?',o:['however','therefore','because','for example'],c:0,why:'However introduces a contrast.'},{q:'You finish a paragraph and cannot state its main point. The best next step is to…',o:['close the page, recite it in your own words, then re-read','keep reading faster','highlight everything','skip it'],c:0,why:'Retrieval shows what you did and did not take in.'}],
explain:{q:'Explain how to read a scientific article effectively.',pts:['Survey first, then read actively','Mark claim and evidence','Signpost words show relationships','Recite and review to remember']},
bq:'Why should you check that a paper conclusion really follows from its results?',
dp:'Reading speed matters less than comprehension: re-reading passively builds false confidence, whereas retrieval (closing the text and recalling) works better. Read figures by checking axes, units, error bars and sample size first. Scientific English uses hedging language (suggests, may, is associated with) to signal certainty, and Greek and Latin word parts; notice the difference between association and causation. Keep a glossary of new terms and review it at spaced intervals.',
t2:Q('A paper states "X was associated with Y". Which interpretation is most accurate?',['A relationship was observed; it does not by itself prove X caused Y','X caused Y','Y caused X','There is no relationship'],0,'Association does not prove causation, and hedged wording matters.'),
t3:Q('A study of 12 patients reports a 50% improvement and concludes a drug is "highly effective for everyone". What is the main concern?',['The sample is small and the conclusion goes beyond the data','Fifty percent is too low to matter','The study mentions a drug','Twelve is the ideal sample size'],0,'Small samples are unreliable and the claim generalises beyond the evidence.')},
{id:'write',sub:'eng',t:'Writing clearly for science and medicine',pre:['read'],
learn:`<p>Clear writing helps readers act correctly. Build each paragraph around <b>one idea</b>: a topic sentence (the claim), evidence, and a sentence explaining why it matters. Use <b>plain, precise language</b>: short sentences, exact terms, numbers with units, and the active voice where it is clearer ('We measured…'). Avoid vague words ('a lot', 'some') and unexplained abbreviations.</p><p>Research reports follow <b>IMRaD</b>: <b>I</b>ntroduction (why), <b>M</b>ethods (how), <b>R</b>esults (what was found) <b>a</b>nd <b>D</b>iscussion (what it means). <b>Plan</b>, <b>draft</b>, then <b>edit</b>: cut unnecessary words, check facts and units, and read aloud. In clinical writing be exact: write 'units' in full, give drug names and doses clearly, and keep notes objective.</p>`,
recall:[{q:'What does IMRaD stand for?',a:'Introduction, Methods, Results and Discussion.'},{q:'What makes a good paragraph?',a:'One idea: a topic sentence, evidence and explanation.'},{q:'Why give units with numbers?',a:'A number without a unit is ambiguous and can cause serious errors.'}],
apply:[{q:'Which sentence is more precise?',o:['"Blood pressure fell from 160/100 to 130/85 mmHg after 4 weeks."','"Blood pressure got a lot better."','"BP improved."','"It was better."'],c:0,why:'It gives values, units and a time.'},{q:'In IMRaD, where do you report what you found?',o:['Results','Introduction','Methods','Discussion'],c:0,why:'The Results section presents the findings.'}],
explain:{q:'Explain how to write clearly for science and medicine.',pts:['One idea per paragraph: claim, evidence, explanation','Plain, precise language with numbers and units','IMRaD structure','Plan, draft, edit, read aloud']},
bq:'Why can vague or sloppy writing be dangerous in clinical notes?',
dp:'Write for the reader: busy clinicians want the key message first. Use parallel structure for lists, replace noun-heavy phrases ("perform an assessment of" becomes "assess"), and prefer common words ("use" over "utilise"). Define abbreviations at first use and avoid them in patient letters. Reporting guidelines (CONSORT for trials, PRISMA for reviews, STROBE for observational studies) make research reports complete. Proofread numbers separately: transposed digits are a common error.',
t2:Q('Which rewrite is clearest?',['"We measured systolic blood pressure in 40 patients before and after treatment."','"Measurement of systolic blood pressure was performed by us on a number of patients."','"BP was measured, kind of."','"Patients had BP stuff done."'],0,'It is specific, active and concise.'),
t3:Q('A discharge letter says "Take 1 tab bd." Why is this poor practice for a patient letter?',['Abbreviations and unclear wording can be misunderstood; write the instruction in full','It is too long','It is too clear','It uses numbers'],0,'Patient letters should avoid abbreviations such as "bd" and say "twice a day" with the drug name and dose.')},
{id:'evidence',sub:'eng',t:'Evaluating sources & avoiding plagiarism',pre:['read','stats'],
learn:`<p>Not all sources are equally reliable. Prefer <b>peer-reviewed</b> articles, guidelines from recognised bodies and textbooks, and check the <b>author</b>, <b>date</b>, <b>methods</b>, <b>sample size</b>, <b>funding</b> and conflicts of interest. A <b>primary</b> source reports original research; a <b>secondary</b> source (a review or textbook) summarises it.</p><p>The <b>hierarchy of evidence</b> for treatment questions, strongest to weakest: <b>systematic reviews and meta-analyses</b>, <b>randomised controlled trials</b>, <b>cohort studies</b>, <b>case-control studies</b>, <b>case reports and series</b>, then <b>expert opinion</b>. Higher levels reduce bias, but the best design depends on the question. <b>Plagiarism</b> is using someone else's words or ideas without credit. Paraphrase in your own words and <b>cite</b> the source (medicine often uses Vancouver numbering); use quotation marks for exact words.</p>`,
recall:[{q:'Which study design is at the top of the evidence hierarchy for treatments?',a:'Systematic reviews and meta-analyses.'},{q:'What is plagiarism?',a:'Using someone else words or ideas without crediting them.'},{q:'What is the difference between primary and secondary sources?',a:'Primary reports original research; secondary summarises or interprets it.'}],
apply:[{q:'Which gives stronger evidence about a treatment?',o:['A randomised controlled trial','A single case report','An expert opinion','A personal blog'],c:0,why:'Randomised trials compare groups and reduce bias.'},{q:'You copy a sentence from a website into your essay and change two words. This is…',o:['plagiarism if uncredited','acceptable paraphrase','good referencing','original writing'],c:0,why:'You must credit the source and properly paraphrase.'}],
explain:{q:'Explain how to judge a source and avoid plagiarism.',pts:['Check author, date, methods, sample size, funding','Primary versus secondary sources','Hierarchy of evidence','Paraphrase and cite; avoid plagiarism']},
bq:'Why is one dramatic case report not enough to change clinical practice?',
dp:'The hierarchy is a guide: a well-conducted cohort study can be more reliable than a poor trial, and trials are unsuitable for some questions (rare harms, ethics). Publication bias means positive results are more likely to be published, and preprints are not peer reviewed. Predatory journals charge fees without real review. A meta-analysis combines results statistically, but if the included studies are biased the combined result is too. Tools such as GRADE rate the certainty of evidence. Universities use similarity-checking software and treat plagiarism as misconduct.',
t2:Q('A news story reports that a supplement "cured" a patient. What is the best next step?',['Look for controlled studies or systematic reviews on the supplement','Believe it because it was published','Share it with patients immediately','Ignore all research'],0,'A single story is weak evidence. Check stronger studies.'),
t3:Q('A meta-analysis combines ten small, poorly designed trials. What is the most reasonable view of its conclusion?',['It may still be unreliable because the included studies are biased','It must be correct because it is a meta-analysis','It is worthless because meta-analyses never work','It proves causation'],0,'A meta-analysis is only as good as the studies it includes.')}];

write:{chain:['Notes are read by many people, often under time pressure','Vague words can be read in different ways','Missing units or unclear abbreviations cause misreading','Wrong doses or missed information can harm patients','Precise, plain writing reduces risk'],tie:'Precision in an essay becomes safety in a clinical note.',a:'Clinical notes are read quickly by many people, so vague wording, missing units and unclear abbreviations can be misread and lead to wrong doses or missed information. Precise, plain writing reduces that risk.'},

const W5A=[
{id:'pmethod',sub:'patho',t:'Thinking like a doctor: the pathophysiology method',pre:[],src:'all systems (method)',
learn:`<p><b>Pathophysiology</b> asks one question: <b>what has gone wrong with normal function, and what follows from it?</b> Doctors use a repeatable chain: <b>Normal</b> function → <b>Mechanism</b> of the fault → <b>Abnormality</b> (what is different in the body) → <b>Symptoms and signs</b> (why the patient feels and looks this way) → <b>Investigations</b> (what would support or refute it) → <b>Treatment logic</b> (which step of the chain each treatment breaks) → <b>Monitoring</b>.</p><p>Two habits make it second nature. First, ask <b>what would the body do next?</b> The body compensates (a failing heart speeds up; low oxygen speeds breathing), and compensation can itself cause harm. Second, separate <b>forward</b> effects (too little flow or output reaches the tissues) from <b>backward</b> effects (pressure or fluid backing up behind the fault). If you know the mechanism you can predict the symptoms, choose the test and reason out the treatment, instead of memorising lists.</p>`,
recall:[{q:'List the steps of the pathophysiology chain.',a:'Normal, mechanism, abnormality, symptoms and signs, investigations, treatment logic, monitoring.'},{q:'What do forward and backward effects mean?',a:'Forward: too little flow or output reaches the tissues. Backward: pressure or fluid builds up behind the failing part.'},{q:'Why ask what the body would do next?',a:'Compensation is predictable and can itself cause symptoms or harm.'}],
apply:[{q:'A patient has fatigue and cold hands because the heart cannot pump enough. This is a…',o:['forward effect','backward effect','compensation','investigation'],c:0,why:'Too little output reaching the tissues is a forward effect.'},{q:'Breathlessness and ankle swelling from fluid backing up behind a failing ventricle are…',o:['backward effects','forward effects','normal findings','treatments'],c:0,why:'Pressure and fluid building up behind the pump are backward effects.'}],
explain:{q:'Explain the pathophysiology method and why it beats memorising lists.',pts:['The chain: normal, mechanism, abnormality, symptoms and signs, tests, treatment logic, monitoring','Predict symptoms from the mechanism','Forward versus backward effects','Anticipate compensation']},
bq:'Why does knowing the mechanism let you answer a question you have never seen before?',
pc:['Normal function is defined','A fault (mechanism) disturbs it','A physiological or structural abnormality may develop','Depending on its nature and severity it may cause symptoms and signs, or stay silent until tested for','Tests support or refute the suspected mechanism, read with the history and examination','Treatment breaks a step in the chain','Monitoring checks that the chain is stopped'],
dp:'The same method scales from one cell to a whole patient: cell injury, tissue response, organ dysfunction, system failure. Diagnostic reasoning combines fast pattern recognition with slower, mechanism-based thinking, and mechanism knowledge is what rescues you when the pattern does not fit. Biases such as anchoring and premature closure are countered by asking what else would explain the findings and what the mechanism predicts that has not yet been checked. These lessons teach mechanisms; they do not by themselves make anyone able to diagnose, prescribe or manage emergencies independently.',
t2:Q('Which statement best applies the method to a falling blood pressure in bleeding?',['Blood volume falls, so preload and cardiac output fall; the body compensates with a faster heart rate and vasoconstriction','The pressure falls because the patient is anxious','Bleeding always causes a slow heart rate','Treatment should be chosen before thinking about the mechanism'],0,'Normal, then mechanism (volume loss), then abnormality (low preload and output), then compensation (tachycardia, vasoconstriction).'),
t3:Q('A bleeding patient has a fast heart rate but a normal blood pressure. What is the best interpretation?',['Compensation may be masking significant volume loss, so the patient could still be in early shock','All is well because the pressure is normal','The heart rate is the only abnormal value so ignore it','The patient has hypertension'],0,'Tachycardia can be an early compensatory response to blood loss, and blood pressure may stay normal at first. Interpret both findings in the full clinical context.')},
{id:'injury',sub:'patho',t:'Cell injury, remodelling & inflammation',pre:['atp','cells'],src:'Neurology 1; Cardiac 2a',
learn:`<p>Injured cells can <b>recover fully</b>; <b>survive but not fully recover</b> (with persistent damage; if DNA damage is not repaired correctly, mutations can accumulate and some contribute to cancer); undergo <b>apoptosis</b> (programmed, tidy death, often a good outcome for a damaged cell); or die by <b>necrosis</b> (messy death that triggers <b>inflammation</b>: swelling, redness, warmth, pain, and arrival of phagocytes). What decides the outcome is how severe the injury is and how long it lasts. <b>Ischaemia</b> (too little blood flow) injures cells because ATP falls, ion pumps fail and cells swell; if flow is not restored in time the damage becomes irreversible.</p><p>Skin and gut lining repair; neurons and heart muscle cells largely do not, so loss is permanent and replaced by scar. <b>Remodelling</b> is the long-term rebuilding of an organ after injury or overload (the heart after infarction or in hypertension). It can be adaptive at first (as in training), but persistent pathological remodelling, promoted by angiotensin II, aldosterone and sympathetic activation, can progressively impair function, which is why treatment aims to limit it.</p>`,
recall:[{q:'List the possible fates of an injured cell.',a:'Full recovery, survival with incomplete recovery, apoptosis, or necrosis.'},{q:'What is the difference between apoptosis and necrosis?',a:'Apoptosis is regulated cell death that usually limits inflammation because the cell contents stay contained and are cleared efficiently. Necrosis typically disrupts membranes and releases contents that provoke inflammation.'},{q:'Why can remodelling be maladaptive?',a:'Persistent pathological remodelling can progressively worsen function, for example contributing to heart failure.'}],
apply:[{q:'Which cell type largely cannot regenerate?',o:['neuron','epidermal cell','intestinal lining cell','hepatocyte'],c:0,why:'Neurons are generally not replaced, so loss is permanent.'},{q:'Why does ischaemia injure cells?',o:['Low oxygen reduces ATP, so pumps fail and cells swell','Too much oxygen arrives','Too much ATP is made','Blood volume is excessive'],c:0,why:'Without oxygen ATP falls, ion pumps fail and the cell swells.'}],
explain:{q:'Explain the fates of injured cells and why remodelling matters.',pts:['Fates of injured cells','Apoptosis versus necrosis and inflammation','Ischaemia: ATP falls, pumps fail, reversible then irreversible','Persistent pathological remodelling can worsen function']},
bq:'Why can heart failure appear months or years after a heart attack that the patient survived?',
pc:['A harmful event injures cells (for example ischaemia)','ATP falls and ion pumps fail','Cells swell and function drops','Prolonged injury causes necrosis and inflammation','Dead tissue is replaced by scar or remodelled','Function is permanently reduced'],
dp:'Ischaemia-reperfusion injury: restoring flow can add damage through oxygen free radicals and calcium overload, so timing and tissue matter. Irreversible injury can develop rapidly during severe ischaemia, but its timing varies with tissue type, residual blood flow, temperature and the severity and duration of oxygen deprivation. Brain and heart muscle are particularly vulnerable to sustained severe ischaemia (time is brain, time is muscle). Protein accumulation (amyloid, tau, alpha-synuclein) injures neurons in neurodegenerative disease. Adaptations include hypertrophy, hyperplasia, atrophy and metaplasia; dysplasia and neoplasia reflect failure to adapt.',
t2:Q('Which change describes a muscle cell thickening in response to a sustained high workload?',['hypertrophy','atrophy','metaplasia','apoptosis'],0,'Hypertrophy is an increase in cell size in response to increased load.'),
t3:Q('Why may renin–angiotensin system inhibition be used after a myocardial infarction, particularly when left ventricular systolic function is reduced?',['It can reduce maladaptive remodelling and improve outcomes in appropriately selected patients','To cure the dead muscle','To make the heart beat faster','Because remodelling is helpful'],0,'Renin–angiotensin system inhibition can reduce maladaptive remodelling and improve outcomes in selected patients. Beta blockers may also be indicated depending on ventricular function, clinical circumstances and contraindications; drug choice is individual.')},
{id:'hfail',sub:'patho',t:'Heart failure',pre:['homeo','fluids'],src:'Cardiac 1, 2a, 3a',
learn:`<p>The heart <b>fills</b> in diastole and <b>ejects</b> in systole. <b>Cardiac output = heart rate × stroke volume</b>. Stroke volume depends on <b>preload</b> (how full the ventricle is), <b>contractility</b> (how strongly it squeezes) and <b>afterload</b> (the pressure it must push against). <b>Ejection fraction (EF)</b> = stroke volume ÷ end-diastolic volume × 100%. EF is one measure of systolic function, not a stand-alone test for heart failure. Common classifications define HFrEF as EF 40% or below and HFpEF as EF 50% or above (with the clinical evidence needed to establish heart failure); 41 to 49% is often called mildly reduced.</p><p><b>Heart failure</b> means the heart cannot deliver the output the tissues need, or only does so with high filling pressures. It is a clinical syndrome diagnosed from symptoms, signs and objective evidence (such as echocardiography and natriuretic peptides); EF then classifies the type rather than diagnosing the condition. Two mechanisms: <b>HFrEF</b> (reduced EF, a weak squeeze, for example after an infarct or in dilated cardiomyopathy) and <b>HFpEF</b> (preserved EF, a stiff ventricle that cannot fill, for example from long-standing hypertension). <b>Forward effects</b> from low output: fatigue, weakness, poor exercise tolerance. <b>Backward effects</b> from high pressure behind the pump: the left side gives breathlessness and pulmonary oedema; the right side gives raised neck veins, liver congestion and leg oedema.</p><p>The body compensates by activating the sympathetic nervous system and the renin–angiotensin–aldosterone system: faster rate, stronger squeeze, vasoconstriction and fluid retention. This helps briefly, but it raises afterload and preload and drives harmful remodelling, so treatment targets it.</p>`,
recall:[{q:'Write the formula for cardiac output.',a:'Cardiac output = heart rate × stroke volume.'},{q:'What are the three determinants of stroke volume?',a:'Preload, contractility and afterload.'},{q:'What is the difference between HFrEF and HFpEF?',a:'HFrEF is a weak squeeze with reduced EF; HFpEF is a stiff ventricle that fills poorly with preserved EF.'}],
apply:[{q:'EDV is 130 mL and ESV is 50 mL. The ejection fraction is about…',o:['62%','38%','80%','50%'],c:0,why:'SV = 80 mL, and 80 ÷ 130 is about 62%.'},{q:'Which symptom is a backward effect of left heart failure?',o:['breathlessness from pulmonary congestion','fatigue from low output','cold hands from low output','dizziness from low output'],c:0,why:'Raised left-sided pressure backs fluid up into the lungs.'}],
explain:{q:'Explain heart failure using preload, contractility and afterload.',pts:['CO = HR × SV; SV depends on preload, contractility, afterload','EF = SV ÷ EDV','HFrEF versus HFpEF','Forward and backward effects; compensation worsens it']},
bq:'How do renin–angiotensin system inhibitors, evidence-based beta blockers and diuretics address different problems in heart failure?',
pc:['The ventricle is damaged or stiff','Stroke volume and output fall','Sympathetic and renin–angiotensin systems activate','Fluid retention and vasoconstriction raise filling pressure and afterload','Backward congestion causes breathlessness and oedema','Remodelling worsens the heart further'],
dp:'Natriuretic peptides (BNP, NT-proBNP) are released when the ventricle is stretched. Low levels make heart failure less likely in the right clinical setting, but results must be read with symptoms, examination and other tests because obesity can lower levels and kidney disease and other conditions can raise them. Starling law: within limits greater filling gives a stronger contraction, but in a failing heart the curve flattens, so more filling brings more congestion and little extra output. Persistently reduced EF, often 35% or less, can support consideration of an implantable defibrillator for selected patients after appropriate medical therapy and timing criteria are met. EF alone does not establish eligibility. Acute decompensation is often triggered by arrhythmia, infection, missed medicine, excess salt or ischaemia.',
t2:Q('A ventricle has EDV 150 mL and EF 30%. What is the stroke volume?',['45 mL','30 mL','105 mL','120 mL'],0,'SV = EF × EDV = 0.30 × 150 = 45 mL.'),
t3:Q('A patient with known heart failure is breathless lying flat and has ankle swelling. Which explanation fits best?',['Raised filling pressures push fluid back into the lungs and legs (backward effects)','Low blood pressure is the only cause','Excess cardiac output','The kidneys are making too little salt'],0,'Congestion explains breathlessness (pulmonary) and oedema (systemic).')},
{id:'cad',sub:'patho',t:'Coronary artery disease, angina & heart attack',pre:['fluids','atp'],src:'Cardiac 3a, 4a, 5, 6',
learn:`<p>Heart muscle needs a continuous oxygen supply from the <b>coronary arteries</b>. <b>Atherosclerosis</b> is a chronic, inflammatory response to injury of the artery lining (endothelium) from smoking, high blood pressure, high glucose, high LDL cholesterol and other factors. Injured endothelium lets LDL cholesterol into the wall, where macrophages engulf it and become <b>foam cells</b>; smooth muscle migrates and proliferates, forming a <b>plaque</b>.</p><p>A plaque causes trouble in two ways. A <b>stable, narrowing</b> plaque limits flow when demand rises: supply is less than demand, causing <b>angina</b> (chest pain on exertion, relieved by rest). Plaque <b>rupture or erosion</b> can trigger platelet activation and a clot (thrombus) that reduces or blocks flow. Depending on the extent and duration of the flow reduction this causes an <b>acute coronary syndrome</b>: <b>unstable angina</b> (without sustained muscle death) or <b>myocardial infarction</b> (heart muscle death). In an ideal rigid tube, resistance varies inversely with the fourth power of the radius, which shows why narrowing can sharply raise resistance; real coronary flow also depends on the geometry of the stenosis, pressure gradient, downstream resistance, collateral circulation and myocardial demand.</p><p>Chronic ischaemia or an infarct can lead to <b>heart failure</b>, <b>arrhythmias</b> and sudden death, and starts remodelling. Treatment reduces demand, improves supply, prevents clots, and limits atherosclerosis and remodelling.</p>`,
recall:[{q:'What is angina?',a:'Chest pain from myocardial ischaemia when oxygen demand exceeds supply, typically on exertion and relieved by rest.'},{q:'Describe how atherosclerosis begins.',a:'Endothelial injury lets LDL enter the wall; macrophages become foam cells and smooth muscle proliferates to form a plaque.'},{q:'What usually causes a heart attack?',a:'Plaque rupture with a clot that suddenly blocks the coronary artery.'}],
apply:[{q:'Chest pain that comes on with exertion and settles with rest most likely reflects…',o:['supply less than demand from a fixed narrowing','a blocked airway','a broken rib','a stomach ulcer'],c:0,why:'Exertion raises demand beyond what the narrowed artery can supply.'},{q:'Which is a modifiable risk factor for atherosclerosis?',o:['smoking','age','family history','male sex'],c:0,why:'Smoking can be changed; the others cannot.'}],
explain:{q:'Explain how coronary artery disease causes angina and heart attack.',pts:['Endothelial injury, LDL entry, foam cells, plaque','Stable narrowing gives angina; rupture and clot give infarction','Supply–demand mismatch; flow depends on radius to the fourth power','Consequences: heart failure, arrhythmia, remodelling']},
bq:'Why do aspirin, a statin and a beta blocker each help a person with coronary artery disease?',
pc:['Endothelium is injured by risk factors','LDL enters the wall and foam cells form','A plaque grows and narrows the artery','Demand exceeds supply on exertion (angina)','Plaque ruptures and a clot blocks the artery','Heart muscle dies (infarction) and remodelling begins'],
dp:'Troponin released from dying heart muscle is the key blood marker of infarction, and ECG changes localise it: ST elevation in an appropriate clinical context can indicate acute coronary occlusion and needs urgent assessment for reperfusion. However, ST elevation does not always mean complete occlusion, and acute coronary occlusion can occur without ST elevation. Acute coronary syndrome spans unstable angina, NSTEMI and STEMI, separated using troponin and serial ECGs together. Time is muscle: reperfusion by percutaneous coronary intervention or thrombolysis limits infarct size, though reperfusion can itself cause arrhythmias. Women, older people and people with diabetes may present atypically. Sudden cardiac death during ischaemia is often from ventricular fibrillation.',
t2:Q('In the ideal Poiseuille model, if a vessel radius is halved with the same pressure difference, flow falls to…',['1/16','1/2','1/4','1/8'],0,'Flow depends on r⁴, so (1/2)⁴ = 1/16.'),
t3:Q('A man has crushing chest pain for 40 minutes, sweating and ST elevation on ECG. The most likely mechanism is…',['plaque rupture with a clot occluding a coronary artery','a pulled muscle','acid reflux','a panic attack only'],0,'ST elevation with prolonged ischaemic-type pain suggests acute occlusion of a coronary artery by a plaque-related clot (STEMI), although other causes of ST elevation exist. This is a mechanism question: chest pain needs emergency care.')},
{id:'htn',sub:'patho',t:'Hypertension & its damage',pre:['fluids','cad'],src:'Cardiac 8, 9',
learn:`<p><b>Mean arterial pressure ≈ cardiac output × systemic vascular resistance</b> (approximate when central venous pressure is small; systolic and diastolic pressures are also influenced by arterial compliance and the cardiac cycle). Resistance depends mostly on the radius of the arterioles (resistance scales with 1/r⁴), and cardiac output depends on heart rate and stroke volume (linked to blood volume). The kidneys set long-term pressure by excreting sodium and water: when they cannot excrete a salt load, volume and pressure rise.</p><p>Hypertension is persistently raised pressure (commonly 140/90 mmHg or more in clinic; guidelines vary). Most cases are <b>primary</b>: genes that affect kidney sodium handling combined with modern diet (high sodium, low potassium), weight gain and inactivity. <b>Secondary</b> causes include kidney disease, renal artery narrowing and endocrine causes. It is usually silent, but it damages the endothelium (promoting atherosclerosis), forces the left ventricle to push against a higher <b>afterload</b> (hypertrophy and eventually failure), and injures the brain (stroke), kidneys (CKD) and eyes.</p><p>Antihypertensive drugs act through different mechanisms, including reducing sodium and fluid volume (diuretics, less salt) or lowering vascular resistance (ACE inhibitors, ARBs, calcium channel blockers). Beta blockers reduce heart rate and output and are useful in selected settings. Drug choice depends on the patient and current guidelines.</p>`,
recall:[{q:'State the equation linking mean arterial pressure, cardiac output and resistance.',a:'MAP ≈ cardiac output × systemic vascular resistance.'},{q:'How does the kidney control long-term blood pressure?',a:'By excreting sodium and water, which sets blood volume.'},{q:'Name three organs damaged by hypertension.',a:'Heart, brain and kidneys (also eyes and arteries).'}],
apply:[{q:'If resistance doubles and cardiac output stays the same, mean arterial pressure…',o:['doubles','halves','stays the same','falls slightly'],c:0,why:'BP is proportional to resistance when output is unchanged.'},{q:'Which change in the left ventricle follows long-standing hypertension?',o:['hypertrophy','atrophy','dilation only','nothing'],c:0,why:'The ventricle thickens against the higher afterload.'}],
explain:{q:'Explain how hypertension arises and what it damages.',pts:['MAP ≈ CO × SVR','Kidney sodium handling sets long-term pressure','Hypertension damages heart, brain, kidneys, arteries','Treatment lowers volume, resistance or output']},
bq:'Why is hypertension called a silent killer, and why treat it even without symptoms?',
pc:['Genetic and environmental factors alter kidney sodium handling and other blood-pressure regulating mechanisms','In some patients sodium retention expands blood volume and output; other mechanisms also raise resistance','Arterioles constrict, raising resistance','Blood pressure rises persistently','Arteries and the left ventricle are damaged','Stroke, heart failure and kidney disease follow'],
dp:'The renin–angiotensin–aldosterone system raises pressure through angiotensin II vasoconstriction and aldosterone-driven sodium retention; ACE inhibitors and ARBs interrupt it. Suspect secondary hypertension in the young, in resistant hypertension, or with low potassium (primary aldosteronism). Pulse pressure widens with stiff arteries in older adults. A hypertensive emergency is severe hypertension with acute organ damage and needs urgent, controlled lowering. Mean arterial pressure is about diastolic plus one third of the pulse pressure.',
t2:Q('Cardiac output is 5 L/min and systemic vascular resistance is 18 mmHg per L/min. Using MAP ≈ CO × SVR, the mean pressure is…',['90 mmHg','23 mmHg','5 mmHg','180 mmHg'],0,'5 × 18 = 90 mmHg.'),
t3:Q('How does an ACE inhibitor lower blood pressure?',['It blocks angiotensin II formation, reducing vasoconstriction and aldosterone-driven sodium retention','It increases heart rate','It adds sodium to the blood','It constricts arterioles'],0,'Less angiotensin II means vasodilation and less aldosterone. Reduced aldosterone also explains potassium retention.')}];

pmethod:{chain:['Memorised facts answer only the questions you have seen','A mechanism links cause to consequence','From the cause you can predict symptoms, signs and test results','From the chain you can see where a treatment acts','So new scenarios can be reasoned out'],tie:'This is the Anki idea: cards about how things work let you rebuild the answer.',a:'A mechanism is a chain of cause and effect. If you understand it you can predict findings and reason out treatment for situations you have not memorised.'},
injury:{chain:['A heart attack kills muscle and starts remodelling','Hormones such as angiotensin II, aldosterone and noradrenaline stay high','Pathological remodelling can alter ventricular size, shape and function','In some patients pumping gradually worsens','Heart failure appears months or years later'],tie:'The process starts at the injury, not when the symptoms appear.',a:'The injury can set off remodelling driven by sustained hormone activation. In some patients the ventricle progressively dilates and contracts less well, so failure can appear long after the original event.'},
hfail:{chain:['Low output activates the sympathetic and renin–angiotensin systems','Vasoconstriction raises afterload and fluid retention raises preload','The extra load and hormones drive remodelling','ACE inhibitors lower afterload and block angiotensin II','Beta blockers blunt sympathetic drive; diuretics remove excess fluid'],tie:'The preload, contractility and afterload sliders show why: easing afterload and removing excess preload helps a weak ventricle.',a:'In appropriate patients, renin–angiotensin system inhibition and evidence-based beta blockers can improve outcomes and reduce maladaptive remodelling, while diuretics reduce excess fluid and relieve congestion. The regimen depends on the heart failure phenotype and patient-specific factors.'},
cad:{chain:['Aspirin blocks platelets, so clots are less likely on a plaque','A statin lowers LDL, slowing plaque growth and stabilising plaques','A beta blocker lowers heart rate and contractility, reducing oxygen demand','Less demand and less clotting mean fewer ischaemic events','Each drug breaks a different link in the chain'],tie:'The supply versus demand bars show the logic: raise supply, cut demand, and stop the clot.',a:'Aspirin prevents clot formation, statins slow and stabilise plaque, and beta blockers cut oxygen demand. Each acts on a different step.'},
htn:{chain:['Raised pressure rarely causes symptoms early','It injures artery walls and speeds atherosclerosis','The left ventricle thickens against the higher afterload','Strokes, heart attacks, heart failure and kidney disease follow years later','Lowering pressure early prevents the damage'],tie:'The radius slider shows that a small narrowing of the arterioles raises pressure a lot, because resistance goes with 1/r⁴.',a:'Damage accumulates silently over years. Treating pressure early prevents stroke, heart attack, heart failure and kidney disease even when the patient feels fine.'}});

{id:'obstr',sub:'patho',t:'Asthma, COPD & obstructive lung disease',pre:['gas','homeo'],src:'Respiratory 1, 3, 4',
learn:`<p>In <b>obstructive</b> lung disease the problem is getting air <b>out</b>: the airways are narrowed, so the FEV₁ (air blown out in the first second) falls more than the FVC (total air blown out), and the <b>FEV₁/FVC ratio is reduced</b> (a fixed cut-off of 0.7 is commonly used, or a lower limit of normal for age; COPD is confirmed with post-bronchodilator spirometry in the right clinical context). In <b>restrictive</b> disease the lungs cannot expand, so both FEV₁ and FVC fall and the ratio is normal or high.</p><p><b>Asthma</b> is a heterogeneous disease of chronic airway inflammation (allergic, type 1 hypersensitivity mechanisms are important in many patients, but not all asthma is allergen-driven) that makes the airways <b>hyperresponsive</b>, so triggers cause rapid, <b>reversible</b> narrowing from smooth-muscle contraction, swelling and mucus. Result: wheeze, cough, chest tightness, with symptoms that vary. Treatment: bronchodilators relax muscle; inhaled corticosteroids reduce inflammation.</p><p><b>COPD</b> (mostly from smoking): airflow obstruction that is <b>not fully reversible</b>, from alveolar destruction (emphysema: loss of elastic recoil so airways collapse on exhaling), chronic bronchitis (mucus and cough) and small airways disease. Air is trapped, the chest hyperinflates and gas exchange worsens. Stopping smoking is the key intervention.</p>`,
recall:[{q:'What spirometry pattern defines obstruction?',a:'A reduced FEV₁/FVC ratio (commonly below 0.7, or below the lower limit of normal).'},{q:'What is the key difference between asthma and COPD in reversibility?',a:'Asthma obstruction is largely reversible; COPD is not fully reversible.'},{q:'What causes most COPD?',a:'Cigarette smoking.'}],
apply:[{q:'FEV₁ is 2.0 L and FVC is 4.0 L. The ratio and interpretation are…',o:['0.5, obstructive','0.5, restrictive','2.0, normal','0.5, normal'],c:0,why:'2.0 ÷ 4.0 = 0.5, which is below 0.7: obstructive.'},{q:'Airflow improves markedly after a bronchodilator. This favours…',o:['asthma','emphysema only','pulmonary fibrosis','lung cancer'],c:0,why:'Reversible obstruction suggests asthma.'}],
explain:{q:'Explain obstructive versus restrictive lung disease and the mechanisms of asthma and COPD.',pts:['Obstructive: low FEV₁/FVC; restrictive: both reduced, ratio normal','Asthma: inflammation, hyperresponsiveness, reversible','COPD: smoking, emphysema, bronchitis, not fully reversible','Treatment logic: relax muscle, reduce inflammation, stop smoking']},
bq:'Why do patients with emphysema often breathe out through pursed lips?',
pc:['Susceptible airways are affected by exposures, triggers or underlying disease mechanisms','Inflammation, mucus changes, muscle contraction or loss of elastic recoil develop, depending on the disease','Airways narrow or collapse on exhalation','Expiratory airflow slows: low FEV₁/FVC','Air is trapped and the lungs hyperinflate','Wheeze, breathlessness and poor gas exchange'],
dp:'Alpha-1 antitrypsin deficiency is an inherited cause of early emphysema because elastase destroys elastic fibres unchecked. In a severe asthma attack a quiet chest and a rising PaCO₂ are danger signs because the patient is tiring. In COPD, chronic hypoxaemia can cause pulmonary hypertension and right heart failure (cor pulmonale). In patients at risk of hypercapnic respiratory failure, supplemental oxygen is titrated to a clinically appropriate target and the response monitored. Oxygen should not be withheld from a hypoxaemic patient. Excess oxygen can worsen hypercapnia in susceptible patients, partly by worsening ventilation–perfusion matching and through the Haldane effect. Gas transfer (DLCO) is reduced in emphysema.',
t2:Q('FEV₁ rises from 1.5 L to 2.4 L after a bronchodilator. What does this result most directly show?',['a marked bronchodilator response, supporting variable airflow obstruction','fixed obstruction (COPD)','restriction','a normal lung'],0,'A rise of this size is a marked bronchodilator response and supports variable airflow obstruction. The full spirometry pattern and clinical context are still needed for a diagnosis.'),
t3:Q('A smoker with COPD is short of breath. Why does stopping smoking help even after damage has occurred?',['It slows the accelerated decline in lung function and reduces inflammation','It restores destroyed alveoli','It cures the disease','It increases elastase'],0,'Quitting slows further loss of function, though destroyed alveoli do not regrow.')},
{id:'rfail',sub:'patho',t:'Respiratory failure & ventilation–perfusion',pre:['gas','ph'],src:'Respiratory 1, 8',
learn:`<p>The lungs must add O₂ to the blood and remove CO₂. <b>Respiratory failure</b> is failure of this job. <b>Type I</b> is <b>hypoxaemic</b> (often PaO₂ below about 60 mmHg, with normal or low CO₂): flooded, collapsed or underventilated alveoli cause low V/Q regions or intrapulmonary shunt, so less oxygen reaches the blood; the mix varies by disease and severity (pneumonia, pulmonary oedema, ARDS). <b>Type II</b> is <b>hypercapnic</b> (commonly PaCO₂ above about 45 to 50 mmHg; thresholds depend on context, including chronic baseline abnormalities): not enough ventilation to clear CO₂, from drug overdose, neuromuscular weakness, an exhausted COPD patient or chest wall problems.</p><p>Only a few mechanisms cause hypoxaemia: <b>hypoventilation</b>, <b>V/Q mismatch</b> (ventilation V and perfusion Q do not match), <b>diffusion impairment</b>, and <b>right-to-left shunt</b> (blood that bypasses ventilated alveoli). A true shunt (blood that meets no ventilated alveoli at all) responds poorly to extra oxygen because the shunted blood never meets the oxygen-enriched air. Low V/Q (underventilated but still perfused alveoli) responds to extra oxygen far better, and most lung disease lies on a spectrum between the two. Compensation is faster, deeper breathing, which blows off CO₂; in Type II the CO₂ cannot be cleared and respiratory acidosis develops. Treatment: oxygen, treat the cause, and support ventilation (non-invasive or invasive) when needed.</p>`,
recall:[{q:'What distinguishes Type I from Type II respiratory failure?',a:'Type I is low oxygen with normal or low CO₂; Type II is high CO₂ from inadequate ventilation.'},{q:'Name four mechanisms of hypoxaemia.',a:'Hypoventilation, V/Q mismatch, diffusion impairment and shunt.'},{q:'Why does a shunt respond poorly to oxygen?',a:'Blood bypasses ventilated alveoli, so it never meets the extra oxygen.'}],
apply:[{q:'Pneumonia fills alveoli with fluid. This most directly causes…',o:['hypoxaemia (Type I failure)','hypercapnia only','alkalosis only','polycythaemia'],c:0,why:'Flooded alveoli cannot oxygenate the blood passing them.'},{q:'An opioid overdose with slow, shallow breathing causes…',o:['hypoventilation and a high PaCO₂','a high PaO₂ with low CO₂','V/Q matching','no change'],c:0,why:'Reduced ventilation retains CO₂ and lowers oxygen.'}],
explain:{q:'Explain the types and mechanisms of respiratory failure.',pts:['Type I hypoxaemic versus Type II hypercapnic','Mechanisms: hypoventilation, V/Q mismatch, diffusion, shunt','Shunt responds poorly to oxygen','Respiratory acidosis in Type II; treat the cause and support ventilation']},
bq:'Why may supplemental oxygen improve hypoxaemia in pneumonia without fully correcting it?',
pc:['Alveoli are flooded, collapsed or underventilated','Blood passes unventilated lung units','PaO₂ falls (hypoxaemia)','The body may increase respiratory drive if it is able to','If ventilation is inadequate or muscles fatigue, CO₂ may rise and hypoxaemia may persist','Support ventilation while treating the cause'],
dp:'A normal A–a oxygen gradient, interpreted in context, supports hypoventilation as a cause of hypoxaemia, while a raised gradient suggests V/Q mismatch, shunt or diffusion impairment. Interpretation depends on age, inspired oxygen and clinical circumstances. ARDS is acute lung injury with widespread inflammation, capillary leak and low compliance; lung-protective ventilation with low tidal volumes improves survival. Hypoxic pulmonary vasoconstriction diverts blood from poorly ventilated areas, an adaptation that can fail in disease. In COPD with chronic CO₂ retention the kidneys retain bicarbonate (metabolic compensation).',
t2:Q('Which finding suggests hypoventilation as the cause of hypoxaemia?',['High PaCO₂ with a normal A–a gradient','Low PaCO₂ with a high A–a gradient','High PaO₂','Normal PaCO₂ only'],0,'Hypoventilation raises PaCO₂ and lowers PaO₂ with a normal gradient.'),
t3:Q('A ventilated patient with ARDS has severe hypoxaemia that barely improves with 100% oxygen. The best explanation is…',['a large intrapulmonary shunt through flooded alveoli','a lack of oxygen in the cylinder','excess ventilation of healthy lung','low haemoglobin only'],0,'Flooded alveoli have perfusion without ventilation, so extra oxygen does not reach that blood.')},
{id:'renal',sub:'patho',t:'Kidney failure, acid–base & electrolytes',pre:['ph','osmo'],src:'Kidney 1, 2, 3, 6',
learn:`<p>The kidneys excrete nitrogenous waste, fixed (non-volatile) acids, potassium, sodium and water (setting blood volume and pressure) and phosphate; they activate vitamin D and make erythropoietin. If they fail the result is <b>uraemia</b>: confusion, fatigue, nausea, itching, fluid overload and hypertension, anaemia, <b>hyperkalaemia</b> (arrhythmia risk), <b>metabolic acidosis</b> and bone and calcium disturbance.</p><p><b>Acute kidney injury (AKI)</b> is an abrupt fall in function over hours to days, often from poor perfusion (<b>pre-renal</b>: bleeding, vomiting, sepsis, low output), kidney damage itself (<b>intrinsic</b>: prolonged ischaemia, toxins) or blockage (<b>post-renal</b>). <b>Chronic kidney disease (CKD)</b> is defined by abnormalities of kidney structure or function that persist for at least three months (causes include diabetes, hypertension, glomerulonephritis, polycystic kidneys). It is staged by GFR and albuminuria. When nephrons are lost, the survivors filter more (<b>hyperfiltration</b>), which raises pressure inside the glomeruli and scars them: a vicious cycle toward end-stage disease.</p><p>Blood pH (7.35 to 7.45) is held stable by buffers, the lungs (volatile acid, CO₂) and the kidneys (fixed acids and bicarbonate). Kidney failure causes metabolic acidosis because fixed acids are not excreted.</p>`,
recall:[{q:'What are the three broad types of AKI by cause?',a:'Pre-renal (poor perfusion), intrinsic renal (kidney damage) and post-renal (obstruction).'},{q:'Why does CKD progress even after the original cause is controlled?',a:'Surviving nephrons hyperfilter, which raises glomerular pressure and scars them.'},{q:'Why does kidney failure cause metabolic acidosis?',a:'Fixed acids from metabolism cannot be excreted, so they accumulate.'}],
apply:[{q:'A patient with severe vomiting and low blood pressure has AKI. This is most likely…',o:['pre-renal','post-renal','glomerular','genetic'],c:0,why:'Poor kidney perfusion from volume loss is pre-renal AKI.'},{q:'Which complication of kidney failure can cause a life-threatening arrhythmia?',o:['hyperkalaemia','hypernatraemia','hypercalcaemia','polycythaemia'],c:0,why:'Potassium accumulates and disturbs cardiac conduction.'}],
explain:{q:'Explain how kidney failure arises and what it causes.',pts:['Kidney functions and uraemic features','AKI: pre-renal, intrinsic, post-renal','CKD: hyperfiltration and scarring cycle','Fixed acid retention causes metabolic acidosis']},
bq:'Why do patients with advanced CKD become anaemic and develop weak bones?',
pc:['Nephrons are damaged (diabetes, hypertension, inflammation)','Surviving nephrons hyperfilter','Glomerular pressure rises and scarring follows','GFR falls and waste, acid and potassium accumulate','Hormone production (erythropoietin, vitamin D) falls','Uraemia, anaemia, bone disease and cardiovascular disease'],
dp:'Creatinine and urea rise as GFR falls. At steady state creatinine is roughly inversely related to GFR, so a doubling corresponds to about a halving of GFR; during evolving AKI creatinine lags behind changes in kidney function, so interpret trends with baseline values, timing and clinical context. In advanced kidney failure, retention of unmeasured acids can produce a high-anion-gap metabolic acidosis; kidney disease can also be associated with normal-anion-gap acidosis, depending on stage and mechanism. ACE inhibitors can reduce intraglomerular pressure and slow progression of selected proteinuric kidney diseases, including diabetic CKD. They can raise potassium and cause a fall in GFR, especially with volume depletion or bilateral renal artery stenosis (or stenosis supplying a solitary functioning kidney), so kidney function and potassium need monitoring. NSAIDs and aminoglycosides can cause kidney injury in susceptible patients or under particular exposure conditions. Iodinated contrast is associated with acute kidney injury, especially in higher-risk patients, but the risk to people with preserved kidney function has been overstated, so assess it in context. Dialysis replaces filtration and fluid and electrolyte control but not all hormonal functions.',
t2:Q('A patient has a persistent eGFR of 25 mL/min/1.73 m² for at least three months (CKD G4). Which problem becomes more likely?',['hyperkalaemia and metabolic acidosis','polycythaemia','hypotension only','excess calcium'],0,'Low GFR reduces potassium and acid excretion.'),
t3:Q('A patient with CKD starts an ACE inhibitor and the potassium rises. The best explanation is…',['aldosterone falls, so potassium excretion falls on top of reduced GFR','the drug adds potassium','the heart rate falls','creatinine is lower'],0,'ACE inhibitors reduce aldosterone, which lowers potassium excretion; in CKD this can cause hyperkalaemia.')},
{id:'dm',sub:'patho',t:'Diabetes: insulin, glucose & complications',pre:['homeo','signal'],src:'Endocrine 7, 8, 9',
learn:`<p>After a meal, rising glucose is sensed by pancreatic <b>beta cells</b>, which release <b>insulin</b>. In skeletal muscle and fat, insulin moves GLUT4 glucose transporters to the cell membrane, so glucose uptake rises and blood glucose falls. In the liver, insulin suppresses glucose production and promotes glycogen and fat storage. Between meals <b>glucagon</b> from alpha cells acts mainly on the liver to increase glucose output through glycogen breakdown and gluconeogenesis; their contributions change with fasting duration.</p><p><b>Type 1 diabetes</b>: autoimmune destruction of beta cells, so absolute insulin lack. Glucose stays high (<b>hyperglycaemia</b>), spills into urine and drags water with it (<b>polyuria</b> and thirst), and fat is broken down into fatty acids and <b>ketones</b>, which can cause <b>diabetic ketoacidosis (DKA)</b>. <b>Type 2 diabetes</b>: <b>insulin resistance</b> with a relative lack of insulin (often with obesity), leading to chronic hyperglycaemia; ketoacidosis is less common, but the hyperosmolar state can occur.</p><p>Chronic hyperglycaemia damages small vessels (<b>retinopathy, nephropathy, neuropathy</b>) and large vessels (<b>atherosclerosis</b>: heart attack, stroke, peripheral disease). Treatment: insulin replacement in type 1; in type 2 lifestyle change, drugs that improve sensitivity or insulin supply, and control of blood pressure and lipids. A key acute hazard of treatment is <b>hypoglycaemia</b>.</p>`,
recall:[{q:'What are the main actions of insulin?',a:'It lowers blood glucose by moving glucose into muscle and fat cells, switches off liver glucose output, and promotes storage of glycogen and fat.'},{q:'What is the difference in mechanism between type 1 and type 2 diabetes?',a:'Type 1 is autoimmune loss of beta cells (insulin lack); type 2 is insulin resistance with relative insulin deficiency.'},{q:'Why does uncontrolled diabetes cause thirst and frequent urination?',a:'Glucose spills into the urine and draws water with it (osmotic diuresis).'}],
apply:[{q:'Which hormone raises blood glucose between meals?',o:['glucagon','insulin','oxytocin','aldosterone'],c:0,why:'Glucagon drives glycogen breakdown and gluconeogenesis.'},{q:'Ketones form in type 1 diabetes because…',o:['without insulin fat is broken down into fatty acids and ketones','insulin is excessive','glucose is low','the kidneys make ketones'],c:0,why:'Insulin normally restrains fat breakdown.'}],
explain:{q:'Explain how diabetes causes its symptoms and complications.',pts:['Insulin lowers glucose and drives storage; glucagon raises it','Type 1: absolute lack; type 2: resistance plus relative lack','Hyperglycaemia causes osmotic diuresis; lack of insulin causes ketones','Micro- and macrovascular complications; hypoglycaemia risk']},
bq:'Why does a patient with DKA breathe deeply and rapidly?',
pc:['Beta cells are lost or tissues resist insulin','Insulin action falls','Glucose stays high and the liver keeps making glucose','Glucose spills into urine: osmotic diuresis and thirst','Marked insulin deficiency with counter-regulatory hormones increases fat breakdown and ketone production','Chronic hyperglycaemia damages small and large vessels'],
dp:'HbA1c reflects average glucose over about 2 to 3 months. Common diagnostic thresholds are a fasting plasma glucose of 7.0 mmol/L (126 mg/dL) or more or an HbA1c of 6.5% (48 mmol/mol) or more. Without unequivocal hyperglycaemia the result is confirmed by repeat testing, and HbA1c can be unreliable when red-cell turnover or some haemoglobin conditions are abnormal. In DKA, total-body potassium is usually depleted through urinary losses even if the first serum potassium is normal or high. Insulin, correction of acidosis and fluid treatment can lower serum potassium, so potassium must be monitored and managed against measured levels and a current protocol, including before and during insulin treatment. The hyperosmolar hyperglycaemic state has very high glucose and dehydration with little ketosis, mainly in type 2. Autonomic neuropathy can blunt the warning symptoms of hypoglycaemia.',
t2:Q('A fasting glucose is 9 mmol/L on two occasions. According to common criteria this suggests…',['diabetes mellitus','normal glucose','hypoglycaemia','insulinoma'],0,'A fasting glucose of 7 mmol/L or more on repeat testing meets a diagnostic threshold.'),
t3:Q('A patient with DKA has a serum potassium of 4.5 mmol/L before insulin is started. Why is potassium monitored closely during DKA treatment?',['Insulin drives potassium into cells, so serum potassium can fall dangerously','Insulin raises potassium','Potassium is not affected by insulin','Ketones contain potassium'],0,'Total-body potassium is usually depleted in DKA, and insulin and correction of acidosis move potassium into cells, so the serum level can fall quickly. Management follows measured levels and a current protocol; this is a mechanism question only.')},
{id:'anemia',sub:'patho',t:'Anaemia & oxygen delivery',pre:['atp','cells'],src:'Blood 1, 2',
learn:`<p><b>Anaemia</b> is a haemoglobin concentration below the reference threshold for age, sex and pregnancy. It can reduce arterial oxygen content and tissue oxygen delivery, with effects depending on severity, speed of onset and cardiovascular reserve. Arterial oxygen content is approximately <b>CaO₂ = 1.34 × Hb (g/dL) × SaO₂ (as a fraction) + 0.003 × PaO₂ (mmHg)</b>, in mL O₂/dL, and oxygen delivery is <b>DO₂ = cardiac output (L/min) × CaO₂ (mL/dL) × 10</b>. So delivery falls if haemoglobin falls, if saturation falls, or if cardiac output falls.</p><p>Compensation: the heart pumps more (faster pulse, higher output), tissues extract more oxygen, breathing may increase, and the kidneys release erythropoietin to boost red cell production. Symptoms and signs follow the mechanism: fatigue, breathlessness on exertion, palpitations, pallor, and in severe cases chest pain or heart failure.</p><p>Classify by mechanism: <b>decreased production</b> (iron deficiency, B₁₂ or folate deficiency, marrow failure, chronic disease, kidney disease), <b>increased loss</b> (bleeding) or <b>increased destruction</b> (haemolysis, for example sickle cell disease). <b>Iron deficiency</b> is a leading cause worldwide (blood loss, poor intake, increased needs or poor absorption) and typically gives small, pale cells (<b>microcytic, hypochromic</b>). Always ask <b>why</b>, for example where the blood loss is.</p>`,
recall:[{q:'Write the equation for oxygen delivery.',a:'DO₂ = cardiac output × arterial oxygen content (CaO₂ ≈ 1.34 × Hb [g/dL] × SaO₂ [fraction] + 0.003 × PaO₂).'},{q:'Name the three broad mechanisms of anaemia.',a:'Decreased production, increased loss and increased destruction.'},{q:'What is a leading cause of anaemia worldwide?',a:'Iron deficiency.'}],
apply:[{q:'Haemoglobin halves while cardiac output and saturation stay the same. Oxygen delivery…',o:['halves','doubles','is unchanged','increases slightly'],c:0,why:'Content is proportional to Hb, so delivery halves.'},{q:'Small, pale red cells suggest…',o:['iron deficiency','B₁₂ deficiency','haemolysis only','polycythaemia'],c:0,why:'Iron is needed to make haemoglobin, so the cells are small and pale.'}],
explain:{q:'Explain how anaemia reduces oxygen delivery and how the body compensates.',pts:['DO₂ = CO × content (1.34 × Hb × SaO₂)','Compensation: faster heart, more extraction, erythropoietin','Mechanisms: production, loss, destruction','Iron deficiency: microcytic, hypochromic; find the cause']},
bq:'Why must an adult man with iron deficiency anaemia be investigated for a source of bleeding?',
pc:['Red cell mass falls (less made, lost or destroyed)','Haemoglobin and oxygen content fall','Oxygen delivery to tissues falls','Heart rate and output rise to compensate','Fatigue, breathlessness, pallor and palpitations appear','The cause is found and treated'],
dp:'MCV (mean cell volume) narrows the differential but does not diagnose the cause: microcytic (iron deficiency, thalassaemia, sometimes chronic disease), normocytic (acute blood loss, chronic disease, kidney disease, haemolysis) and macrocytic (B₁₂ or folate deficiency, alcohol, hypothyroidism). A raised reticulocyte count shows the marrow is responding, as in blood loss or haemolysis. In sickle cell disease the substituted valine lets HbS polymerise when deoxygenated, causing sickling, haemolysis and vessel occlusion. Transfusion decisions weigh symptoms and cardiovascular risk, not a single number.',
t2:Q('Hb 7 g/dL, SaO₂ 98%, cardiac output 5 L/min. Using CaO₂ ≈ 1.34 × Hb × SaO₂ (mL/dL) and DO₂ = CO × CaO₂ × 10, oxygen delivery is roughly…',['460 mL/min','1000 mL/min','230 mL/min','70 mL/min'],0,'CaO₂ = 1.34 × 7 × 0.98 ≈ 9.2 mL/dL; DO₂ ≈ 5 × 9.2 × 10 ≈ 460 mL/min, about half of the normal Hb 14 value.'),
t3:Q('A patient with slowly developing severe anaemia (Hb 5 g/dL) reports only mild breathlessness at rest. What best explains this?',['Gradual compensation: higher cardiac output and increased tissue oxygen extraction over time','The anaemia is not real','A haemoglobin of 5 is normal','The tissues need less oxygen'],0,'Slow-onset anaemia allows compensation, so symptoms can be milder than after acute blood loss. This does not make it safe: Hb 5 g/dL needs urgent clinical assessment and a search for the cause.')}];

obstr:{chain:['Emphysema destroys elastic tissue around airways','Small airways collapse during exhalation, trapping air','Pursed-lip breathing creates back-pressure in the airway','This keeps the airways open longer','Air empties better and breathlessness eases'],tie:'The flow curve shows slow emptying: anything that keeps airways open helps exhalation.',a:'Pursed lips add back-pressure that splints the weakened airways open, so air can leave more completely and breathlessness improves.'},
rfail:{chain:['Pneumonia fills some alveoli with fluid','Blood passing the worst-affected alveoli picks up little or no oxygen (low V/Q or shunt)','Blood from healthy alveoli can carry more oxygen with extra O₂','But it cannot fully make up for the unoxygenated blood','So oxygen helps partly while the cause is treated'],tie:'The V/Q view shows it: ventilated and perfused units can be improved, but units with perfusion and no ventilation cannot.',a:'Oxygen increases alveolar oxygen in regions that remain ventilated, but severe low V/Q regions or shunt limit the overall response, so the benefit is partial. The degree of improvement depends on the extent and nature of the lung involvement.'},
renal:{chain:['The kidneys make erythropoietin, which stimulates red cell production','Damaged kidneys make less of it, so anaemia develops','The kidneys also activate vitamin D','Less active vitamin D lowers calcium absorption','Calcium, phosphate and parathyroid disturbance weaken bone'],tie:'The nephron grid shows lost units: each lost job (waste, acid, potassium, hormones) becomes a feature of failure.',a:'Failing kidneys produce less erythropoietin and less active vitamin D, causing anaemia and mineral–bone disease along with the other features of uraemia.'},
dm:{chain:['Insulin lack causes fat breakdown and ketone production','Ketones are acids, so blood pH falls (metabolic acidosis)','Chemoreceptors drive the respiratory centre to increase ventilation in response to the acidosis','Deep, rapid breathing blows off CO₂ to raise pH','This compensation is called Kussmaul breathing'],tie:'This is the buffer equation in action: the lungs compensate for a metabolic acidosis.',a:'Ketoacidosis lowers pH, and the body compensates by blowing off CO₂ with deep, fast (Kussmaul) breathing, which raises pH toward normal.'},
anemia:{chain:['Adult men have little physiological iron loss','Iron deficiency therefore suggests chronic blood loss or malabsorption','Chronic gastrointestinal blood loss is an important cause to investigate','An ulcer or a cancer may be the cause','Treating only the anaemia would miss the underlying disease'],tie:'Anaemia is a finding, not a diagnosis: the oxygen-delivery equation tells you the effect, and the cause lies upstream.',a:'Men lose little iron normally, so confirmed iron deficiency points to chronic blood loss or poor absorption, and the GI tract is an important place to look (ulcer, cancer and other disease). Treating the anaemia alone would miss the cause.'}});
