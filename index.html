const W4=[
{id:'read',sub:'eng',t:'Reading scientific text',pre:[],
learn:`<p>Scientific texts are dense, so read in layers. <b>Survey</b> first: title, abstract, headings, figures and conclusion. <b>Question</b>: what do I need to learn? <b>Read</b> actively in sections, marking the <b>claim</b> and the <b>evidence</b> in each paragraph. <b>Recite</b>: close the page and say the main point in your own words. <b>Review</b> later, spaced out. This is the SQ3R method.</p><p>Look for <b>signpost words</b>: however, therefore, because, in contrast, for example. Decode unknown terms from context and word parts. Separate <b>facts</b> (evidence-backed statements), <b>inferences</b> (conclusions drawn from facts) and <b>opinions</b>. In a research paper the abstract states the question, methods, results and conclusion; check that the conclusion really follows from the results.</p>`,
recall:[{q:'What does SQ3R stand for?',a:'Survey, Question, Read, Recite, Review.'},{q:'What is the difference between a fact and an inference?',a:'A fact is an evidence-backed statement; an inference is a conclusion drawn from facts.'},{q:'What does an abstract contain?',a:'The question, methods, main results and conclusion of a paper.'}],
apply:[{q:'Which word signals a contrast?',o:['however','therefore','because','for example'],c:0,why:'However introduces a contrast.'},{q:'You finish a paragraph and cannot state its main point. The best next step is to…',o:['close the page, recite it in your own words, then re-read','keep reading faster','highlight everything','skip it'],c:0,why:'Retrieval shows what you did and did not take in.'}],
explain:{q:'Explain how to read a scientific article effectively.',pts:['Survey first, then read actively','Mark claim and evidence','Signpost words show relationships','Recite and review to remember']},
bq:'Why should you check that a paper conclusion really follows from its results?',
dp:'Reading speed matters less than comprehension: re-reading passively builds false confidence, whereas retrieval (closing the text and recalling) works better. Read figures by checking axes, units, error bars and sample size first. Scientific English uses hedging language (suggests, may, is associated with) to signal certainty, and Greek and Latin word parts; notice the difference between association and causation. Keep a glossary of new terms and review it at spaced intervals.',
t2:Q('A paper states "X was associated with Y". Which interpretation is most accurate?',['A relationship was observed; it does not by itself prove X caused Y','X caused Y','Y caused X','There is no relationship'],0,'Association does not prove causation, and hedged wording matters.'),
t3:Q('A study of 12 patients reports a 50% improvement and concludes a drug is "highly effective for everyone". What is the main concern?',['The sample is small and the conclusion goes beyond the data','Fifty percent is too low to matter','The study mentions a drug','Twelve is the ideal sample size'],0,'Small samples are unreliable and the claim generalises beyond the evidence.')},
{id:'write',sub:'eng',t:'Writing clearly for science and medicine',pre:['read'],
learn:`<p>Clear writing helps readers act correctly. Build each paragraph around <b>one idea</b>: a topic sentence (the claim), evidence, and a sentence explaining why it matters. Use <b>plain, precise language</b>: short sentences, exact terms, numbers with units, and the active voice where it is clearer ('We measured…'). Avoid vague words ('a lot', 'some') and unexplained abbreviations.</p><p>Research reports follow <b>IMRaD</b>: <b>I</b>ntroduction (why), <b>M</b>ethods (how), <b>R</b>esults (what was found) <b>a</b>nd <b>D</b>iscussion (what it means). <b>Plan</b>, <b>draft</b>, then <b>edit</b>: cut unnecessary words, check facts and units, and read aloud. In clinical writing be exact: write 'units' in full, give drug names and doses clearly, and keep notes objective.</p>`,
recall:[{q:'What does IMRaD stand for?',a:'Introduction, Methods, Results and Discussion.'},{q:'What makes a good paragraph?',a:'One idea: a topic sentence, evidence and explanation.'},{q:'Why give units with numbers?',a:'A number without a unit is ambiguous and can cause serious errors.'}],
apply:[{q:'Which sentence is more precise?',o:['"Blood pressure fell from 160/100 to 130/85 mmHg after 4 weeks."','"Blood pressure got a lot better."','"BP improved."','"It was better."'],c:0,why:'It gives values, units and a time.'},{q:'In IMRaD, where do you report what you found?',o:['Results','Introduction','Methods','Discussion'],c:0,why:'The Results section presents the findings.'}],
explain:{q:'Explain how to write clearly for science and medicine.',pts:['One idea per paragraph: claim, evidence, explanation','Plain, precise language with numbers and units','IMRaD structure','Plan, draft, edit, read aloud']},
bq:'Why can vague or sloppy writing be dangerous in clinical notes?',
dp:'Write for the reader: busy clinicians want the key message first. Use parallel structure for lists, replace noun-heavy phrases ("perform an assessment of" becomes "assess"), and prefer common words ("use" over "utilise"). Define abbreviations at first use and avoid them in patient letters. Reporting guidelines (CONSORT for trials, PRISMA for reviews, STROBE for observational studies) make research reports complete. Proofread numbers separately: transposed digits are a common error.',
t2:Q('Which rewrite is clearest?',['"We measured systolic blood pressure in 40 patients before and after treatment."','"Measurement of systolic blood pressure was performed by us on a number of patients."','"BP was measured, kind of."','"Patients had BP stuff done."'],0,'It is specific, active and concise.'),
t3:Q('A discharge letter says "Take 1 tab bd." Why is this poor practice for a patient letter?',['Abbreviations and unclear wording can be misunderstood; write the instruction in full','It is too long','It is too clear','It uses numbers'],0,'Patient letters should avoid abbreviations such as "bd" and say "twice a day" with the drug name and dose.')},
{id:'evidence',sub:'eng',t:'Evaluating sources & avoiding plagiarism',pre:['read','stats'],
learn:`<p>Not all sources are equally reliable. Prefer <b>peer-reviewed</b> articles, guidelines from recognised bodies and textbooks, and check the <b>author</b>, <b>date</b>, <b>methods</b>, <b>sample size</b>, <b>funding</b> and conflicts of interest. A <b>primary</b> source reports original research; a <b>secondary</b> source (a review or textbook) summarises it.</p><p>The <b>hierarchy of evidence</b> for treatment questions, strongest to weakest: <b>systematic reviews and meta-analyses</b>, <b>randomised controlled trials</b>, <b>cohort studies</b>, <b>case-control studies</b>, <b>case reports and series</b>, then <b>expert opinion</b>. Higher levels reduce bias, but the best design depends on the question. <b>Plagiarism</b> is using someone else's words or ideas without credit. Paraphrase in your own words and <b>cite</b> the source (medicine often uses Vancouver numbering); use quotation marks for exact words.</p>`,
recall:[{q:'Which study design is at the top of the evidence hierarchy for treatments?',a:'Systematic reviews and meta-analyses.'},{q:'What is plagiarism?',a:'Using someone else words or ideas without crediting them.'},{q:'What is the difference between primary and secondary sources?',a:'Primary reports original research; secondary summarises or interprets it.'}],
apply:[{q:'Which gives stronger evidence about a treatment?',o:['A randomised controlled trial','A single case report','An expert opinion','A personal blog'],c:0,why:'Randomised trials compare groups and reduce bias.'},{q:'You copy a sentence from a website into your essay and change two words. This is…',o:['plagiarism if uncredited','acceptable paraphrase','good referencing','original writing'],c:0,why:'You must credit the source and properly paraphrase.'}],
explain:{q:'Explain how to judge a source and avoid plagiarism.',pts:['Check author, date, methods, sample size, funding','Primary versus secondary sources','Hierarchy of evidence','Paraphrase and cite; avoid plagiarism']},
bq:'Why is one dramatic case report not enough to change clinical practice?',
dp:'The hierarchy is a guide: a well-conducted cohort study can be more reliable than a poor trial, and trials are unsuitable for some questions (rare harms, ethics). Publication bias means positive results are more likely to be published, and preprints are not peer reviewed. Predatory journals charge fees without real review. A meta-analysis combines results statistically, but if the included studies are biased the combined result is too. Tools such as GRADE rate the certainty of evidence. Universities use similarity-checking software and treat plagiarism as misconduct.',
t2:Q('A news story reports that a supplement "cured" a patient. What is the best next step?',['Look for controlled studies or systematic reviews on the supplement','Believe it because it was published','Share it with patients immediately','Ignore all research'],0,'A single story is weak evidence. Check stronger studies.'),
t3:Q('A meta-analysis combines ten small, poorly designed trials. What is the most reasonable view of its conclusion?',['It may still be unreliable because the included studies are biased','It must be correct because it is a meta-analysis','It is worthless because meta-analyses never work','It proves causation'],0,'A meta-analysis is only as good as the studies it includes.')}];

write:{chain:['Notes are read by many people, often under time pressure','Vague words can be read in different ways','Missing units or unclear abbreviations cause misreading','Wrong doses or missed information can harm patients','Precise, plain writing reduces risk'],tie:'Precision in an essay becomes safety in a clinical note.',a:'Clinical notes are read quickly by many people, so vague wording, missing units and unclear abbreviations can be misread and lead to wrong doses or missed information. Precise, plain writing reduces that risk.'},
