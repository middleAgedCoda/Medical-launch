{id:'liver',sub:'patho',t:'Liver failure, cirrhosis, jaundice & ascites',pre:['homeo','cells'],src:'Gastrointestinal 8, 9, 10',
learn:`<p>The liver makes albumin and clotting factors, processes bilirubin and ammonia, stores glycogen, and filters blood arriving from the gut through the <b>portal vein</b>. <b>Jaundice</b> is yellow discolouration from raised bilirubin. Old red cells are broken down to bilirubin, carried on albumin to the liver, <b>conjugated</b> (made water-soluble) and secreted in bile. So jaundice can be <b>pre-hepatic</b> (too much breakdown, as in haemolysis), <b>hepatic</b> (hepatocellular dysfunction or intrahepatic cholestasis) or <b>post-hepatic</b> (extrahepatic obstruction to bile flow: pale stools, dark urine). These groups can overlap.</p><p><b>Cirrhosis</b> is the end result of long-term liver injury (alcohol, viral hepatitis, fatty liver): hepatocytes die, stellate cells lay down scar tissue, regeneration is disorganised, and scar distorts the blood channels. Two consequences follow. <b>Loss of function</b>: low albumin (oedema, ascites), reduced clotting-factor synthesis (raised INR; cirrhosis gives a complex, rebalanced clotting state, so INR alone does not predict bleeding), poor bilirubin handling (jaundice) and poor ammonia clearance (confusion: encephalopathy). <b>Portal hypertension</b>: blood backs up in the portal system, causing <b>ascites</b>, an enlarged spleen and <b>varices</b> (swollen veins in the oesophagus that can bleed massively) as blood finds bypass routes.</p>`,
recall:[{q:'What are the three broad causes of jaundice?',a:'Pre-hepatic (too much breakdown), hepatic (the liver cannot process bilirubin) and post-hepatic (bile flow blocked).'},{q:'Which two groups of consequences does cirrhosis produce?',a:'Loss of liver function and portal hypertension.'},{q:'Why does cirrhosis cause ascites?',a:'Low albumin lowers oncotic pressure and portal hypertension raises capillary pressure, so fluid leaks into the abdomen.'}],
apply:[{q:'Pale stools, dark urine and jaundice suggest…',o:['post-hepatic obstruction of bile flow','haemolysis only','normal bile flow','low albumin only'],c:0,why:'Bile cannot reach the gut, so stools are pale while conjugated bilirubin spills into the urine.'},{q:'Which problem arises from portal hypertension?',o:['oesophageal varices','low albumin','low clotting factors','hypoglycaemia'],c:0,why:'Blood diverts through swollen veins that can bleed; the others come from loss of function.'}],
explain:{q:'Explain how cirrhosis causes its main features.',pts:['Bilirubin pathway and three types of jaundice','Cirrhosis: scarring and loss of hepatocytes','Loss of function: albumin, clotting factors, bilirubin, ammonia','Portal hypertension: ascites, spleen, varices']},
bq:'Why can a patient with cirrhosis bleed and also become confused?',
pc:['Long-term injury kills hepatocytes','Stellate cells lay down scar tissue (fibrosis)','Scar distorts blood flow and portal pressure rises','The liver makes less albumin and clotting factors and clears less ammonia','Ascites, varices, bleeding tendency and encephalopathy appear','Decompensation and liver failure'],
dp:'Child-Pugh and MELD scores grade severity. In cirrhosis, ascites can become infected (spontaneous bacterial peritonitis), and variceal bleeding is treated with endoscopy and drugs that lower portal pressure. Hepatorenal syndrome is kidney failure from altered blood flow in advanced liver disease. Lactulose promotes bowel movements and acidifies colonic contents, helping trap ammonia as ammonium and increase nitrogen excretion. Hepatic encephalopathy is diagnosed clinically; the ammonia level alone does not reliably establish severity. Paracetamol overdose and some viruses cause acute liver failure, which can develop in days.',
t2:Q('Jaundice with raised unconjugated bilirubin, normal liver tests, anaemia and raised reticulocytes is most likely…',['pre-hepatic (haemolysis)','post-hepatic','cirrhosis','none of these'],0,'Excess red cell breakdown overwhelms the capacity of the liver to conjugate bilirubin.'),
t3:Q('A man with cirrhosis vomits a large amount of blood. The most likely source is…',['oesophageal varices from portal hypertension','a viral infection','low albumin','gallstones'],0,'Portal hypertension forms fragile varices that can rupture, and low clotting factors worsen the bleeding. This is a mechanism question: vomiting blood is an emergency.')},
{id:'stroke',sub:'patho',t:'Stroke, brain injury & raised pressure',pre:['homeo','cells'],src:'Neurology 2, 3',
learn:`<p><b>Stroke</b> is sudden loss of brain function from a vascular cause. About 70 to 80% are <b>ischaemic</b> (a clot or embolus blocks an artery) and 20 to 30% are <b>haemorrhagic</b> (a vessel bursts: bleeding into brain tissue, often from hypertension damaging small penetrating arteries, or into the subarachnoid space, often from an aneurysm). Severe interruption of blood flow can injure neurons within minutes, with the extent depending on residual flow, collateral circulation and duration; mature neurons have limited replacement capacity. Around the dead <b>core</b> sits a <b>penumbra</b> of threatened but salvageable tissue, which is why speed matters: restoring flow early (clot-dissolving drugs or clot retrieval) saves penumbra, whereas those drugs would be dangerous in a bleed, so urgent brain imaging (commonly non-contrast CT, with vascular imaging or MRI when indicated) comes first; an early normal CT does not exclude ischaemic stroke.</p><p>Symptoms follow the artery and brain area affected: one-sided weakness or numbness, speech problems, loss of vision, imbalance. Risk factors: hypertension, atrial fibrillation (clots form in the atrium and travel to the brain), atherosclerosis, diabetes and smoking.</p><p>The skull is a closed box, so swelling or bleeding raises <b>intracranial pressure</b> and can squeeze the brain through openings (herniation). Traumatic brain injury has a <b>primary</b> injury at impact and a <b>secondary</b> injury from excitotoxicity, free radicals, swelling and low oxygen or blood pressure; preventing secondary injury is the treatment goal.</p>`,
recall:[{q:'What are the two main types of stroke?',a:'Ischaemic (blocked artery) and haemorrhagic (bleeding).'},{q:'What is the penumbra?',a:'Threatened but salvageable tissue around the dead core of an infarct.'},{q:'Why is brain imaging needed before giving clot-dissolving drugs?',a:'To identify a haemorrhage, which these drugs would make worse; an early normal CT does not exclude ischaemic stroke.'}],
apply:[{q:'Atrial fibrillation raises stroke risk because…',o:['clots form in the atrium and can travel to the brain','it lowers blood pressure','it thickens the skull','it causes bleeding'],c:0,why:'Stasis in the fibrillating atrium allows clots that embolise to the brain.'},{q:'Rising intracranial pressure in a closed skull can cause…',o:['herniation of the brain','anaemia','jaundice','a rash'],c:0,why:'Brain tissue can be squeezed through the openings in the skull.'}],
explain:{q:'Explain ischaemic versus haemorrhagic stroke and why time matters.',pts:['Ischaemic versus haemorrhagic stroke','Core, penumbra and time','Symptoms follow the artery and area','Closed skull: raised ICP; primary versus secondary injury']},
bq:'Why is time so important in an ischaemic stroke, and why is brain imaging needed first?',
pc:['An artery is blocked or ruptures','Blood flow and oxygen to a brain region fall','Neurons in the core die within minutes','The penumbra survives only briefly without reperfusion','Swelling and raised pressure may follow','Without timely reperfusion when indicated, tissue may infarct and leave a lasting deficit'],
dp:'Atrial fibrillation increases cardioembolic stroke risk. Anticoagulation is considered according to stroke-risk assessment, bleeding risk, contraindications and current guidelines. Carotid artery stenosis can cause transient ischaemic attacks (TIAs), which are warnings. Subarachnoid haemorrhage causes a sudden severe headache; blood in the CSF can cause vasospasm and hydrocephalus. Brain swelling after a large stroke can peak at 2 to 5 days. Cushing triad (hypertension, bradycardia and abnormal respiration) is a late, ominous sign of markedly raised intracranial pressure; its absence does not exclude dangerous pressure.',
t2:Q('Which description best fits the penumbra?',['Hypoperfused tissue that is at risk but still salvageable','Tissue that is already dead','Tissue with extra blood flow','Normal tissue'],0,'Penumbra tissue is threatened but can be saved if flow returns in time.'),
t3:Q('A patient with atrial fibrillation suddenly loses power on one side. The most likely mechanism is…',['an embolus from the heart blocking a cerebral artery','low blood sugar only','a viral infection','a vitamin deficiency'],0,'Stasis in the fibrillating atrium allows clots to form and embolise to the brain. This is a mechanism question: sudden weakness needs emergency care.')},
{id:'shock',sub:'patho',t:'Infection, sepsis & shock',pre:['homeo','fluids'],src:'Infectious 1, 6',
learn:`<p>Most microbes are harmless; <b>pathogens</b> cause disease by multiplying and damaging tissue or releasing toxins. Defence has three levels: <b>barriers</b> (skin, gastric acid, the mucociliary escalator), the <b>innate</b> response (acute inflammation, phagocytes, complement) and the <b>adaptive</b> response (lymphocytes and antibodies). Infection spreads when barriers are breached or immunity is weak.</p><p><b>Sepsis</b> is a dysregulated host response to infection that causes organ dysfunction. Mediators released throughout the body cause widespread <b>vasodilation</b> and <b>capillary leak</b>: vessels dilate (resistance falls), fluid leaks out (volume falls) and blood pressure drops (<b>septic shock</b> is a severe subset of sepsis: in the Sepsis-3 definition, vasopressors are needed to keep MAP at or above 65 mmHg with lactate above 2 mmol/L despite adequate fluid resuscitation; persistent low pressure alone is not enough). Tissues are under-perfused, lactate often rises and organs fail (kidneys, lungs, brain, liver). Early signs: fever or low temperature, fast heart rate, fast breathing, confusion.</p><p><b>Shock</b> means a circulation that cannot meet tissue needs, with four mechanisms: <b>hypovolaemic</b> (low volume), <b>cardiogenic</b> (pump failure), <b>distributive</b> (vasodilation, as in sepsis or anaphylaxis) and <b>obstructive</b> (a blockage such as pulmonary embolism). Treatment follows the cause: antibiotics and source control for sepsis, fluids, vasopressors, oxygen, and support of failing organs.</p>`,
recall:[{q:'List the four mechanisms of shock.',a:'Hypovolaemic, cardiogenic, distributive and obstructive.'},{q:'Why does sepsis lower blood pressure?',a:'Mediators cause vasodilation and capillary leak, so resistance and volume both fall.'},{q:'Name the three levels of defence against infection.',a:'Barriers, innate immunity and adaptive immunity.'}],
apply:[{q:'A patient in anaphylaxis has widespread vasodilation. This is which type of shock?',o:['distributive','hypovolaemic','cardiogenic','obstructive'],c:0,why:'Vasodilation with normal volume and pump is distributive shock.'},{q:'Massive bleeding causes which type of shock?',o:['hypovolaemic','distributive','obstructive','cardiogenic'],c:0,why:'Low circulating volume is hypovolaemic shock.'}],
explain:{q:'Explain how sepsis causes shock and how treatment follows the mechanism.',pts:['Three levels of defence','Sepsis: dysregulated response, vasodilation and capillary leak','Four types of shock','Treatment follows the mechanism']},
bq:'Why do septic patients need antibiotics, fluids and sometimes vasopressors?',
pc:['A pathogen breaches the barriers','The immune response releases mediators widely','Vessels dilate and capillaries leak','Blood pressure falls and tissues are under-perfused','Lactate may rise and organs fail','Antibiotics, fluids and vasopressors restore perfusion'],
dp:'Lactate may rise in shock because of impaired perfusion, adrenergic-driven glycolysis, altered cell metabolism and reduced clearance. It is a severity and trend marker in context, not a direct measure of tissue oxygen or proof of anaerobic metabolism. A MAP target of around 65 mmHg is commonly used initially in adult septic shock, then individualised to perfusion, prior blood pressure, comorbidities and response. Early antibiotics improve survival in septic shock. Obstructive causes include tension pneumothorax, tamponade and pulmonary embolism. Cold, clammy skin points to low-output states; warm, flushed skin in early sepsis reflects vasodilation.',
t2:Q('In some patients with early distributive (septic) shock, which finding may occur because vascular resistance is low?',['Warm, flushed peripheries','Cold, clammy skin','A very small heart','Slow breathing'],0,'Low systemic vascular resistance can give warm peripheries early, but this is not universal and cannot reliably distinguish sepsis from hypovolaemia on its own.'),
t3:Q('A patient with sepsis stays hypotensive after fluids. Why are vasopressors used?',['They constrict vessels to restore vascular resistance','They kill bacteria','They add volume','They slow the heart'],0,'Pressure equals output times resistance, and in sepsis the resistance is low.')},
{id:'axis',sub:'patho',t:'Hormone axes & feedback',pre:['homeo','signal'],src:'Endocrine 1 to 6, 10',
learn:`<p>Many endocrine axes use hypothalamic signals to regulate pituitary hormones, which regulate a target gland. The final hormone usually <b>feeds back negatively</b>, suppressing the levels above; the arrangement varies by hormone (prolactin, for example, is held back by dopamine, and posterior pituitary hormones come from hypothalamic neurons). Examples: <b>CRH → ACTH → cortisol</b> and <b>TRH → TSH → thyroid hormones (T4, T3)</b>.</p><p>The pattern of levels tells you <b>where the fault is</b>. <b>Primary</b> failure of the target gland (an underactive thyroid): the final hormone is low, feedback is lost and the pituitary hormone is <b>high</b>. <b>Secondary</b> failure of the pituitary: both the pituitary hormone and the final hormone are low. Excess follows the same logic: in Graves disease T4 is high and TSH is <b>low</b>, whereas a TSH-secreting pituitary tumour gives high levels of both.</p><p>Cortisol is essential for life: it raises glucose, supports blood pressure and modulates inflammation. Too little (adrenal insufficiency) causes weakness, low blood pressure, low glucose and, in crisis, shock; too much (Cushing syndrome from prolonged glucocorticoid excess: steroid medicines are a common cause, and endogenous causes include pituitary and adrenal disease) causes weight gain, high blood pressure, high glucose, thin skin and bone loss. Long-term steroid tablets suppress the axis, so stopping them suddenly is dangerous. Calcium is controlled by a similar loop: low calcium stimulates parathyroid hormone, which increases renal calcium reabsorption, promotes phosphate excretion, stimulates renal activation of vitamin D (which increases gut absorption) and indirectly increases bone resorption.</p>`,
recall:[{q:'What is negative feedback in a hormone axis?',a:'The final hormone suppresses the releasing and trophic hormones above it.'},{q:'What pattern suggests primary hypothyroidism?',a:'Low thyroid hormone with a high TSH.'},{q:'Why is stopping long-term steroid tablets suddenly dangerous?',a:'The axis is suppressed, so the body cannot make enough cortisol quickly.'}],
apply:[{q:'Low T4 with a low TSH suggests…',o:['a pituitary (secondary) cause','primary hypothyroidism','Graves disease','normal function'],c:0,why:'Both levels are low, so the pituitary is not driving the thyroid.'},{q:'In Graves disease the TSH is typically…',o:['low','high','always normal','impossible to measure'],c:0,why:'High thyroid hormone suppresses TSH by negative feedback.'}],
explain:{q:'Explain hormone axes and how the pattern of levels localises a fault.',pts:['The axis and negative feedback','Primary versus secondary: read the pituitary hormone','Cortisol excess and deficiency','Steroid suppression of the axis; calcium and PTH loop']},
bq:'Why do patients on long-term steroid tablets need care when stopping them or when they become severely ill?',
pc:['A target gland is damaged or switched off','The final hormone level falls (or rises)','Feedback to the pituitary changes','In a typical axis, primary gland failure raises the trophic hormone and central failure lowers both','Symptoms follow the hormone deficit or excess','Treatment replaces, blocks or removes the source'],
dp:'Adrenal crisis (low blood pressure, low glucose, vomiting) is treated urgently with hydrocortisone and fluids. Cushing disease is a pituitary ACTH-secreting tumour, and ectopic ACTH can come from lung tumours. Primary aldosteronism causes hypertension; potassium may be low but is often normal. Hypercalcaemia is often from primary hyperparathyroidism or cancer. Thyroid storm and myxoedema coma are life-threatening extremes.',
t2:Q('TSH is high and free T4 is low. This pattern indicates…',['primary hypothyroidism','secondary hypothyroidism','hyperthyroidism','a normal axis'],0,'The thyroid is failing and feedback to the pituitary is lost, so TSH rises.'),
t3:Q('A patient on high-dose prednisolone for months has a low ACTH and a low morning cortisol. The best explanation is…',['suppression of the axis by negative feedback from the steroid taken','Addison disease from autoimmune destruction','a pituitary tumour','a normal response'],0,'External steroid suppresses CRH and ACTH, so the adrenals stop making cortisol.')},
{id:'clot',sub:'patho',t:'Clotting, thrombosis & pulmonary embolism',pre:['homeo','fluids'],src:'Blood 5; Respiratory 7',
learn:`<p><b>Haemostasis</b> stops bleeding in three steps: vessel <b>vasospasm</b>, a <b>platelet plug</b> and a <b>fibrin clot</b> from the coagulation cascade. Platelet problems often cause mucocutaneous bleeding (petechiae, nosebleeds); clotting-factor deficiencies classically cause deeper bleeding (joints, muscle haematomas). These are patterns, not absolute rules. Bleeding arises from too few or faulty platelets, or too few or faulty clotting factors (liver disease, haemophilia, warfarin).</p><p>The opposite problem is clotting when it is not needed: <b>thrombosis</b>. <b>Virchow triad</b> lists the three drivers: <b>stasis</b> of blood flow (immobility, long flights, atrial fibrillation), <b>endothelial injury</b> (surgery, trauma, plaque rupture) and <b>hypercoagulability</b> (cancer, pregnancy, inherited conditions, some drugs). In the leg this gives <b>deep vein thrombosis (DVT)</b>: a swollen, painful, warm leg. A piece can break off, travel through the right heart and lodge in the lungs as a <b>pulmonary embolism (PE)</b>. The blocked region is ventilated but underperfused (dead space), the pulmonary artery pressure can rise and strain the right ventricle, and hypoxaemia, when present, also reflects redistribution of blood flow and low V/Q regions. Effects vary with clot size and cardiopulmonary reserve, from breathlessness and chest pain to collapse. Treatment: anticoagulants to stop the clot growing, clot-dissolving drugs or removal in severe cases, and prevention (mobilisation, compression, prophylactic anticoagulation).</p>`,
recall:[{q:'List the three steps of haemostasis.',a:'Vasospasm, platelet plug and fibrin clot.'},{q:'State Virchow triad.',a:'Stasis, endothelial injury and hypercoagulability.'},{q:'How does a DVT cause a pulmonary embolism?',a:'A fragment breaks off, travels through the right heart and blocks a pulmonary artery.'}],
apply:[{q:'Petechiae and nosebleeds point to a problem of…',o:['platelets','clotting factors only','red cells','white cells'],c:0,why:'Platelet plug problems cause mucosal and skin bleeding.'},{q:'A long-haul flight mainly raises clot risk through…',o:['stasis','endothelial injury','hypercoagulability','vitamin loss'],c:0,why:'Sitting still slows venous flow.'}],
explain:{q:'Explain bleeding versus clotting and how a DVT becomes a PE.',pts:['Haemostasis: spasm, platelet plug, fibrin clot','Platelet versus coagulation bleeding patterns','Virchow triad','DVT leading to PE: dead space and right ventricular strain']},
bq:'Why does a pulmonary embolism cause breathlessness and low oxygen even though the lungs are not diseased?',
pc:['Stasis, injury or hypercoagulability promotes a clot in a leg vein (DVT)','A fragment breaks off (embolus)','It travels through the right heart to the pulmonary artery','The lung segment is ventilated but not perfused (dead space)','Pulmonary pressure and right ventricular strain rise','Breathlessness, low oxygen and, in severe cases, collapse'],
dp:'D-dimer is a fibrin breakdown product; it helps rule out clots when probability is low, but raised levels are non-specific. Unfractionated heparin potentiates antithrombin against thrombin and factor Xa; low-molecular-weight heparins act mainly against factor Xa; direct oral anticoagulants inhibit factor Xa or thrombin depending on the drug; warfarin reduces vitamin K dependent factors. Bleeding is their main risk. Antiplatelet drugs such as aspirin are especially important in platelet-rich arterial clots; they are not substitutes for anticoagulation when that is indicated for DVT or PE. Right ventricular strain on ECG or echocardiogram suggests a large PE. A paradoxical embolus can cross a patent foramen ovale into the arterial circulation and cause a stroke.',
t2:Q('A woman on a long flight develops a swollen, painful calf. The main mechanism is…',['stasis promoting a deep vein thrombosis','a ruptured artery','a viral infection','low platelets'],0,'Immobility slows venous flow, one arm of Virchow triad.'),
t3:Q('After a hip operation a patient suddenly becomes breathless with low oxygen and a clear chest X-ray. The most likely mechanism is…',['a pulmonary embolus blocking blood flow to ventilated lung','asthma','a pneumothorax only','anaemia'],0,'Surgery causes injury and immobility, favouring DVT and PE, which can cause breathlessness and hypoxaemia with a relatively unremarkable chest X-ray. A normal X-ray does not establish PE; diagnosis needs clinical assessment and appropriate testing. This is a mechanism question: sudden breathlessness needs emergency care.')}];
Object.assign(BR,{
liver:{chain:['The liver makes most clotting factors, so synthesis can fall','The INR rises, and platelets and other pathways are altered too, so bleeding risk depends on the overall picture','Portal hypertension creates fragile varices','Ammonia from the gut is not cleared by the damaged liver','Ammonia reaches the brain and causes confusion (encephalopathy)'],tie:'The liver grid shows lost and scarred units: each lost job becomes a feature of failure.',a:'Cirrhosis reduces clotting-factor synthesis and alters platelets and other haemostatic pathways, while portal hypertension produces fragile varices; reduced ammonia clearance can cause confusion.'},
stroke:{chain:['Neurons die within minutes and do not regenerate','A penumbra of salvageable tissue surrounds the core','Restoring flow early saves the penumbra','Imaging identifies bleeding first because clot-dissolving drugs would worsen it','So the quickest safe pathway is imaging, then reperfusion where indicated'],tie:'The slider shows the core growing with time and the penumbra shrinking.',a:'Brain tissue is lost minute by minute, and restoring flow only helps if there is salvageable penumbra. A scan first prevents giving clot-dissolving drugs to someone who is bleeding.'},
shock:{chain:['Appropriate antimicrobials target the suspected or identified pathogen, with source control for the focus of infection','Fluids replace the volume lost by capillary leak','Vasopressors constrict vessels to restore resistance and pressure','Oxygen and organ support help tissues cope meanwhile','Each treatment targets a different step of the chain'],tie:'The vascular tone and volume sliders show how each fix raises pressure.',a:'Antimicrobials and source control address the infection, fluids restore volume where needed and vasopressors restore vascular tone, so together they support perfusion pressure while the organs recover; selection and timing follow the clinical situation and local protocols.'},
axis:{chain:['Steroid tablets provide cortisol from outside','High cortisol suppresses CRH and ACTH','Prolonged exposure can suppress ACTH and cause adrenal cortical atrophy','Stopping the tablets leaves the adrenals unable to respond quickly','The patient can develop adrenal insufficiency, especially under stress'],tie:'The axis chart shows low ACTH with high cortisol from tablets: the adrenals are asleep.',a:'Prolonged systemic steroids can suppress the axis and cause adrenal atrophy, depending on dose, duration and the individual. Stopping suddenly, or serious illness, can leave the body unable to make enough cortisol.'},
clot:{chain:['The blocked pulmonary vessel stops blood reaching ventilated alveoli','This wasted ventilation is dead space','Blood is diverted to other areas, mismatching ventilation and perfusion','Pulmonary pressure rises and strains the right ventricle','Gas exchange can fall and the heart may struggle: breathlessness and, in some patients, hypoxaemia'],tie:'The V/Q picture again: dead space and diversion explain the hypoxaemia.',a:'The embolus blocks perfusion to ventilated lung, creating dead space and V/Q mismatch, while the raised pulmonary pressure strains the right ventricle.'}});

{id:'skin',sub:'patho',t:'Skin: barrier, infection & rash',pre:['cells','homeo'],src:'Skin 1 to 5',
learn:`<p>The skin is a <b>barrier</b> and a thermostat. The <b>epidermis</b> (keratinised, renewed every few weeks) keeps microbes and water out and water in; the <b>dermis</b> holds collagen, vessels, nerves and glands; the <b>hypodermis</b> stores fat. When the barrier is breached (cuts, burns, eczema, bites) microbes enter: superficial infection is <b>impetigo</b>, spread into the dermis and hypodermis is <b>cellulitis</b> (red, hot, swollen, painful skin with fever), and cellulitis can occasionally lead to systemic infection and sepsis (sepsis can occur even when blood cultures are negative). Common organisms are <i>Staphylococcus aureus</i> and streptococci.</p><p>Skin is also a target of the immune system. <b>Psoriasis</b> is a chronic immune-mediated disease in which inflammation makes epidermal cells multiply far too fast, giving thick, scaly red plaques. <b>Eczema</b> is inflammation with a defective barrier. <b>Drug rashes</b> are among the commonest adverse drug effects: most are mild, but rarely they are severe (blistering, skin loss, fever, mouth or eye involvement) and need immediate medical review. Skin colour combines haemoglobin (red), carotene (yellow) and melanin (brown), so pallor, jaundice, cyanosis and flushing are clues to anaemia, liver disease, low oxygen and vasodilation.</p>`,
recall:[{q:'List the three layers of the skin and one job of each.',a:'Epidermis: barrier; dermis: collagen, vessels and nerves; hypodermis: fat storage and insulation.'},{q:'What is cellulitis?',a:'Bacterial infection of the dermis and hypodermis causing red, hot, swollen, painful skin.'},{q:'What drives the plaques in psoriasis?',a:'Immune-mediated inflammation that makes epidermal cells multiply far too quickly.'}],
apply:[{q:'A cut lets Staphylococcus aureus into the dermis. The likely result is…',o:['cellulitis','psoriasis','a drug rash','jaundice'],c:0,why:'Bacteria spreading through the dermis and hypodermis cause cellulitis.'},{q:'Yellow skin and eyes suggest which mechanism?',o:['raised bilirubin','low haemoglobin','high melanin','low oxygen'],c:0,why:'Bilirubin deposits in skin and the whites of the eyes.'}],
explain:{q:'Explain the skin as a barrier and how it fails.',pts:['Layers and the barrier','A breach leads to impetigo, cellulitis and sepsis','Psoriasis as immune-mediated rapid cell turnover','Skin colour and drug rashes as clues']},
bq:'Why can a small skin wound in a person with diabetes become dangerous?',
pc:['The skin barrier is breached','Microbes enter the dermis','Local inflammation: redness, heat, swelling and pain','The infection spreads through the tissue (cellulitis)','Systemic spread: sepsis risk','Antibiotics and wound care break the chain'],
dp:'Necrotising fasciitis is a rare, rapidly spreading deep infection with pain out of proportion to the appearance, and needs urgent surgery. Melanoma arises from melanocytes; asymmetry, irregular border, colour variation, diameter and evolution prompt review. Ultraviolet radiation damages DNA and is a major risk factor for basal-cell and squamous-cell carcinomas and contributes to melanoma; risk also depends on skin type, immune status, genetics and other exposures. Burns are classified by depth and body surface area and cause fluid loss and infection risk because the barrier is lost.',
t2:Q('Which layer contains the blood vessels, nerves and sweat glands?',['dermis','epidermis','stratum corneum','hair shaft'],0,'The dermis is the vascular, nerve-rich layer.'),
t3:Q('A patient has an expanding, hot, red, tender area on the leg with fever. Which description fits best?',['Bacterial spread through the dermis and hypodermis (cellulitis) with a systemic response','A purely cosmetic problem','Psoriasis only','A harmless vitamin deficiency'],0,'Spreading redness with warmth, tenderness and fever indicates bacterial cellulitis, which needs medical assessment.')},
{id:'bone',sub:'patho',t:'Bone remodelling & osteoporosis',pre:['cells','axis'],src:'Bones and Joints 1, 2',
learn:`<p>Bone is living tissue: collagen gives toughness and <b>hydroxyapatite</b> mineral gives hardness, and it is constantly <b>remodelled</b>. <b>Osteoclasts</b> resorb bone and <b>osteoblasts</b> form it, and in healthy adults they are generally balanced over time, although local remodelling cycles and net balance vary. Peak bone mass is reached around the late twenties to thirties and then slowly declines. Oestrogen restrains osteoclasts. Low blood calcium stimulates parathyroid hormone; sustained PTH promotes resorption indirectly through osteoblast-lineage cells, whereas intermittent PTH exposure can be anabolic.</p><p><b>Osteoporosis</b> is the commonest metabolic bone disease: resorption outpaces formation, so bone mass and architecture fall and bones break with minimal trauma (wrist, spine, hip). Risk factors: low peak bone mass, menopause (falling oestrogen), age, low calcium or vitamin D, smoking, alcohol, inactivity, long-term steroids and some endocrine diseases. It is silent until a <b>fragility fracture</b>. Prevention and treatment: weight-bearing exercise, calcium and vitamin D, stopping smoking, falls prevention, and drugs that slow resorption (bisphosphonates) or build bone. <b>Fractures</b> heal in stages: haematoma, soft callus, hard callus, then remodelling; poor blood supply, infection, smoking and instability delay healing. <b>Vitamin D deficiency</b> softens bone (rickets in children, osteomalacia in adults) because the new matrix is not mineralised.</p>`,
recall:[{q:'What do osteoclasts and osteoblasts do?',a:'Osteoclasts resorb bone; osteoblasts form it.'},{q:'Why does menopause raise osteoporosis risk?',a:'Falling oestrogen releases the brake on osteoclasts, so resorption outpaces formation.'},{q:'What is a fragility fracture?',a:'A fracture from minimal trauma, such as a fall from standing height.'}],
apply:[{q:'Bone mass falls when…',o:['resorption exceeds formation','formation exceeds resorption','calcium is high','oestrogen is high'],c:0,why:'Net loss occurs when resorption outpaces formation.'},{q:'Which pair are the organic and mineral components of bone?',o:['collagen and hydroxyapatite','keratin and elastin','glycogen and fat','myosin and actin'],c:0,why:'Collagen gives toughness and hydroxyapatite gives hardness.'}],
explain:{q:'Explain bone remodelling and how osteoporosis develops.',pts:['Remodelling: osteoclasts and osteoblasts','Peak bone mass and decline; oestrogen and PTH','Osteoporosis: silent until fracture','Fracture healing stages; vitamin D and mineralisation']},
bq:'Why does a long course of steroid tablets raise the risk of fractures?',
pc:['Peak bone mass is reached','Resorption starts to outpace formation (age, menopause, steroids)','Bone mass and architecture decline silently','Bone becomes fragile','A minor fall causes a fragility fracture','Bone-health measures and indicated treatment can reduce further bone loss and fracture risk, ideally before a first fragility fracture'],
dp:'DEXA measures bone mineral density and reports a T-score; a T-score of −2.5 or below at an accepted site defines densitometric osteoporosis in postmenopausal women and men aged 50 or over; in younger adults Z-scores and clinical context are used, and a fragility fracture can indicate high fracture risk even with a higher T-score. Fracture risk tools combine density with clinical risk factors. Paget disease is disordered, accelerated remodelling. Osteogenesis imperfecta is a collagen defect. Bone metastases and myeloma cause lytic lesions and hypercalcaemia. Bisphosphonates reduce resorption and rarely cause jaw osteonecrosis or atypical femoral fractures.',
t2:Q('A 65-year-old woman has a DEXA T-score of −3.0. By the usual definition this indicates…',['osteoporosis','normal bone density','osteopenia only','excess bone mass'],0,'A T-score of −2.5 or lower is osteoporosis.'),
t3:Q('A 78-year-old woman fractures her wrist falling from standing height. What does this most suggest?',['A fragility fracture suggesting osteoporosis, so bone health and fall risk should be assessed','A normal fracture needing no further thought','A vitamin C deficiency','A muscle infection'],0,'A wrist fracture after a fall from standing height is a fragility fracture and should prompt assessment of bone health and fall risk; it raises concern for osteoporosis but does not alone establish it.')},
{id:'joint',sub:'patho',t:'Arthritis: wear, crystals & autoimmunity',pre:['cells','homeo'],src:'Bones and Joints 3 to 6',
learn:`<p>A synovial joint has smooth <b>cartilage</b> on the bone ends, a <b>synovial membrane</b> producing lubricating fluid, and a capsule. <b>Osteoarthritis</b> is a whole-joint disorder (cartilage degeneration, subchondral bone change, variable synovial inflammation and failed repair), common in knees, hips, hands and spine: cartilage thins, bone thickens and forms spurs, causing pain that worsens with use and short morning stiffness. Risk: age, obesity, previous injury, genetics.</p><p><b>Gout</b> is crystal arthritis. Persistent high blood <b>uric acid</b> (from purine breakdown, made more or excreted less) makes needle-shaped <b>urate crystals</b> more likely to deposit in joints, although not everyone with a high urate develops gout. Neutrophils attack the crystals, causing a sudden, intensely painful, red, hot joint (classically the big toe). <b>Rheumatoid arthritis</b> and <b>lupus</b> are autoimmune: the immune system attacks the synovium (rheumatoid: symmetrical swelling of small joints with prolonged morning stiffness, eroding cartilage and bone) or many tissues (lupus: joints, skin, kidneys, blood). <b>Septic arthritis</b> is bacterial infection of a joint (often <i>Staphylococcus aureus</i>) with a hot, swollen, very painful joint and fever; it is an emergency because it destroys cartilage quickly.</p>`,
recall:[{q:'What causes gout?',a:'Uric acid crystals deposit in a joint and trigger intense neutrophil-driven inflammation.'},{q:'Name one difference between osteoarthritis and rheumatoid arthritis.',a:'Osteoarthritis is a degenerative whole-joint disorder with short stiffness; rheumatoid is autoimmune synovitis with prolonged morning stiffness and symmetrical small-joint swelling.'},{q:'Why is septic arthritis an emergency?',a:'Bacteria and inflammation destroy cartilage quickly.'}],
apply:[{q:'Sudden severe pain, redness and swelling of the big toe in a man with high uric acid suggests…',o:['gout','osteoarthritis','osteoporosis','scurvy'],c:0,why:'Urate crystals in the first toe joint cause acute gout.'},{q:'Which condition features symmetrical swelling of small hand joints with prolonged morning stiffness?',o:['rheumatoid arthritis','gout','osteoarthritis','septic arthritis'],c:0,why:'Autoimmune synovitis gives this pattern.'}],
explain:{q:'Explain the main mechanisms of arthritis.',pts:['Joint structure','Osteoarthritis: a whole-joint disorder with spur formation','Gout: supersaturation and crystals','Autoimmune and septic arthritis']},
bq:'Why does gout often start in the big toe and at night?',
pc:['Uric acid rises above its solubility','Crystals form in a susceptible joint (cooler peripheral joints are often affected)','Crystals are engulfed and activate inflammation','Neutrophils flood the joint','A hot, swollen, very painful joint results','Treatment lowers inflammation, then lowers uric acid'],
dp:'Joint fluid analysis (crystals under polarised light, cell count and culture) separates gout, infection and other causes. Acute gout is treated with anti-inflammatory drugs. Long-term urate-lowering therapy reduces future attacks in patients who meet the indications; it may be started during or after a flare depending on the situation and guidelines. Rheumatoid factor and anti-CCP antibodies support rheumatoid arthritis, and disease-modifying drugs prevent erosions. Lupus is associated with antinuclear antibodies and can cause kidney disease.',
t2:Q('Needle-shaped, negatively birefringent crystals in joint fluid indicate…',['gout (monosodium urate)','pseudogout','osteoarthritis','septic arthritis'],0,'Urate crystals are needle-shaped and negatively birefringent under polarised light.'),
t3:Q('A man has a hot, swollen knee with fever and cannot bear weight. Why is joint aspiration urgent?',['To assess for septic arthritis, which can destroy cartilage within days','To treat gout only','To give vitamin D','Because aspiration cures osteoarthritis'],0,'Cell count, crystal examination, Gram stain and culture help assess septic arthritis, but no single result perfectly excludes infection and crystals do not rule out coexisting infection. This is a mechanism question: a hot swollen joint with fever needs urgent assessment.')},
{id:'ulcer',sub:'patho',t:'Reflux, peptic ulcer & GI bleeding',pre:['homeo','cells'],src:'Gastrointestinal 2, 3, 4',
learn:`<p>The stomach makes strong acid, but its lining is protected by <b>mucus and bicarbonate</b>, good blood flow and <b>prostaglandins</b>. Disease arises when <b>aggressive factors</b> (acid, pepsin, damaging agents) outweigh <b>defences</b>. In <b>reflux</b> (GERD) the lower oesophageal sphincter lets acid back up, causing heartburn behind the sternum and, if chronic, oesophagitis and sometimes changes in the lining (Barrett oesophagus). <b>Peptic ulcers</b> are breaks in the lining of the stomach or duodenum, most commonly caused by <i>Helicobacter pylori</i> infection (it weakens the mucus and provokes inflammation) or by <b>NSAIDs</b> (they block the protective prostaglandins). Acid and pepsin then contribute to the injury, and a few ulcers have no identified cause. Pain is epigastric; bleeding, perforation and obstruction are the dangerous complications.</p><p>GI bleeding appears as <b>haematemesis</b> (vomited blood, usually an upper source), <b>melaena</b> (black, tarry stool from digested blood, most often an upper source but sometimes more distal) or <b>haematochezia</b> (fresh rectal blood, usually lower but also seen with brisk upper bleeding); slow chronic bleeding presents as iron deficiency anaemia. Treatment follows the mechanism: reduce acid (proton pump inhibitors), eradicate <i>H. pylori</i> with antibiotics, stop the NSAID, and in bleeding restore volume and treat the lesion endoscopically.</p>`,
recall:[{q:'Name the two commonest causes of peptic ulcers.',a:'Helicobacter pylori infection and NSAIDs.'},{q:'How do NSAIDs promote ulcers?',a:'They block prostaglandins that maintain mucus, bicarbonate and blood flow in the lining.'},{q:'What is melaena?',a:'Black, tarry stool from digested blood, usually from the upper GI tract.'}],
apply:[{q:'Heartburn behind the sternum after meals most likely reflects…',o:['acid reflux through the lower oesophageal sphincter','a broken rib','anaemia','jaundice'],c:0,why:'Acid passing back into the oesophagus causes burning pain.'},{q:'Why can chronic slow ulcer bleeding cause fatigue and pallor?',o:['iron deficiency anaemia','high bilirubin','low platelets only','excess iron'],c:0,why:'Repeated small blood losses deplete iron.'}],
explain:{q:'Explain how ulcers form and how bleeding presents.',pts:['Aggressive factors versus defences','Reflux and its complications','H. pylori and NSAIDs','Bleeding presentations and treatment logic']},
bq:'Why do doctors test for and treat Helicobacter pylori in patients with a peptic ulcer?',
pc:['H. pylori colonises the stomach lining','It weakens mucus and causes chronic inflammation','Acid and pepsin injure the weakened lining','An ulcer forms','The ulcer may bleed or perforate','Eradication and acid reduction heal it and prevent recurrence'],
dp:'Alarm features (weight loss, difficulty swallowing, persistent vomiting, anaemia, bleeding) warrant prompt assessment and often endoscopy, guided by age, severity and local guidelines. Barrett oesophagus carries a risk of adenocarcinoma. Proton pump inhibitors block the H⁺/K⁺ ATPase of parietal cells. A perforated ulcer causes sudden severe abdominal pain with a rigid abdomen. Variceal bleeding from portal hypertension is a separate cause of haematemesis.',
t2:Q('Which drug class reduces acid by blocking the H⁺/K⁺ ATPase of parietal cells?',['proton pump inhibitors','antacids','H. pylori antibiotics','NSAIDs'],0,'PPIs inhibit the final step of acid secretion.'),
t3:Q('A man taking regular ibuprofen has epigastric pain and coffee-ground vomit. If an NSAID-associated ulcer is the source, which mechanism best explains it?',['Reduced prostaglandin-mediated mucosal protection, allowing ulceration and bleeding','Excess prostaglandins','A viral infection of the lung','Low stomach acid'],0,'Loss of mucosal defence from NSAIDs leads to ulceration and upper GI bleeding. This is a mechanism question: vomiting blood is an emergency.')},
{id:'ibd',sub:'patho',t:'Diarrhoea, IBD & malabsorption',pre:['homeo','osmo'],src:'Gastrointestinal 5, 6, 7',
learn:`<p>Several litres of fluid enter the gut each day from intake and secretions; most is absorbed in the small intestine and the colon reclaims much of the rest (volumes vary). <b>Diarrhoea</b> arises by a few mechanisms: <b>osmotic</b> (unabsorbed solute holds water in, as in lactose intolerance), <b>secretory</b> (toxins such as cholera make the gut secrete fluid), <b>inflammatory</b> (damaged lining leaks blood and protein) and <b>motility</b> disorders. It matters mainly through <b>dehydration, electrolyte loss and acid–base disturbance</b>; oral rehydration works because glucose and sodium are absorbed together.</p><p><b>Inflammatory bowel disease</b> is chronic immune-mediated inflammation. <b>Crohn disease</b> can affect any part from mouth to anus (most often the terminal ileum and colon), with patchy skip lesions and transmural inflammation (the whole wall), causing strictures, fistulas and abscesses. <b>Ulcerative colitis</b> affects the rectum and extends continuously upward, with inflammation predominantly in the mucosa (severe disease can go deeper), causing bloody diarrhoea. <b>Malabsorption</b> occurs when digestion or absorption fails: <b>coeliac disease</b> (an immune reaction to gluten flattens the small-bowel villi), pancreatic insufficiency, or loss of ileum (B₁₂ and bile salts). Fat malabsorption causes pale, bulky, foul stools and lack of fat-soluble vitamins; iron, folate and B₁₂ deficiency cause anaemia.</p>`,
recall:[{q:'List the four mechanisms of diarrhoea.',a:'Osmotic, secretory, inflammatory and motility disorders.'},{q:'How do Crohn disease and ulcerative colitis differ in distribution?',a:'Crohn has patchy skip lesions anywhere and is transmural; ulcerative colitis is continuous from the rectum and mucosal.'},{q:'What damages the small bowel in coeliac disease?',a:'An immune reaction to gluten flattens the villi, reducing absorption.'}],
apply:[{q:'Diarrhoea from cholera toxin is…',o:['secretory','osmotic','inflammatory','mechanical'],c:0,why:'The toxin makes the gut secrete fluid.'},{q:'Bloody diarrhoea with continuous inflammation from the rectum upward suggests…',o:['ulcerative colitis','Crohn disease','coeliac disease','lactose intolerance'],c:0,why:'Continuous mucosal disease from the rectum is typical of ulcerative colitis.'}],
explain:{q:'Explain diarrhoea, IBD and malabsorption.',pts:['Mechanisms of diarrhoea and why dehydration matters','Crohn versus ulcerative colitis','Coeliac disease and malabsorption','Consequences: anaemia and vitamin deficiency']},
bq:'Why can a patient with Crohn disease of the terminal ileum develop vitamin B₁₂ deficiency and gallstones?',
pc:['In a susceptible person, genetic factors, the gut barrier, microbiota and immune regulation sustain chronic inflammation','Inflammation damages the mucosa and wall','Absorption and the barrier fail','Diarrhoea, pain and bleeding appear','Strictures, fistulas and nutrient deficiencies develop','Immune-modifying treatment controls the inflammation'],
dp:'Faecal calprotectin helps separate inflammatory from functional bowel disease. Coeliac disease is commonly screened with IgA tissue-transglutaminase antibodies plus total IgA while the patient eats gluten. Adults are usually confirmed with duodenal biopsy; selected paediatric pathways allow diagnosis without biopsy under defined criteria. Severe colitis can cause toxic megacolon. Long-standing ulcerative colitis raises colorectal cancer risk. C. difficile colitis follows antibiotics and needs specific treatment. IBD treatment uses anti-inflammatory and immune-modifying drugs, and sometimes surgery.',
t2:Q('Lactose intolerance causes diarrhoea mainly by which mechanism?',['osmotic: unabsorbed lactose holds water in the gut','secretory toxin','inflammation','motility only'],0,'Unabsorbed lactose is an osmotically active solute.'),
t3:Q('A young woman has chronic diarrhoea, weight loss, iron deficiency anaemia and high tissue transglutaminase antibodies. The mechanism is…',['immune-mediated flattening of the villi, causing malabsorption','a bacterial toxin','excess acid','a blocked bile duct'],0,'Coeliac disease damages villi, reducing absorption of iron and other nutrients.')},
{id:'neurod',sub:'patho',t:'Dementia, Parkinson disease & demyelination',pre:['homeo','cells'],src:'Neurology 5, 8, 9',
learn:`<p>Neurons are long-lived and largely irreplaceable, and many neurodegenerative diseases involve <b>misfolded protein accumulation</b>, loss of specific neuron groups and a long silent period before symptoms, because the brain has <b>reserve</b>. <b>Alzheimer disease</b> (the commonest dementia, rare under 60, becoming more common with age, particularly after 65) involves extracellular <b>amyloid-β plaques</b> and intracellular <b>tau tangles</b>, with synapse and neuron loss starting in the medial temporal lobe: typically impaired recent (episodic) memory first, though atypical forms can begin with language, visuospatial or executive problems, then later language, judgment and daily function. <b>Vascular dementia</b> follows strokes or small-vessel disease; Lewy body dementia has fluctuating cognition with visual hallucinations.</p><p><b>Parkinson disease</b> is loss of dopamine neurons in the substantia nigra (with α-synuclein deposits, Lewy bodies). Dopamine helps initiate and smooth movement, so patients have <b>resting tremor, rigidity, slowness (bradykinesia)</b> and postural instability, appearing after many dopamine cells have been lost. Levodopa replaces dopamine but does not stop the disease. <b>Demyelinating disease</b> such as <b>multiple sclerosis</b> is immune attack on myelin, which slows or blocks conduction and causes relapsing episodes (visual loss, weakness, numbness) and, over time, axon loss. Always consider reversible causes of cognitive decline: thyroid disease, B₁₂ deficiency, depression, medicines and infection.</p>`,
recall:[{q:'Name the two protein abnormalities in Alzheimer disease.',a:'Amyloid-β plaques and tau tangles.'},{q:'Which neurons are lost in Parkinson disease?',a:'Dopamine-producing neurons of the substantia nigra.'},{q:'What does myelin do?',a:'It speeds conduction along axons; demyelination slows or blocks it.'}],
apply:[{q:'Resting tremor, rigidity and slow movement suggest…',o:['Parkinson disease','Alzheimer disease','multiple sclerosis','a stroke only'],c:0,why:'This triad reflects loss of dopamine in the basal ganglia circuits.'},{q:'The earliest symptom of Alzheimer disease is typically…',o:['loss of recent memory','tremor','vision loss','a limp'],c:0,why:'Medial temporal damage impairs forming new memories.'}],
explain:{q:'Explain how neurodegenerative and demyelinating diseases produce symptoms.',pts:['Reserve and the silent period','Alzheimer disease: amyloid, tau, memory','Parkinson disease: dopamine loss, motor features','Demyelination and reversible causes']},
bq:'Why do Parkinson symptoms only appear after a large proportion of dopamine neurons have been lost?',
pc:['Misfolded protein accumulates in vulnerable neurons','Neurons and synapses are lost slowly','Compensation and reserve keep function normal','A threshold is passed','Symptoms appear and then progress','Treatment replaces function but does not stop the loss'],
dp:'Normal pressure hydrocephalus (gait problem, urinary incontinence, dementia) is a treatable cause. Delirium (acute confusion with fluctuating attention) differs from dementia and signals acute illness. Huntington disease is an inherited trinucleotide repeat disorder. Corticosteroids may speed recovery from selected acute MS relapses but are not long-term disease-modifying treatment; disease-modifying therapies reduce inflammatory activity according to phenotype and assessment. MRI shows white-matter plaques. Levodopa is given with a decarboxylase inhibitor to reduce its conversion outside the brain.',
t2:Q('Which feature distinguishes delirium from dementia?',['acute onset with fluctuating attention','slow onset over years','normal alertness','no cause found'],0,'Delirium is acute with fluctuating attention and usually has a medical cause.'),
t3:Q('Why is levodopa, rather than dopamine itself, used for Parkinson disease?',['Dopamine does not cross the blood–brain barrier, but levodopa does and is converted to dopamine','Levodopa kills neurons','Dopamine is toxic','Levodopa is a vitamin'],0,'Levodopa crosses the barrier and is converted to dopamine in the brain.')},
{id:'mening',sub:'patho',t:'Meningitis, seizures & headache red flags',pre:['homeo','shock'],src:'Neurology 4, 7, 10',
learn:`<p><b>Headache</b>: most are primary headache disorders (tension-type, migraine), though the proportion varies by setting, and red flags always need assessment: sudden worst-ever onset (subarachnoid haemorrhage), fever with neck stiffness (meningitis), new neurological deficit, new headache in older age, or worsening on lying down or coughing (raised pressure).</p><p><b>Meningitis</b> is infection of the membranes around the brain. Bacteria reach the meninges through the blood, multiply in the CSF where immune defences are weak, and cause intense inflammation, raised intracranial pressure and sometimes brain swelling or sepsis. Classic features: <b>fever, headache, neck stiffness, photophobia</b>, drowsiness and sometimes a non-blanching rash. Suspected bacterial meningitis is an emergency: obtain blood cultures and perform lumbar puncture promptly when safe and without delaying treatment; if investigations or imaging would delay antibiotics, give appropriate empiric treatment first under emergency protocols, because about a quarter of adults still die despite treatment. Viral meningitis is usually milder. CSF typically shows, in bacterial meningitis, <b>neutrophils, high protein and low glucose</b>, and in viral meningitis lymphocytes with usually normal glucose. Patterns overlap and can be atypical (for example early viral or partly treated bacterial disease), so read them with the clinical picture and microbiology.</p><p><b>Seizures</b> are sudden, abnormal, synchronised firing of neurons. Normally neuronal currents run in specific directions for specific purposes; in a seizure large groups fire together. Causes: epilepsy (a tendency to recurrent seizures), but also low sodium or glucose, drug withdrawal, infection, stroke, tumour, head injury, and fever in young children. Treatment: stop prolonged seizures quickly, treat the cause, and use drugs that reduce neuronal excitability to prevent recurrence.</p>`,
recall:[{q:'List the classic features of meningitis.',a:'Fever, headache, neck stiffness and photophobia, often with drowsiness or a non-blanching rash.'},{q:'What CSF pattern is typical of bacterial meningitis?',a:'Raised neutrophils and protein with low glucose.'},{q:'What is a seizure?',a:'A sudden, abnormal, synchronised discharge of neurons.'}],
apply:[{q:'A sudden, severe, worst-ever headache raises concern for…',o:['subarachnoid haemorrhage','tension-type headache','sinusitis','a cold'],c:0,why:'This is a recognised red flag for bleeding around the brain.'},{q:'Low CSF glucose with high neutrophils indicates…',o:['bacterial meningitis','viral meningitis','a normal CSF','multiple sclerosis'],c:0,why:'Bacteria and neutrophils consume glucose and cause a neutrophilic CSF.'}],
explain:{q:'Explain headache red flags, meningitis and seizures.',pts:['Headache red flags','Meningitis mechanism and features','CSF patterns','Seizures: synchronised firing and causes']},
bq:'Why are antibiotics started immediately in suspected bacterial meningitis, even before the CSF results?',
pc:['Bacteria enter the blood and reach the meninges','They multiply in the CSF with little immune defence','Inflammation causes swelling and raised intracranial pressure','Brain injury and sepsis follow','Delay increases death and disability','Immediate antibiotics limit the damage'],
dp:'Before lumbar puncture, assess for clinical features that raise concern about mass effect or herniation risk; brain imaging is indicated in selected patients, not routinely for everyone. Do not delay empiric antibiotics when LP or imaging cannot be done promptly and safely. Common organisms: Streptococcus pneumoniae and Neisseria meningitidis; Listeria in the very young, the old and the immunosuppressed. Close contacts of meningococcal disease may need prophylaxis. Convulsive status epilepticus is generally defined operationally as a seizure lasting 5 minutes or more, or recurrent seizures without recovery between them, and needs emergency treatment. Febrile seizures are common in young children and usually benign. Post-ictal confusion follows a seizure.',
t2:Q('Which CSF result fits viral meningitis best?',['raised lymphocytes with normal glucose','raised neutrophils with very low glucose','no cells','low protein with low glucose'],0,'Viral meningitis typically shows a lymphocytic picture with normal glucose.'),
t3:Q('A student has fever, severe headache, neck stiffness and a non-blanching rash. What is the key principle?',['Treat as suspected bacterial meningitis immediately under emergency protocols, without waiting for test results','Wait for the CSF result before any treatment','Reassure and discharge','Treat as tension headache'],0,'Bacterial meningitis and meningococcal sepsis kill rapidly. This is a mechanism question: these symptoms need emergency care.')},
{id:'sense',sub:'patho',t:'The eye & ear: red eye, vision loss & hearing',pre:['homeo','cells'],src:'Eyes 1, 2; Ears NT 3',
learn:`<p>Eye problems fall into four groups: <b>red or painful eye</b>, <b>sudden visual loss</b>, <b>gradual visual loss</b> and <b>neurological visual changes</b>. The cornea is the main focusing surface, and a corneal abrasion is painful but usually heals. Conjunctivitis is a common cause of red eye, but first assess pain, visual acuity, photophobia, contact-lens use and trauma: a painful red eye or reduced vision may signal a sight-threatening emergency (keratitis, acute angle-closure glaucoma, uveitis). <b>Sudden painless visual loss</b> suggests a vascular event (retinal artery or vein occlusion) or retinal detachment. <b>Gradual loss</b>: cataract (clouding of the lens), chronic open-angle <b>glaucoma</b>, macular degeneration and diabetic retinopathy.</p><p><b>Glaucoma</b> is optic nerve damage, usually from intraocular pressure (IOP) too high for that nerve (a conventional reference range is about 10 to 21 mmHg, but glaucoma can occur at lower pressures and raised pressure alone does not prove glaucoma). In typical chronic open-angle glaucoma, fibres are lost from the periphery first, so central vision is preserved until late and the patient may not notice; other forms, including acute angle-closure glaucoma, can threaten vision rapidly. Assessment and pressure-lowering treatment reduce progression but cannot guarantee that blindness is prevented. In <b>diabetic retinopathy</b> high glucose damages small retinal vessels, causing leaks and fragile new vessels. The <b>ear</b> hears like this: sound enters the canal, vibrates the eardrum, the ossicles amplify it to the oval window, fluid moves in the cochlea, hair cells fire and the auditory nerve carries the signal. <b>Conductive</b> loss is a problem in the canal or middle ear (wax, fluid, otitis media); <b>sensorineural</b> loss is damage to hair cells or nerve (ageing, noise, some drugs). A separate part of the inner ear senses balance and motion.</p>`,
recall:[{q:'List the four groups of eye problems.',a:'Red or painful eye, sudden visual loss, gradual visual loss and neurological visual changes.'},{q:'What is glaucoma?',a:'Optic nerve damage, usually from intraocular pressure too high for the nerve, with peripheral vision lost first.'},{q:'Where does sensorineural hearing loss arise?',a:'In the cochlear hair cells or the auditory nerve.'}],

explain:{q:'Explain common eye problems, glaucoma and the types of hearing loss.',pts:['Four groups of eye problems','Glaucoma: pressure, optic nerve, peripheral loss','Diabetic retinopathy','Hearing path; conductive versus sensorineural loss']},
bq:'Why can a patient lose a lot of vision to glaucoma before noticing anything?',
pc:['Intraocular pressure is too high for the optic nerve','Nerve fibres at the periphery are damaged first','The peripheral field narrows slowly','The brain fills in the gaps','Central vision is lost late','Pressure-lowering treatment slows the damage'],
dp:'Acute angle-closure glaucoma (a painful red eye with a fixed mid-dilated pupil, headache and vomiting) is an emergency. Retinal detachment gives flashes, floaters and a curtain over vision. Giant cell arteritis can cause ischaemic optic neuropathy and sudden visual loss in older people with new headache, jaw claudication or visual symptoms; it is an emergency, and urgent treatment to protect the other eye should not wait for confirmatory testing when suspicion is high. Papilloedema (swollen optic discs) signals raised intracranial pressure. The Rinne and Weber tests help separate conductive from sensorineural loss. Presbycusis is age-related high-frequency hearing loss.',
t2:Q('Which type of hearing loss does wax in the ear canal cause?',['conductive','sensorineural','central','none'],0,'Wax blocks sound transmission into the middle ear.'),
t3:Q('An older woman has a new headache, jaw pain on chewing and sudden loss of vision in one eye. Which mechanism should be suspected?',['arteritis reducing the blood supply to the optic nerve','cataract','conjunctivitis','wax'],0,'Giant cell arteritis can cause ischaemic optic neuropathy and needs urgent treatment to protect the other eye. This is a mechanism question: sudden vision loss needs emergency care.')}];

const W8=[
{id:'diag',sub:'patho',t:'Diagnostic reasoning: probability, sensitivity & specificity',pre:['pmethod','stats'],src:'method (all systems)',
learn:`<p>A test result does not prove or exclude a disease: it <b>changes the probability</b>. Before any test there is a <b>pre-test probability</b>: how likely the disease is given the history, examination and how common it is (<b>prevalence</b>). The result then moves that probability up or down by an amount that depends on how good the test is.</p><p><b>Sensitivity</b> is the proportion of people <i>with</i> the disease who test positive. <b>Specificity</b> is the proportion of people <i>without</i> the disease who test negative. A highly sensitive test can make a negative result more reassuring, and a highly specific test can make a positive result more persuasive. The size of the probability shift also depends on the pre-test probability and the likelihood ratios; neither result automatically excludes or confirms disease. Raising the cut-off for a positive result usually lowers sensitivity and raises specificity, and the reverse.</p><p>What a patient really wants to know is different: <b>positive predictive value</b> (PPV: the probability of disease after a positive result) and <b>negative predictive value</b> (NPV: the probability of not having the target disease after a negative result). PPV and NPV depend on the prevalence or pre-test probability in the population tested and on test performance. Example: prevalence 1%, sensitivity 90%, specificity 90%. In 1000 people, 10 have the disease and 9 test positive; of the 990 without it, 99 test falsely positive. So only 9 of 108 positives are real: a PPV of about 8%. In many low-prevalence screening settings, a positive result requires confirmation through the recommended follow-up test or pathway. When pre-test probability is high, even a negative result from an imperfect test can leave a meaningful chance of disease, which is why a normal test does not always exclude it. Sensitivity alone cannot tell you the probability of disease after a negative result: that also depends on the specificity and the pre-test probability (the negative predictive value and LR− combine them). Population prevalence is also not the same as one patient's pre-test probability: patients are selected for testing by their symptoms, which changes the tested population. As a conceptual model (not a numeric rule), doctors act when the probability rises above a treatment threshold, stop when it falls below a testing threshold, and test further in between.</p>`,
recall:[{q:'Define sensitivity.',a:'The proportion of people with the disease who test positive.'},{q:'Define specificity.',a:'The proportion of people without the disease who test negative.'},{q:'Why does a positive result mean less when the disease is rare?',a:'Most people tested are healthy, so false positives from that large group can outnumber true positives and the predictive value falls.'}],
apply:[{q:'Of 100 people with a disease, 90 test positive. The sensitivity of the test is…',o:['90%','10%','100%','it cannot be calculated'],c:0,why:'Sensitivity is true positives divided by all people with the disease: 90 ÷ 100.'},{q:'A test has 95% specificity. Among 200 healthy people, about how many are expected to test positive?',o:['10','190','5','95'],c:0,why:'5% of the healthy group test falsely positive: 0.05 × 200 = 10.'}],
explain:{q:'Explain pre-test probability, sensitivity, specificity and why predictive values change with prevalence.',pts:['Pre-test probability and why it matters','Sensitivity versus specificity definitions','Predictive values depend on prevalence','A normal test does not always exclude disease; results change probability but rarely prove']},
bq:'Why can a positive screening test be wrong most of the time when the disease is rare, even if the test is good?',
pc:['Estimate the pre-test probability from the history, examination and prevalence','Define the clinical question, then choose a validated test whose accuracy, risks, availability and likely effect on decisions fit the situation','The result changes the probability: it rarely proves or excludes disease','Combine the result with the pre-test probability to judge the post-test probability','Act if the probability crosses the threshold for treatment or further testing','Reassess if the picture does not fit'],
dp:'Likelihood ratios combine test characteristics into one number: LR+ = sensitivity ÷ (1 − specificity) for a positive result, and LR− = (1 − sensitivity) ÷ specificity for a negative result. Post-test odds = pre-test odds × the LR for the observed result. Convert probability to odds with p ÷ (1 − p), and odds to probability with odds ÷ (1 + odds). Sensitivity and specificity are properties of the test in a defined population, so they change with disease spectrum (spectrum bias) and with the reference standard used. SnNout and SpPin are memory aids, not guarantees: a negative result from a very sensitive test, or a positive result from a very specific test, may shift probability substantially, but interpretation still depends on pre-test probability, likelihood ratios, test validity and the consequences of missing disease. (SnNout: a highly sensitive test, when negative, helps rule out; SpPin: a highly specific test, when positive, helps rule in.) Choose tests when the result is likely to inform diagnosis, prognosis, monitoring or a decision, and balance the benefit against false positives, incidental findings, overdiagnosis, cost and delay; do not let this heuristic delay time-critical evaluation. ROC curves show the trade-off as the cut-off moves, and the area under the curve summarises discrimination but does not alone determine clinical usefulness or calibration; verification bias and an imperfect reference standard also distort estimated accuracy.',
t2:Q('A disease has a prevalence of 1%. A test has sensitivity 90% and specificity 90%. Among 1000 people tested, about how many true positives and false positives are expected?',['9 true, 99 false','90 true, 10 false','10 true, 90 false','9 true, 9 false'],0,'10 people have the disease and 9 are detected. Of the 990 without it, 10% (99) test falsely positive, so the PPV is only about 8%.'),
t3:Q('A patient has a high pre-test probability of a serious condition. A test with sensitivity 85% is negative, but its specificity and the exact pre-test probability are not given. What is the safest interpretation?',['The result alone does not exclude the disease, and further assessment may be needed','The disease is excluded','The test is worthless','The patient is healthy and nothing more is needed'],0,'A negative result can leave substantial residual probability when the pre-test probability is high, and sensitivity alone is insufficient to calculate the post-test probability. This is a reasoning question, not advice for a real patient.')}];
