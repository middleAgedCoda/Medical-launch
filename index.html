<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f4;--card:#fff;--ink:#12201c;--mut:#5d6f69;--line:#d3ddd8;--acc:#0e6b5c;--acc2:#e4f2ee;--bad:#b3261e;--bad2:#fbe9e7;--ok:#1b7a3e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#16221f;--ink:#e6efeb;--mut:#92a8a1;--line:#2a3b36;--acc:#4fc3ad;--acc2:#16322d;--bad:#ff8a80;--bad2:#3a1d1a;--ok:#6fd48f}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#16221f;--ink:#e6efeb;--mut:#92a8a1;--line:#2a3b36;--acc:#4fc3ad;--acc2:#16322d;--bad:#ff8a80;--bad2:#3a1d1a;--ok:#6fd48f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 4px}
h2{font:700 19px/1.25 Georgia,serif;margin:22px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mission{border-left:5px solid var(--acc);border-radius:6px 14px 14px 6px}
.lesson{font:17px/1.65 Georgia,serif}.lesson p{margin:0 0 10px}
.bridge{background:var(--acc2);border-radius:10px;padding:12px;font-size:15px}
button{font:600 15px system-ui;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:11px 14px;min-height:44px;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border-color:var(--line);margin:6px 0;font-weight:500}
button.opt.right{border-color:var(--ok);background:var(--acc2)}button.opt.wrong{border-color:var(--bad);background:var(--bad2)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>button{flex:1 1 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);border-radius:0;min-height:56px;font-size:13px}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:3px 0}.bar b{width:74px;font-weight:500}
.bar i{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar u{display:block;height:100%;background:var(--acc)}
.steps{display:flex;gap:4px;margin:8px 0 14px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps span.d{background:var(--acc)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:16px system-ui;background:var(--card);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.q{font-weight:600;font-size:17px}label{display:block;margin:8px 0}
.viz{background:var(--acc2);border-radius:12px;padding:12px;margin:6px 0 12px}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 10px}
select{font:16px system-ui;padding:9px;border-radius:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);width:100%;margin-top:4px}
.dots span{display:inline-block;width:13px;height:13px;border-radius:50%;margin:2px}
.chain{margin:14px 0 4px}.chain div{padding:8px 10px;border-left:3px solid var(--acc);margin:0 0 16px;position:relative;background:var(--card);font-size:15px}
.chain div:not(:last-child)::after{content:"\2193";position:absolute;left:8px;bottom:-19px;color:var(--acc)}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);right:12px;z-index:5;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:16px;padding-top:calc(env(safe-area-inset-top,0px) + 16px);color:var(--ink)}
.pt{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.pt button,.pt i{min-height:46px;padding:2px 0;font-size:14px;border-radius:8px}
.pt button{background:var(--card);color:var(--ink);border-color:var(--line)}.pt button.bd{border-color:var(--acc);background:var(--acc2)}
.pt i{font-size:11px;color:var(--mut);text-align:center;font-style:normal;min-height:0}
.opt.pick{border-color:var(--acc);background:var(--acc2)}
button.mc{min-height:34px;padding:4px 9px;font-size:12px;flex:0 0 auto}

<script>
// ---------- CURRICULUM (PM1 Chemistry · provisional, external enrichment) ----------
const C=[
{id:'atoms',t:'Atoms & isotopes',pre:[],
learn:`<p>An atom has a <b>nucleus</b> of protons (+) and neutrons (no charge), with <b>electrons</b> (−) in shells around it.</p><p>The <b>atomic number</b> is the number of protons, and it decides which element the atom is. <b>Mass number</b> = protons + neutrons. A neutral atom has equal protons and electrons.</p><p><b>Isotopes</b> are atoms of the same element with different numbers of neutrons.</p>`,
recall:[{q:'What decides which element an atom is?',a:'The number of protons (atomic number).'},{q:'How many electrons does a neutral atom with atomic number 11 have?',a:'11. Neutral means electrons equal protons.'},{q:'What are isotopes?',a:'Atoms of the same element (same protons) with different numbers of neutrons.'}],
apply:[{q:'Carbon-14 has atomic number 6. How many neutrons does it have?',o:['6','8','14','20'],c:1,why:'Neutrons = mass number − protons = 14 − 6 = 8.'},{q:'Which change turns one element into a different element?',o:['Gaining an electron','Losing a neutron','Changing the number of protons','Gaining a neutron'],c:2,why:'Only the proton count defines the element.'}],
explain:{q:'Explain the structure of an atom, and what atomic number and isotopes mean.',pts:['Nucleus holds protons and neutrons','Electrons are negative and sit in shells around the nucleus','Atomic number = protons, which defines the element','Isotopes differ in neutron number']},
bridge:'Radioactive isotopes such as technetium-99m and iodine-131 are used in medical imaging and treatment (nuclear medicine). Same element, different neutrons, different behaviour.',
bq:'Why might a doctor choose an isotope of an element the body already uses?'},
{id:'shells',t:'Electron shells',pre:['atoms'],
learn:`<p>Electrons sit in <b>shells</b> (energy levels) around the nucleus. Inner shells fill first. The first shell holds <b>2</b>, the next <b>8</b>, and the third fills to <b>8</b> before the fourth starts (for the first 20 elements; the third shell can later hold up to 18).</p><p>Sodium (11 electrons) is <b>2, 8, 1</b>. The outermost shell is the <b>valence shell</b>, and its electrons do the chemistry. A full outer shell is very stable.</p><p>Outer electrons are far from the nucleus and shielded by the inner ones, so they are held loosely. As a rule of thumb for main-group elements, an atom with 1 to 3 outer electrons tends to <b>lose</b> them. With 5 to 7 it tends to <b>gain</b> enough to reach 8 (8 minus the outer count). With 4 it usually shares. These are trends, not exceptionless laws. In the periodic table, the column tells you the outer electrons.</p>`,
recall:[{q:'How many electrons can the first three shells hold (first 20 elements)?',a:'2, 8 and 8.'},{q:'What is the outer shell called, and why does it matter?',a:'The valence shell. Its electrons take part in reactions and bonding.'},{q:'Chlorine is 2, 8, 7. What does it tend to do?',a:'Gain 1 electron to reach 8, forming Cl⁻.'}],
apply:[{q:'What is the electron arrangement of magnesium (atomic number 12)?',o:['2, 10','2, 8, 2','8, 4','2, 2, 8'],c:1,why:'Fill 2, then 8, then the remaining 2 go in the third shell.'},{q:'Oxygen is 2, 6. Which ion does it tend to form?',o:['O⁺','O²⁺','O⁻','O²⁻'],c:3,why:'It needs 2 more electrons to reach 8, so it gains 2 and becomes O²⁻.'}],
explain:{q:'Explain electron shells, and how you can predict whether an atom will lose or gain electrons.',pts:['Electrons sit in shells that fill inner first (2, 8, 8)','The outer (valence) shell does the chemistry','A full outer shell is stable','1 to 3 outer electrons: lose. 5 to 7: gain up to 8']},
bq:'Why do you think elements in the same column of the periodic table behave alike?'},
{id:'ions',t:'Ions',pre:['atoms','shells'],
learn:`<p>An <b>ion</b> is an atom that has gained or lost electrons, so protons and electrons no longer balance.</p><p>Losing electrons gives a positive <b>cation</b> (Na⁺, K⁺, Ca²⁺). Gaining electrons gives a negative <b>anion</b> (Cl⁻).</p><p>Atoms tend to reach a full outer shell. Sodium has one outer electron, so losing it is easy. Chlorine needs one more, so it gains one.</p>`,
recall:[{q:'What charge forms when an atom loses electrons?',a:'Positive (a cation).'},{q:'Why does sodium form Na⁺?',a:'It has one outer electron; losing it leaves a full outer shell.'},{q:'What is an anion?',a:'A negatively charged ion formed by gaining electrons.'}],
apply:[{q:'Ca²⁺ has lost how many electrons?',o:['1','2','20','40'],c:1,why:'A 2+ charge means two more protons than electrons.'},{q:'Magnesium has atomic number 12. How many electrons does Mg²⁺ have?',o:['12','14','10','2'],c:2,why:'12 protons − 2 lost electrons = 10 electrons.'}],
explain:{q:'Explain what an ion is and how cations and anions form.',pts:['Ion = atom with unequal protons and electrons','Losing electrons makes a positive cation','Gaining electrons makes a negative anion','Atoms move toward a full outer shell']},
bridge:'Na⁺, K⁺ and Ca²⁺ gradients across cell membranes power nerve impulses, muscle contraction and the heartbeat.',
bq:'If the blood K⁺ level became abnormal, which body systems might be affected first?'},
{id:'bonds',t:'Bonds & polarity',pre:['ions'],
learn:`<p><b>Ionic bond:</b> electrons are transferred, giving oppositely charged ions that attract (NaCl).</p><p><b>Covalent bond:</b> electrons are shared. If shared equally it is nonpolar (O₂). If one atom pulls harder (higher electronegativity) it is <b>polar</b> (H₂O).</p><p>Water is polar: oxygen is slightly negative and hydrogens slightly positive. This allows <b>hydrogen bonds</b> between water molecules, and lets water dissolve ions (its partial charges surround them and pull them out of the crystal) and polar molecules.</p>`,
recall:[{q:'What happens to electrons in an ionic bond?',a:'They are transferred from one atom to another.'},{q:'What makes a covalent bond polar?',a:'Unequal sharing of electrons because one atom is more electronegative.'},{q:'Why is water a good solvent for salts?',a:'Its polar ends attract and surround ions.'}],
apply:[{q:'Which best describes the bond in NaCl?',o:['Nonpolar covalent','Polar covalent','Ionic','Hydrogen bond'],c:2,why:'Na gives an electron to Cl, forming Na⁺ and Cl⁻.'},{q:'Which molecule is held together by equal sharing of electrons?',o:['NaCl','H₂O','O₂','KCl'],c:2,why:'Two identical atoms share equally, so the bond is nonpolar.'}],
explain:{q:'Compare ionic, polar covalent and nonpolar covalent bonds.',pts:['Ionic = transfer of electrons','Covalent = sharing of electrons','Polar = unequal sharing, partial charges','Nonpolar = equal sharing']},
bridge:'Polar water and nonpolar lipids explain why cell membranes form: fats avoid water and self-assemble into a barrier.',
bq:'Why would a nonpolar drug cross a membrane more easily than a charged one?'},
{id:'moles',t:'Moles & molarity',pre:['atoms'],
learn:`<p>A <b>mole</b> is 6.02 × 10²³ particles. <b>Molar mass</b> (g/mol) is the mass of one mole: NaCl ≈ 58.5 g/mol.</p><p><b>moles = mass ÷ molar mass</b></p><p><b>Molarity (M) = moles ÷ litres of solution.</b> A 1 M solution holds 1 mole per litre.</p>`,
recall:[{q:'How many particles are in one mole?',a:'6.02 × 10²³.'},{q:'Formula for moles from mass?',a:'moles = mass ÷ molar mass.'},{q:'Define molarity.',a:'Moles of solute per litre of solution (mol/L).'}],
apply:[{q:'How many moles are in 117 g of NaCl (58.5 g/mol)?',o:['0.5','1','2','4'],c:2,why:'117 ÷ 58.5 = 2 mol.'},{q:'0.5 mol of solute is dissolved to make 2 L. What is the molarity?',o:['0.25 M','1 M','2.5 M','4 M'],c:0,why:'0.5 mol ÷ 2 L = 0.25 mol/L.'}],
explain:{q:'Explain what a mole is and how to calculate molarity.',pts:['Mole = 6.02 × 10²³ particles','Molar mass links grams to moles','Molarity = moles ÷ litres','Units are mol/L (M)']},
bridge:'Normal saline is 0.9% NaCl: 9 g per litre ÷ 58.5 ≈ 0.154 mol/L. Every IV fluid and drug concentration uses this maths.',
bq:'Why does a clinician need concentrations, not just masses, when preparing a drug?'},
{id:'ph',t:'Acids, bases & pH',pre:['ions','moles'],
learn:`<p>An <b>acid</b> donates H⁺; a <b>base</b> accepts H⁺.</p><p><b>pH = −log[H⁺]</b> (a standard approximation; strictly it uses H⁺ activity). Lower pH means more H⁺, so more acidic. pH 7 is neutral (for pure water at 25 °C). Each pH unit is a <b>10×</b> change in [H⁺].</p><p>A <b>buffer</b> resists pH change by absorbing or releasing H⁺.</p>`,
recall:[{q:'What is an acid?',a:'A substance that donates H⁺ ions.'},{q:'If [H⁺] rises, what happens to pH?',a:'pH falls (more acidic).'},{q:'What does a buffer do?',a:'Resists changes in pH by absorbing or releasing H⁺.'}],
apply:[{q:'A solution has [H⁺] = 10⁻³ mol/L. What is its pH?',o:['−3','3','7','11'],c:1,why:'pH = −log(10⁻³) = 3.'},{q:'Compared with pH 6, a solution at pH 5 has how much more H⁺?',o:['1.1×','2×','10×','100×'],c:2,why:'Each pH unit is a ten-fold change.'}],
explain:{q:'Explain pH, acids, bases and buffers in your own words.',pts:['Acid donates H⁺, base accepts H⁺','pH = −log[H⁺]; lower = more acidic','Scale is logarithmic (10× per unit)','Buffers resist pH change']},
bridge:'Blood pH is held at about 7.35–7.45 by buffers, with the lungs and kidneys adjusting it. Small shifts are dangerous.',
bq:'Your future patient has an abnormal blood pH. Which body systems might be involved?'}];
const BR={
atoms:{chain:['Isotope: same protons, different neutrons','Same chemistry, different nuclear stability','Some isotopes are radioactive and give off detectable radiation','Doctors attach them to molecules the body handles normally','A scanner follows the radiation (imaging) or the radiation damages a target (treatment)'],tie:'The proton count is unchanged, so the body treats the isotope like the normal element. Some isotopes are radioactive: their unstable nuclei emit radiation that can be detected for imaging or used to damage targeted tissue.',a:'The body uses it like the normal element, so it tends to go where that element goes (iodine goes to the thyroid, though not exclusively). Its radiation lets us see that tissue or treat it.'},
ions:{chain:['Ions carry electrical charge','Cells keep more K⁺ inside and more Na⁺ outside','Separated charges across the membrane make a voltage','Opening channels moves ions: a nerve signal or muscle contraction','Heart muscle depends on this electrical rhythm'],tie:'Ions are charged atoms, and moving charge is an electrical signal. That is why a single ion type can matter so much.',a:'K⁺ helps set the resting voltage of nerve and muscle cells. Abnormal blood K⁺ can disturb heart rhythm, which is why severe hyperkalaemia is so dangerous, and can also affect skeletal muscle and nerves.'},
bonds:{chain:['Water is polar (partial charges)','Polar water surrounds ions and polar molecules, so they dissolve','Nonpolar fats do not mix with water','Fat-like lipids cluster into a double layer','That layer is the cell membrane'],tie:'Polarity decides what mixes with water. The membrane exists because of that split between water-loving and water-avoiding parts.',a:'A nonpolar drug dissolves in the fatty middle of the membrane and slips through. A charged one is surrounded by water molecules and is held out.'},
moles:{chain:['A mole links mass to number of particles','Molarity = moles per litre','Body fluids and drugs are measured as concentrations','Effect depends partly on concentration, not just mass given','Dose = concentration × volume'],tie:'You just saw that the same moles in more water gives a weaker solution. A clinician has to think the same way about every drip and syringe.',a:'The same mass in a bigger volume is weaker, and the body responds to concentration. Dose = concentration × volume.'},
ph:{chain:['pH measures the H⁺ concentration','Enzymes and proteins work only in a narrow H⁺ range','Buffers soak up extra H⁺','Lungs (CO₂) and kidneys (H⁺, bicarbonate) adjust blood pH','If these fail, pH shifts and organs work badly'],tie:'Because pH is logarithmic, a fall from 7.4 to 7.0 means H⁺ rises about 2.5-fold (10^0.4). Many enzymes and proteins are sensitive to that change, so it can be dangerous.',a:'The blood buffers, the lungs and the kidneys, and any organ whose enzymes need a stable pH.'}};
const TR={
atoms:[{s:'Isotopes of an element have different numbers of protons.',t:false,w:'Isotopes have the same protons. Only neutrons differ.'},{s:'A neutral atom with atomic number 8 has 8 electrons.',t:true,w:'Neutral means electrons equal protons.'}],
ions:[{s:'Chlorine gains 2 electrons to become Cl⁻.',t:false,w:'Cl⁻ has a 1− charge, so it gained exactly one electron.'},{s:'A cation has more electrons than protons.',t:false,w:'A cation lost electrons, so protons outnumber electrons.'}],
bonds:[{s:'In an ionic bond, electrons are shared equally.',t:false,w:'Ionic means transferred. Equal sharing is nonpolar covalent.'},{s:'Water is polar because oxygen pulls shared electrons harder than hydrogen does.',t:true,w:'Unequal sharing creates partial charges.'}],
moles:[{s:'Molarity is moles of solute per litre of solvent.',t:false,w:'It is per litre of the whole solution.'},{s:'Doubling the volume while keeping the same moles halves the molarity.',t:true,w:'M = n ÷ V.'}],
ph:[{s:'A solution at pH 4 has 10 times more H⁺ than one at pH 5.',t:true,w:'Each pH unit is a 10× change.'},{s:'A buffer stops the pH from changing at all.',t:false,w:'A buffer resists change. It does not prevent it.'}]};
BR.shells={chain:['Same column = same number of outer electrons','Outer electrons do the reacting','So elements in a column behave alike','Na and K both lose 1 electron to form 1+ ions','The body uses both, but must keep them in different places'],tie:'Chemistry is decided by outer electrons. Na and K have one each, so they behave alike, which is why cells need pumps to keep them apart.',a:'Columns share the same outer-electron count, and that count controls how an atom reacts. Na and K both form 1+ ions, so the body has to work hard to separate them.'};
TR.shells=[{s:'Sodium loses an electron because positive atoms are more stable.',t:false,w:'Na⁺ has the arrangement 2, 8, a full outer shell, which makes the ion stable. Charge is the result of losing the electron, not the reason. (Removing an electron actually costs energy; the cost is repaid when ions bond or are hydrated.)'},{s:'Argon (2, 8, 8) readily forms ions.',t:false,w:'Its outer shell is already full, so it is almost unreactive.'}];
const BIO=[
{id:'cells',sub:'bio',t:'Cells & organelles',pre:[],
learn:`<p><b>Cell theory:</b> all living things are made of cells, the cell is the basic unit of life, and cells come from existing cells.</p><p><b>Prokaryotes</b> (bacteria) have no nucleus: their DNA floats in a nucleoid. <b>Eukaryotes</b> (animals, plants, fungi) keep DNA in a <b>nucleus</b> and have membrane-bound organelles.</p><p>Key organelles: <b>nucleus</b> (DNA), <b>mitochondria</b> (make most of the ATP in many cells), <b>ribosomes</b> (build proteins), <b>endoplasmic reticulum</b> (processes proteins, makes lipids), <b>Golgi</b> (sorts and ships), <b>lysosomes</b> (digest waste).</p>`,
recall:[{q:'State the three parts of cell theory.',a:'All living things are made of cells; the cell is the basic unit of life; cells arise from existing cells.'},{q:'What is the main difference between prokaryotic and eukaryotic cells?',a:'Eukaryotes have a nucleus and membrane-bound organelles; prokaryotes do not.'},{q:'Which organelle makes most of the ATP in a eukaryotic cell?',a:'The mitochondrion.'}],
apply:[{q:'A cell has no nucleus and its DNA lies free in the cytoplasm. It is most likely…',o:['a muscle cell','a bacterium','a liver cell','a plant cell'],c:1,why:'No nucleus means a prokaryote, such as a bacterium.'},{q:'A cell that makes huge amounts of protein would have lots of…',o:['ribosomes','lysosomes','chloroplasts','nuclei'],c:0,why:'Ribosomes build proteins.'}],
explain:{q:'Explain cell theory, and compare prokaryotic and eukaryotic cells.',pts:['Cells are the basic unit of life and come from existing cells','Prokaryotes: no nucleus, DNA in a nucleoid','Eukaryotes: nucleus and membrane-bound organelles','Organelles divide the work, e.g. mitochondria make ATP']},
bq:'Why might a heart muscle cell be packed with mitochondria?'},
{id:'membrane',sub:'bio',t:'Cell membrane & transport',pre:['cells','bonds'],
learn:`<p>The membrane is a <b>phospholipid bilayer</b>. Each phospholipid has a polar (water-loving) head and nonpolar (water-avoiding) tails. Tails face inward, heads face the water, so the layer forms by itself. Proteins are embedded in it.</p><p><b>Passive transport</b> needs no energy: molecules move <b>down</b> their concentration gradient (crowded to sparse); for ions, down their electrochemical gradient (concentration plus charge). <b>Diffusion</b> works for small nonpolar molecules (O₂, CO₂). <b>Facilitated diffusion</b> uses channel or carrier proteins for ions and polar molecules. <b>Osmosis</b> is the net movement of water across a selectively permeable membrane toward the side with more solute that cannot cross.</p><p><b>Active transport</b> pumps molecules <b>against</b> the gradient and uses ATP. The Na⁺/K⁺ pump keeps Na⁺ outside and K⁺ inside.</p>`,
recall:[{q:'Why do phospholipids form a bilayer in water?',a:'Polar heads face the water and nonpolar tails hide from it in the middle.'},{q:'What is the difference between passive and active transport?',a:'Passive goes down the gradient with no energy; active goes against it and uses ATP.'},{q:'Why do ions need channel proteins?',a:'They are charged, so they cannot pass through the nonpolar middle of the membrane.'}],
apply:[{q:'Oxygen enters a cell by simple diffusion because it is…',o:['charged','small and nonpolar','too large for the membrane','pumped by ATP'],c:1,why:'Small nonpolar molecules slip through the lipid middle.'},{q:'A pump moves Na⁺ from low to high concentration. This transport is…',o:['simple diffusion','osmosis','facilitated diffusion','active transport'],c:3,why:'Moving against the gradient needs energy: active transport.'}],
explain:{q:'Explain the structure of the cell membrane and compare passive and active transport.',pts:['Phospholipid bilayer: polar heads out, nonpolar tails in','Small nonpolar molecules diffuse straight through','Ions use channel or carrier proteins (passive, down the gradient)','Active transport uses ATP to move against the gradient']},
bq:'Why must a cell keep spending ATP on the Na⁺/K⁺ pump?'},
{id:'biomol',sub:'bio',t:'Biomolecules',pre:['bonds'],
learn:`<p>Many large biological molecules are <b>polymers</b> built from small <b>monomers</b> joined by bonds.</p><p><b>Carbohydrates:</b> sugars (glucose) join into starch and glycogen. Energy and storage, with structural and cell-recognition roles too.</p><p><b>Proteins:</b> amino acids form chains that fold into 3D shapes. Enzymes, channels, structure. <b>Shape decides function.</b></p><p><b>Nucleic acids:</b> nucleotides form DNA and RNA. They store and carry information.</p><p><b>Lipids</b> (fats, phospholipids) are mostly nonpolar and are not true polymers. They store energy and build membranes.</p>`,
recall:[{q:'What is a monomer, and what do monomers build?',a:'A small unit; monomers join to make polymers.'},{q:'What are the monomers of proteins and nucleic acids?',a:'Amino acids and nucleotides.'},{q:'Why does the shape of a protein matter?',a:'Its 3D shape decides what it can do, for example which molecule an enzyme can bind.'}],
apply:[{q:'Glycogen is a polymer of…',o:['amino acids','glucose','nucleotides','fatty acids'],c:1,why:'Glycogen is a storage polysaccharide made of glucose.'},{q:'One amino acid is changed and the protein works much less well. A likely reason is that…',o:['the protein is smaller','its shape changed','it lost its monomers','it became a lipid'],c:1,why:'A different amino acid can change how the chain folds, its stability, or its binding or active site, and shape decides function.'}],
explain:{q:'Explain monomers and polymers and the main job of each biomolecule.',pts:['Polymers are built from monomers','Carbohydrates: sugars, energy and storage','Proteins: amino acids, shape decides function','Nucleic acids: nucleotides, store information']},
bq:'Why can a single changed amino acid cause disease?'},
{id:'enzymes',sub:'bio',t:'Enzymes',pre:['biomol','ph'],
learn:`<p><b>Enzymes</b> are proteins that speed up reactions by lowering the energy needed to start them. They are not used up.</p><p>The <b>substrate</b> binds to the enzyme <b>active site</b>, forming a complex, and is turned into <b>products</b>. The fit is specific: the shape of the site matches the substrate.</p><p>The rate rises with substrate until all enzymes are busy (<b>saturation</b>). Each enzyme has an <b>optimum</b> temperature and pH. Too hot, or the wrong pH, changes the shape: the enzyme is <b>denatured</b> and stops working.</p>`,
recall:[{q:'What does an enzyme do to a reaction?',a:'It speeds it up by lowering the energy needed, and is not used up.'},{q:'What is the active site?',a:'The part of the enzyme where the substrate binds.'},{q:'What does denatured mean?',a:'The enzyme has lost its shape (heat or wrong pH) and no longer works.'}],
apply:[{q:'Adding more substrate no longer increases the rate. Why?',o:['The enzymes are saturated','The enzymes are denatured','The pH is optimum','Products have run out'],c:0,why:'All active sites are busy, so the rate levels off.'},{q:'Which change is most likely to cause lasting loss of activity in a typical enzyme?',o:['Cooling it slightly','Boiling it','Adding more substrate','Adding product'],c:1,why:'Heat disrupts the interactions that hold the 3D shape (not the backbone bonds), so the enzyme denatures, often irreversibly.'}],
explain:{q:'Explain how enzymes work and what affects their rate.',pts:['Enzymes are proteins that lower the energy needed','Substrate binds at the active site (specific shape)','Rate rises then levels off at saturation','Heat or wrong pH denatures the enzyme']},
bq:'Why is a very high fever dangerous for the body?'},
{id:'atp',sub:'bio',t:'ATP & respiration',pre:['enzymes','cells'],
learn:`<p><b>ATP</b> is the energy currency of the cell. Hydrolysing ATP to ADP + Pᵢ releases free energy, which cells couple to work such as pumps and muscle contraction (the energy comes from the whole reaction, not from bond breaking alone). Cells re-make ATP from ADP.</p><p><b>Cellular respiration</b> releases energy from glucose: <b>glucose + O₂ → CO₂ + H₂O + ATP</b>.</p><p><b>Glycolysis</b> (in the cytoplasm) splits glucose and gives about 2 ATP without oxygen. With oxygen, the <b>mitochondria</b> finish the job, for roughly 30 to 32 ATP per glucose in total (an estimate that varies). If oxygen is lacking, or glycolysis outpaces the mitochondria, pyruvate becomes lactate, which regenerates NAD⁺ so glycolysis can continue; the net gain is then just the 2 ATP.</p>`,
recall:[{q:'What happens when ATP becomes ADP + Pᵢ?',a:'Energy is released for the cell to use.'},{q:'Give the word equation for aerobic respiration.',a:'Glucose + oxygen → carbon dioxide + water + ATP.'},{q:'Where does glycolysis occur, and does it need oxygen?',a:'In the cytoplasm; no oxygen needed.'}],
apply:[{q:'Roughly how much ATP per glucose does aerobic respiration make, compared with anaerobic?',o:['2 versus 30','30 versus 2','10 versus 10','100 versus 2'],c:1,why:'About 30 with oxygen; about 2 from glycolysis alone.'},{q:'During intense exercise, glycolysis in muscle speeds up. Which product increases as pyruvate is converted?',o:['lactate','glucose','oxygen','urea'],c:0,why:'Pyruvate is converted to lactate, which regenerates NAD⁺ so glycolysis can continue. Lactate does not prove oxygen is absent.'}],
explain:{q:'Explain ATP and the difference between aerobic and anaerobic respiration.',pts:['ATP releases energy when it loses a phosphate','Respiration: glucose + O₂ → CO₂ + H₂O + ATP','Glycolysis: cytoplasm, about 2 ATP, no oxygen needed','Mitochondria with oxygen: about 30 ATP in total']},
bq:'Why do you breathe faster during exercise?'},
{id:'division',sub:'bio',t:'Cell division',pre:['cells'],
learn:`<p>DNA is copied in the <b>S phase</b> of interphase, so every chromosome becomes two <b>sister chromatids</b> (identical copies, apart from rare errors) that stay joined until they separate.</p><p><b>Mitosis</b> makes <b>2 genetically identical</b> cells (barring errors) with the same chromosome number (2n), by nuclear division followed by cytokinesis. It is used for growth and repair. Stages: prophase, metaphase (line up), anaphase (chromatids pulled apart), telophase.</p><p><b>Meiosis</b> makes <b>4 genetically different</b> cells with <b>half</b> the chromosomes (n): the gametes (sperm and egg). It has two divisions. In meiosis I, homologous pairs separate; in meiosis II, chromatids separate. Crossing over mixes genes.</p>`,
recall:[{q:'What is the result of mitosis?',a:'Two genetically identical cells with the same chromosome number.'},{q:'What is the result of meiosis?',a:'Four genetically different cells with half the chromosome number.'},{q:'What separates in anaphase of mitosis?',a:'Sister chromatids.'}],
apply:[{q:'A human body cell has 46 chromosomes. A sperm cell has…',o:['46','23','92','12'],c:1,why:'Meiosis halves the number, so gametes have 23.'},{q:'Which process repairs a skin wound?',o:['Meiosis','Mitosis','Fertilisation','Osmosis'],c:1,why:'Mitosis makes identical cells for growth and repair.'}],
explain:{q:'Compare mitosis and meiosis.',pts:['DNA is copied first (sister chromatids)','Mitosis: 2 identical cells, growth and repair','Meiosis: 4 different cells, half the chromosomes, gametes','Meiosis has two divisions plus crossing over']},
bq:'What might happen if cell division in a tissue is not controlled?'}];

{id:'repl',sub:'mb',t:'DNA replication',pre:['dna','enzymes'],
learn:`<p>Before a cell divides, its DNA is copied. <b>Helicase</b> unwinds and unzips the helix. Each old strand becomes a <b>template</b>. <b>DNA polymerase</b> adds complementary nucleotides to build new strands.</p><p>Each new DNA molecule has <b>one old and one new strand</b>: this is <b>semi-conservative</b> replication. Polymerase proofreads and repair systems fix further errors, so replication is highly accurate, but some errors remain and become mutations.</p>`,
recall:[{q:'What does helicase do?',a:'It unwinds and unzips the DNA double helix.'},{q:'What does DNA polymerase do?',a:'It adds complementary nucleotides to build the new strand, and proofreads.'},{q:'What does semi-conservative mean?',a:'Each new DNA molecule has one old strand and one new strand.'}],
apply:[{q:'The template reads A-A-C-G. The new strand is…',o:['T-T-G-C','A-A-C-G','U-U-G-C','C-C-A-T'],c:0,why:'Each base pairs with its partner: A-T, A-T, C-G, G-C.'},{q:'Why must DNA be replicated before mitosis?',o:['To make RNA','So each daughter cell gets a full copy','To make proteins','To make ATP'],c:1,why:'Each new cell needs a complete set of DNA.'}],
explain:{q:'Explain how DNA is replicated.',pts:['Helicase unzips; each strand is a template','Polymerase adds complementary bases','Semi-conservative: one old, one new strand','Proofreading keeps errors very rare']},

{id:'tscr',sub:'mb',t:'Transcription (DNA to RNA)',pre:['dna'],
learn:`<p>Transcription copies a gene into <b>mRNA</b> in the nucleus. <b>RNA polymerase</b> reads the template strand and builds a complementary RNA strand.</p><p>RNA differs from DNA: it is single-stranded, has the sugar ribose, and uses <b>U (uracil)</b> instead of T. So template A→U, T→A, G→C, C→G. The RNA is complementary to the template strand and matches the coding strand, with U in place of T. In eukaryotes the mRNA is processed before it leaves the nucleus.</p><p>Each cell type transcribes different genes, which is why a neuron and a muscle cell differ despite identical DNA.</p>`,
recall:[{q:'What does RNA polymerase do?',a:'It builds an mRNA strand complementary to the DNA template.'},{q:'Name two differences between RNA and DNA.',a:'RNA is single-stranded and has uracil instead of thymine (and the sugar ribose).'},{q:'Where does transcription happen in eukaryotes?',a:'In the nucleus.'}],
apply:[{q:'The DNA template reads T-A-C-G. The mRNA is…',o:['A-U-G-C','U-A-C-G','A-T-G-C','T-A-C-G'],c:0,why:'T→A, A→U, C→G, G→C.'},{q:'Why can a neuron and a muscle cell differ with the same DNA?',o:['They have different DNA','Different genes are switched on','Neurons have no nucleus','They use different bases'],c:1,why:'Each cell transcribes only the genes it needs.'}],
explain:{q:'Explain transcription and how RNA differs from DNA.',pts:['RNA polymerase copies a gene into mRNA','mRNA: single strand, ribose, uracil not thymine','Template pairing: A→U, T→A, G→C, C→G','Different cells transcribe different genes']},
bq:'Why can cells with identical DNA become so different?'},
{id:'tlat',sub:'mb',t:'Translation (RNA to protein)',pre:['tscr','cells'],
learn:`<p>Translation builds a protein at the <b>ribosome</b>. The mRNA is read in groups of three bases called <b>codons</b>. Each codon specifies one amino acid (the genetic code). <b>tRNA</b> carries amino acids and matches codons with its anticodon.</p><p><b>AUG</b> is the start codon (Met). <b>UAA, UAG, UGA</b> are stop codons. The ribosome joins the amino acids into a chain that folds into the protein.</p>`,
recall:[{q:'What is a codon?',a:'Three mRNA bases that code for one amino acid (or a stop signal).'},{q:'What does tRNA do?',a:'It carries an amino acid and matches its anticodon to the mRNA codon.'},{q:'Which codon starts translation?',a:'AUG (methionine).'}],
apply:[{q:'AUG = Met and GCU = Ala. The mRNA AUG GCU codes for…',o:['Ala-Met','Met-Ala','Met only','a stop'],c:1,why:'Codons are read in order, left to right.'},{q:'How many bases are in the codons for exactly 10 amino acids (not counting a stop codon)?',o:['10','20','30','40'],c:2,why:'3 bases per amino acid.'}],

{id:'mut',sub:'mb',t:'Mutations',pre:['tlat'],
learn:`<p>A <b>mutation</b> is a change in the DNA sequence. Types: <b>silent</b> (amino acid unchanged), <b>missense</b> (a different amino acid), <b>nonsense</b> (creates a stop codon, so the protein is cut short), and <b>frameshift</b> (an insertion or deletion not in multiples of 3 shifts the reading frame of every codon after it and often creates an early stop codon).</p><p>A changed amino acid can change protein shape and function. Many mutations are harmless; some cause disease.</p>`,
recall:[{q:'What is a missense mutation?',a:'A base change that gives a different amino acid.'},{q:'Why are frameshift mutations often severe?',a:'They change every codon after the change.'},{q:'What is a silent mutation?',a:'A base change that does not change the amino acid.'}],
apply:[{q:'A mutation creates a UGA codon in the middle of a gene. This is…',o:['silent','missense','nonsense','frameshift'],c:2,why:'UGA is a stop codon, so translation ends early.'},{q:'Deleting one base from a gene usually causes a…',o:['silent mutation','frameshift','no change','missense only'],c:1,why:'It shifts the reading frame of all later codons.'}],

{id:'inh',sub:'mb',t:'Inheritance',pre:['division','mut'],
learn:`<p>Genes come in versions called <b>alleles</b>. We inherit one from each parent. <b>Genotype</b> = the alleles (AA, Aa, aa). <b>Phenotype</b> = the visible trait. A <b>dominant</b> allele (A) shows if present; a <b>recessive</b> allele (a) shows only with two copies.</p><p>A <b>Punnett square</b> predicts offspring chances. Two carriers (Aa × Aa) give 25% AA, 50% Aa, 25% aa, so a 25% chance of a recessive condition. Alleles separate in meiosis, so each gamete carries one.</p>`,
recall:[{q:'What is the difference between genotype and phenotype?',a:'Genotype is the alleles; phenotype is the observable trait.'},{q:'When does a recessive trait show?',a:'Only when two recessive alleles are present (aa).'},{q:'What is the chance of an aa child from Aa × Aa?',a:'25%.'}],
apply:[{q:'Aa × aa: what fraction of the children are aa?',o:['0','1/4','1/2','all'],c:2,why:'The aa parent always passes a; the Aa parent passes a in half of its gametes. So half of the children are aa.'},{q:'AA × aa: the children are…',o:['all Aa','all AA','half AA, half aa','all aa'],c:0,why:'Every child gets A from one parent and a from the other.'}],
explain:{q:'Explain alleles, dominance and how a Punnett square works.',pts:['Alleles: one from each parent','Genotype versus phenotype','Dominant shows with one copy; recessive needs two','Punnett squares give probabilities, not certainties']},
bq:'Two healthy parents are both carriers of a recessive disease. What is the chance their child is affected?'}];

function VU(){document.querySelectorAll('.viz input[type=range]').forEach(i=>{const s=document.getElementById(i.id+'v');if(s)s.textContent=i.value});
 const o=document.getElementById('vo'),id=L.id;let h='';
 if(id==='atoms'){AS.p=gv('p');AS.n=gv('n');AS.e=gv('e')}
 if(id==='ions'){const p=+document.getElementById('el').value;AS.p=p;AS.n=p;AS.e=gv('e')}
 if(id==='cells'){AS.ci=document.getElementById('ct').selectedIndex;AS.ch=+document.getElementById('ch').value;const I=['Pick an organelle to highlight it.','Holds the DNA. In bacteria it floats free in a nucleoid; in eukaryotes it is inside a nuclear envelope.','Makes most of the ATP in the cell. Eukaryotes only.','Builds proteins from RNA instructions. Found in every cell.','Folds proteins and makes lipids. Eukaryotes only.'];h=`<p>${AS.ci===1&&(AS.ch===2||AS.ch===4)?'Prokaryotes do not have this organelle.':I[AS.ch]}</p>`}
 if(id==='membrane'){AS.tm=document.getElementById('tm').selectedIndex;h=['<p><b>Simple diffusion:</b> small nonpolar molecules slip between the lipids, from crowded to sparse. No energy.</p>','<p><b>Facilitated diffusion:</b> a channel protein lets ions and polar molecules through, still from crowded to sparse. No energy.</p>','<p><b>Active transport:</b> the pump moves molecules from sparse to crowded, against the gradient, and spends ATP.</p>'][AS.tm]}
 if(id==='biomol'){AS.ct=document.getElementById('ct').selectedIndex;AS.cn=gv('cn');AS.cf=gv('cf');h=`<p>${['Sugar monomers join into starch or glycogen.','Amino acids join into a chain that folds into a 3D shape. Shape decides function.','Nucleotides join into DNA or RNA.'][AS.ct]} ${AS.cn} monomers, ${AS.cf<.3?'unfolded chain':AS.cf<.7?'partly folded':'folded'}.</p>`}
 if(id==='enzymes'){AS.s=gv('s');AS.eph=gv('eph');AS.et=gv('et');const r=enzRate();h=`<p><b>Reaction rate: ${Math.round(r*100)}% of maximum</b></p><p class="sub">${AS.et>55?'Too hot: the enzymes are denatured.':r<.05?'Far from the optimum, so almost no activity.':'Move each slider away from the optimum (about pH 7, 37 °C) and watch the rate fall.'}</p>`}
 if(id==='atp'){AS.ox=document.getElementById('ox').selectedIndex===0?1:0;AS.gl=gv('gl');const a=AS.gl*(AS.ox?30:2);h=`<p><b>${a} ATP</b> from ${AS.gl} glucose (${AS.ox?'about 30':'about 2'} each).</p><p class="sub">Without oxygen only glycolysis runs, and cells make lactate.</p>`}
 if(id==='division'){AS.mode=document.getElementById('md').selectedIndex;AS.stg=gv('sg');const N=AS.mode?['Interphase: DNA is copied','Meiosis I: homologous pairs line up','Meiosis I: homologs separate','Meiosis II: chromatids separate','End: four different cells, half the chromosomes']:['Interphase: DNA is copied','Prophase: chromosomes condense','Metaphase: they line up','Anaphase: chromatids pulled apart','Telophase: two identical cells'];h=`<p><b>${N[AS.stg]}</b></p>`}
 if(id==='dna'){AS.hm=0;AS.hn=gv('hn');AS.hp=1;const a=[...Array(AS.hn)].map((_,i)=>SQ[i%12]);h=`<p class="sub" style="font-family:monospace">Strand 1: ${a.join(' ')}<br>Strand 2: ${a.map(b=>CP[b]).join(' ')}</p><p>A–T: 2 hydrogen bonds. G–C: 3 hydrogen bonds.</p>`}
 if(id==='repl'){AS.hm=1;AS.hn=16;AS.hp=gv('hp');h=`<p><b>${Math.round(AS.hp*100)}% copied.</b> Each old strand is a template, so each new molecule keeps one old and one new strand (semi-conservative).</p>`}
 if(id==='tscr'){AS.hm=2;AS.hn=16;AS.hp=gv('hp');const k=Math.round(AS.hp*16);h=`<p class="sub" style="font-family:monospace">mRNA so far: ${[...Array(k)].map((_,i)=>RN[SQ[i%12]]).join(' ')||'(none yet)'}</p><p>The template base A gives U, T gives A, G gives C and C gives G.</p>`}
 if(id==='tlat'){AS.pm=0;AS.ts=gv('ts');const c=MRNA.slice(AS.ts*3,AS.ts*3+3);h=`<p><b>Codon ${AS.ts+1}: ${c} → ${CT[c]}</b></p><p class="sub">${CT[c]==='Stop'?'A stop codon: translation ends and the protein is released.':'The tRNA brings this amino acid and it joins the chain.'}</p>`}
 if(id==='mut'){AS.pm=1;AS.mi=document.getElementById('mi').selectedIndex;const E=['Normal protein.','Silent: GCU to GCC still codes Ala, so the protein is unchanged.','Missense: UUC to UUA changes Phe to Leu. One amino acid differs (red).','Nonsense: GGA to UGA is a stop codon, so the protein is cut short after 3 amino acids.','Frameshift: deleting one base shifts every codon after it, so all later amino acids change (red).'];h=`<p><b>${trl(MUT[AS.mi][1]).join('-')}</b></p><p class="sub">${E[AS.mi]}</p>`}
 if(id==='inh'){AS.g1=document.getElementById('g1').selectedIndex;AS.g2=document.getElementById('g2').selectedIndex;const p=[GA[AS.g1],GA[AS.g2]],k=[];for(const a of p[0])for(const b of p[1])k.push([a,b].sort().join(''));const n=g=>k.filter(x=>x===g).length;h=`<p><b>AA ${n('AA')}/4 · Aa ${n('Aa')}/4 · aa ${n('aa')}/4</b></p><p class="sub">Chance of the recessive trait (aa): ${n('aa')*25}%. Chance of at least one dominant allele showing: ${(4-n('aa'))*25}%.</p>`}
 if(id==='units'){AS.ma=gv('ma');AS.va=gv('va');AS.mb=gv('mb');AS.vb=gv('vb');const d=Math.PI/180,rx=AS.ma*Math.cos(AS.va*d)+AS.mb*Math.cos(AS.vb*d),ry=AS.ma*Math.sin(AS.va*d)+AS.mb*Math.sin(AS.vb*d);h=`<p><b>Resultant = ${Math.hypot(rx,ry).toFixed(1)} at ${((Math.atan2(ry,rx)/d+360)%360).toFixed(0)}°</b></p><p class="sub">Sizes alone (${AS.ma} + ${AS.mb} = ${AS.ma+AS.mb}) only equal the resultant when both point the same way. That is why direction matters.</p>`}
 if(id==='motion'){AS.mf=gv('mf');AS.mm=gv('mm');h=`<p><b>a = F ÷ m = ${AS.mf} ÷ ${AS.mm} = ${(AS.mf/AS.mm).toFixed(2)} m/s²</b></p><p class="sub">Double the mass and the acceleration halves. Double the force and it doubles.</p>`}
 if(id==='energy'){AS.pn=gv('pn');AS.pw=gv('pw');const hh=1-Math.cos(AS.pn*Math.PI/180);h=`<p><b>Maximum PE = mgh = ${AS.pw} × 9.8 × ${hh.toFixed(2)} = ${(AS.pw*9.8*hh).toFixed(1)} J</b> (pendulum length 1 m)</p><p class="sub">At the top all of it is PE; at the bottom all of it is KE.</p>`}
 if(id==='fluids'){AS.fr=document.getElementById('fr').selectedIndex;AS.fd=gv('fd');const P=RHO[AS.fr]*9.8*AS.fd;h=`<p><b>P = ρgh = ${(P/1000).toFixed(1)} kPa</b> (${Math.round(P/133.3)} mmHg)</p><p class="sub">Density ${RHO[AS.fr]} kg/m³ at ${AS.fd} m depth. Deeper or denser means more pressure. This is the pressure from the fluid alone, not counting the air above.</p>`}
 if(id==='elec'){AS.ev=gv('ev');AS.er=gv('er');const I=AS.ev/AS.er;h=`<p><b>I = V ÷ R = ${AS.ev} ÷ ${AS.er} = ${I.toFixed(2)} A</b></p><p class="sub">Power P = VI = ${(AS.ev*I).toFixed(1)} W. More resistance means less current, so a dimmer bulb.</p>`}
 if(id==='waves'){AS.wf=gv('wf');AS.wl=gv('wl');h=`<p><b>v = fλ = ${AS.wf} × ${AS.wl} = ${AS.wf*AS.wl} m/s</b></p><p class="sub">Same speed, higher frequency means shorter wavelength. Diagnostic ultrasound uses about 2 to 15 MHz.</p>`}
 if(id==='algebra'){AS.ca=gv('ca');AS.cb=gv('cb');AS.cc=gv('cc');h=AS.ca===0?`<p><b>${AS.cb} = ${AS.cc}</b> has no x in it, so no single solution.</p>`:`<p><b>${AS.ca}x + ${AS.cb} = ${AS.cc} → x = (${AS.cc} − ${AS.cb}) ÷ ${AS.ca} = ${((AS.cc-AS.cb)/AS.ca).toFixed(2)}</b></p><p class="sub">Subtract b from both sides, then divide by a. The red point is the solution.</p>`}
 if(id==='funcs'){AS.ft=document.getElementById('ft').selectedIndex;AS.cx=gv('cx');h=`<p><b>f(${AS.cx}) = ${FT[AS.ft](AS.cx).toFixed(2)}</b></p><p class="sub">One input gives exactly one output, so the point can only sit at one height.</p>`}
 if(id==='limits'){AS.lh=gv('lh');const h1=AS.lh;h=`<p><b>f(${(1-h1).toFixed(2)}) = ${(2-h1).toFixed(2)} · f(${(1+h1).toFixed(2)}) = ${(2+h1).toFixed(2)}</b></p><p class="sub">Both sides close in on 2 as h shrinks, so the limit at x = 1 is 2 even though the function is undefined there.</p>`}
 if(id==='deriv'){AS.dx=gv('dx');AS.dh=gv('dh');h=`<p><b>Secant slope ${(2*AS.dx+AS.dh).toFixed(2)} · tangent slope 2x = ${(2*AS.dx).toFixed(2)}</b></p><p class="sub">As h shrinks the secant slope approaches the tangent slope. That limit is the derivative.</p>`}
 if(id==='rates'){AS.rk=gv('rk');AS.rt=gv('rt');const C0=10*Math.exp(-AS.rk*AS.rt);h=`<p><b>C = ${C0.toFixed(2)} · rate dC/dt = −kC = ${(-AS.rk*C0).toFixed(2)} per hour</b></p><p class="sub">Half-life = 0.693 ÷ ${AS.rk} = ${(0.693/AS.rk).toFixed(1)} hours. The tangent is steeper when the level is high.</p>`}
 if(id==='integ'){AS.ib=gv('ib');AS.nr=gv('nr');const w=AS.ib/AS.nr;let sm=0;for(let i=0;i<AS.nr;i++)sm+=Math.pow(i*w,2)*w;h=`<p><b>Rectangles: ${sm.toFixed(2)} · exact b³/3: ${(AS.ib**3/3).toFixed(2)}</b></p><p class="sub">The gap is ${(AS.ib**3/3-sm).toFixed(2)}. Add more rectangles and it shrinks toward zero.</p>`}
 const rt=(k,m)=>{AS.rl=k;AS.ri=Math.min(gv('ri'),RING[k].length-1);const q=RING[k][AS.ri];return`<p><b>${AS.ri+1}. ${q[0]}</b></p><p>${q[1]}</p>`};
 if(id==='terms'){AS.wi=document.getElementById('wi').selectedIndex;const w=WORDS[AS.wi];h=`<p><b>${w[1].map(p=>p[0]+' = '+p[1]).join(' + ')}</b></p><p class="sub">So ${w[0]} means: ${w[1].map(p=>p[1]).join(' ')}.</p>`}
 if(id==='anat'){AS.bpl=document.getElementById('bpl').selectedIndex;AS.bd=document.getElementById('bd').selectedIndex;h=['<p><b>Superior</b> is toward the head, <b>inferior</b> toward the feet.</p>','<p><b>Anterior</b> is the front of the body, <b>posterior</b> the back.</p>','<p><b>Medial</b> is toward the midline, <b>lateral</b> away from it.</p>','<p><b>Proximal</b> is nearer the trunk, <b>distal</b> farther from it (hand versus shoulder).</p>'][AS.bd]+['','<p class="sub">Sagittal plane: divides left from right.</p>','<p class="sub">Coronal plane: divides front from back.</p>','<p class="sub">Transverse plane: divides upper from lower.</p>'][AS.bpl]}
 if(id==='comm')h=rt('comm');
 if(id==='consent')h=rt('consent');
 if(id==='role')h=rt('role');
 if(id==='fa1'){AS.fv=document.getElementById('fv').selectedIndex;AS.bpm=gv('bpm');h=AS.fv?`<p><b>${AS.bpm} compressions per minute: ${AS.bpm<100?'too slow':AS.bpm>120?'too fast':'in the recommended range (100 to 120)'}</b></p><p class="sub">Push 5 to 6 cm deep in the centre of the chest, then let it recoil. 30 compressions, then 2 breaths. Learn the real technique on an accredited course.</p>`:rt('fa')}
 if(id==='fa2'){const k=['bleed','burn','frac','rec'][document.getElementById('ij').selectedIndex];h=rt(k)}
 if(id==='ratios'){AS.pmd=document.getElementById('pmd').selectedIndex;AS.pk=gv('pk');AS.px=gv('px');const y=AS.pmd?AS.pk/AS.px:AS.pk*AS.px;h=`<p><b>${AS.pmd?'y = '+AS.pk+' ÷ '+AS.px:'y = '+AS.pk+' × '+AS.px} = ${y.toFixed(2)}</b></p><p class="sub">${AS.pmd?'Inverse: double x and y halves.':'Direct: double x and y doubles.'} Real examples: dose = rate × weight (direct); current = voltage ÷ resistance (inverse in R).</p>`}

const CA=[
{id:'algebra',sub:'calc',t:'Algebra & rearranging',pre:[],
learn:`<p>Solve equations by doing the <b>same thing to both sides</b>. Rearrange formulas to isolate a variable: M = n/V gives n = M × V (M in mol/L, n in mol, V in L, so convert mL to L first).</p><p><b>Exponents:</b> aᵐ × aⁿ = aᵐ⁺ⁿ, a⁻ⁿ = 1/aⁿ, so 10⁻³ = 0.001. A <b>logarithm</b> undoes a power: log₁₀(10ˣ) = x (this is where pH = −log[H⁺] comes from).</p><p>A <b>linear equation</b> y = ax + b has slope a and intercept b.</p>`,
recall:[{q:'Solve 3x + 2 = 11.',a:'x = 3.'},{q:'Rearrange V = IR to find R.',a:'R = V ÷ I.'},{q:'What is log₁₀(1000)?',a:'3.'}],
apply:[{q:'Solve 2x − 5 = 9.',o:['2','7','14','4'],c:1,why:'Add 5: 2x = 14, then divide by 2: x = 7.'},{q:'What is 10⁻² as a decimal?',o:['0.01','0.001','100','−20'],c:0,why:'10⁻² = 1/100 = 0.01.'}],
explain:{q:'Explain how to solve and rearrange equations, and what exponents and logs do.',pts:['Do the same to both sides','Rearrange a formula by isolating the variable','Negative exponents mean fractions (10⁻³ = 0.001)','A log undoes a power: log(10ˣ) = x']},
bq:'Why do drug-dose calculations need rearranging formulas?'},
{id:'funcs',sub:'calc',t:'Functions & graphs',pre:['algebra'],
learn:`<p>A <b>function</b> gives exactly one output y for each input x: y = f(x). <b>Linear</b> y = ax + b is a straight line; <b>quadratic</b> y = x² is a parabola; <b>exponential</b> y = 2ˣ grows rapidly (y = 2⁻ˣ decays rapidly); <b>sine</b> repeats in a wave.</p><p>When reading a graph, check the <b>axes and units</b> first. <b>Domain</b> is the set of allowed inputs; <b>range</b> is the set of outputs.</p>`,
recall:[{q:'What is a function?',a:'A rule giving exactly one output for each input.'},{q:'What shape is a quadratic graph?',a:'A parabola.'},{q:'What do you check first when reading a graph?',a:'The axes: what is plotted and the units.'}],
apply:[{q:'If f(x) = 2x + 1, what is f(3)?',o:['6','7','5','9'],c:1,why:'2 × 3 + 1 = 7.'},{q:'Which type of function describes steady doubling?',o:['linear','quadratic','exponential','sine'],c:2,why:'Repeated doubling is exponential growth.'}],
explain:{q:'Explain what a function is and name the main shapes.',pts:['A function gives one output for each input','Linear, quadratic, exponential and sine shapes','Read axes and units first','Domain and range']},
bq:'Why do medicine and physiology use graphs so much?'},
{id:'limits',sub:'calc',t:'Limits',pre:['funcs'],
learn:`<p>A <b>limit</b> is the value a function approaches as x approaches a number, even if it never reaches it: lim<sub>x→a</sub> f(x) = L.</p><p>Example: f(x) = (x² − 1)/(x − 1) is undefined at x = 1 (division by zero) but equals x + 1 everywhere else, so as x → 1 the limit is <b>2</b>. Check by trying values from <b>both sides</b>.</p><p>Limits are the foundation of the derivative and the integral.</p>`,
recall:[{q:'What does a limit describe?',a:'The value a function approaches as x approaches a point.'},{q:'Can a function have a limit at a point where it is undefined?',a:'Yes. The limit depends on nearby values, not on the value at the point.'},{q:'What are limits used to define?',a:'Derivatives and integrals.'}],
apply:[{q:'What is the limit of x + 3 as x approaches 2?',o:['2','3','5','undefined'],c:2,why:'Substituting x = 2 gives 5.'},{q:'f(x) = (x² − 4)/(x − 2). The limit as x → 2 is…',o:['0','2','4','undefined'],c:2,why:'It simplifies to x + 2, which approaches 4.'}],
explain:{q:'Explain what a limit is and how to find one.',pts:['A limit is the value approached, not necessarily reached','Check from both sides','Undefined at a point does not mean no limit','Limits underpin derivatives and integrals']},
bq:'Where does approaching a value show up in medicine?'},
{id:'deriv',sub:'calc',t:'Derivatives',pre:['limits'],
learn:`<p>The <b>derivative</b> f′(x) is the <b>instantaneous rate of change</b>: the slope of the tangent line. It is the limit of the slope between two points as the gap h shrinks to 0: f′(x) = lim (f(x+h) − f(x))/h.</p><p><b>Power rule:</b> d/dx (xⁿ) = n xⁿ⁻¹. Constants have derivative 0. Example: x² → 2x.</p><p>Positive slope = rising, negative = falling, zero = a flat tangent: a peak, a trough, or neither (x³ has zero slope at 0 but keeps rising).</p>`,
recall:[{q:'What does a derivative measure?',a:'The instantaneous rate of change (the slope of the tangent).'},{q:'Give the derivative of x².',a:'2x.'},{q:'What does a derivative of zero mean on a graph?',a:'The tangent is flat. The point may be a peak, a trough, or neither.'}],
apply:[{q:'The derivative of x³ is…',o:['3x²','x²','3x','x⁴/4'],c:0,why:'Power rule: bring down 3, reduce the power by 1.'},{q:'Where the slope is negative, the function is…',o:['rising','falling','flat','undefined'],c:1,why:'A negative slope means the value is decreasing.'}],
explain:{q:'Explain what a derivative is and how to find a simple one.',pts:['Derivative = slope of the tangent = instantaneous rate','Limit of (f(x+h) − f(x))/h as h → 0','Power rule: d/dx xⁿ = n xⁿ⁻¹','Sign of the slope: rising, falling, flat']},
bq:'Why do doctors care about the rate of change and not only the value?'},
{id:'rates',sub:'calc',t:'Rates of change in medicine',pre:['deriv'],
learn:`<p>Drug elimination follows <b>exponential decay</b>: C(t) = C₀ e<sup>−kt</sup>. The rate of change is the derivative: <b>dC/dt = −kC</b>, so the drug leaves faster when the level is high.</p><p><b>Half-life</b> t½ = 0.693/k is the time for the level to halve. After 1 half-life 50% remains, after 2: 25%, after 3: 12.5%. About 5 half-lives remove most (about 97%) of a drug under this model, which does not mean it is undetectable or clinically irrelevant.</p>`,
recall:[{q:'What does half-life mean?',a:'The time for the concentration to fall to half.'},{q:'How much drug remains after 3 half-lives?',a:'12.5%.'},{q:'Why does the elimination rate fall as the level falls?',a:'Because dC/dt = −kC, so the rate is proportional to the concentration.'}],
apply:[{q:'A drug has a half-life of 4 hours. What fraction remains after 8 hours?',o:['1/2','1/4','1/8','0'],c:1,why:'Two half-lives: (1/2)² = 1/4.'},{q:'If k increases, the half-life…',o:['gets longer','gets shorter','stays the same','doubles'],c:1,why:'t½ = 0.693/k, so a larger k means a shorter half-life.'}],
explain:{q:'Explain exponential decay and half-life for a drug.',pts:['C = C₀ e^(−kt) models elimination','Rate = −kC, proportional to the concentration','Half-life = 0.693/k','About 5 half-lives clear most of a drug']},
bq:'Why do some drugs need dosing every 6 hours and others once a day?'},
{id:'integ',sub:'calc',t:'Integration basics',pre:['deriv'],
learn:`<p>The <b>definite integral</b> ∫ₐᵇ f(x) dx is the <b>area under the curve</b> between a and b. You can approximate it with rectangles: more, thinner rectangles give a better answer.</p><p><b>Power rule:</b> ∫ xⁿ dx = xⁿ⁺¹/(n+1) + C for n ≠ −1 (and ∫ 1/x dx = ln|x| + C). Example: ∫₀ᵇ x² dx = b³/3. Integration reverses differentiation. Area below the axis counts as negative.</p>`,
recall:[{q:'What does a definite integral represent?',a:'The area under the curve between two limits.'},{q:'What is the integral of x²?',a:'x³/3 (plus a constant for an indefinite integral).'},{q:'How is integration related to differentiation?',a:'It is the reverse process.'}],
apply:[{q:'What is ∫₀² x dx?',o:['1','2','4','0.5'],c:1,why:'x²/2 evaluated from 0 to 2 is 2.'},{q:'Using more, thinner rectangles to estimate an area gives…',o:['a worse estimate','a better estimate','the same estimate','no estimate'],c:1,why:'Thinner rectangles fit the curve more closely.'}],
explain:{q:'Explain what a definite integral is and how rectangles approximate it.',pts:['Definite integral = area under the curve','Rectangles approximate it; thinner is better','Power rule: x^(n+1)/(n+1) + C, for n ≠ −1','Integration reverses differentiation']},
bq:'What does the area under a drug concentration-time curve tell a doctor?'}];

{id:'terms',sub:'prof',t:'Medical terminology',pre:[],
learn:`<p>Many medical words are built from parts: a <b>prefix</b> (start), a <b>root</b> (core meaning) and a <b>suffix</b> (ending). Not every word has all three, and a combining vowel (often o) can join the parts, as in cardi/o/logy. Break an unfamiliar word into parts to decode it.</p><p><b>Prefixes:</b> hyper- (above), hypo- (below), tachy- (fast), brady- (slow). <b>Roots:</b> card (heart), gastr (stomach), hepat (liver), nephr (kidney), neur (nerve), dermat (skin), arthr (joint). <b>Suffixes:</b> -itis (inflammation), -ectomy (removal), -algia (pain), -logy (study of), -aemia (blood condition).</p>`,
recall:[{q:'What does the suffix -itis mean?',a:'Inflammation.'},{q:'What is the difference between tachycardia and bradycardia?',a:'Tachycardia is a fast heart rate; bradycardia is a slow one.'},{q:'What does the root nephr refer to?',a:'The kidney.'}],
apply:[{q:'Hepatitis literally means…',o:['kidney pain','inflammation of the liver','removal of the liver','study of blood'],c:1,why:'hepat (liver) + itis (inflammation).'},{q:'Which word means removal of the stomach?',o:['gastritis','gastrectomy','gastralgia','gastrology'],c:1,why:'gastr (stomach) + ectomy (removal).'}],
explain:{q:'Explain how medical words are built, using two examples.',pts:['Word = prefix + root + suffix','The root carries the core meaning (card = heart)','The suffix gives the type (-itis inflammation, -ectomy removal)','Split an unknown word into parts to work out its meaning']},
bq:'Why does a doctor need exact medical language instead of everyday words?'},
{id:'anat',sub:'prof',t:'Anatomical language',pre:['terms'],
learn:`<p><b>Anatomical position:</b> standing upright, facing forward, arms by the sides, palms forward. All directions describe the <b>patient</b> body, so the patient left is on your right when you face them.</p><p><b>Directions:</b> superior/inferior (above/below), anterior/posterior (front/back), medial/lateral (toward/away from the midline), proximal/distal (nearer to/farther from a point of attachment or origin; used for limbs and other structures).</p><p><b>Planes:</b> sagittal (left and right), coronal (front and back), transverse (upper and lower).</p>`,
recall:[{q:'Name the three body planes and what each divides.',a:'Sagittal: right and left portions (midsagittal gives equal halves). Coronal: front and back. Transverse: upper and lower.'},{q:'What does proximal mean?',a:'Closer to the point of attachment or the trunk.'},{q:'How is the body held in anatomical position?',a:'Standing upright, facing forward, arms by the sides, palms forward.'}],
apply:[{q:'The knee is ______ to the ankle.',o:['proximal','distal','medial','posterior'],c:0,why:'The knee is closer to the trunk than the ankle is.'},{q:'A cut that separates the body into front and back halves is a…',o:['sagittal plane','coronal plane','transverse plane','medial plane'],c:1,why:'The coronal plane divides front from back.'}],
explain:{q:'Explain anatomical position, the main directions and the three planes.',pts:['Anatomical position is the standard reference','Directions are from the patient perspective','Superior/inferior, anterior/posterior, medial/lateral, proximal/distal','Sagittal, coronal and transverse planes']},
bq:'Why must everyone describe position from the patient perspective?'},
{id:'comm',sub:'prof',t:'Communication skills',pre:[],
learn:`<p>A good consultation usually follows a pattern, though the order can change as the conversation develops: <b>prepare</b>, <b>introduce</b> yourself (name, role) and confirm who the patient is (using the required identifiers), <b>gather</b> information, <b>explain</b>, agree a <b>plan</b>, and <b>close</b>.</p><p>Start with <b>open questions</b> ("Tell me what brought you in") then use <b>closed questions</b> ("Is the pain sharp?"). Listen without interrupting and show empathy. Use plain language in small chunks, then check understanding with <b>teach-back</b>: ask the patient to say it in their own words.</p>`,
recall:[{q:'What is the difference between an open and a closed question?',a:'An open question invites a full answer; a closed one needs yes, no or a short answer.'},{q:'What is teach-back?',a:'Asking the patient to explain the information in their own words to check understanding.'},{q:'Name the first two steps of a consultation.',a:'Prepare, then introduce yourself and confirm the patient identity.'}],
apply:[{q:'Which is an open question?',o:['Is the pain sharp?','Do you smoke?','Can you tell me what brought you in today?','Is it worse at night?'],c:2,why:'It cannot be answered with yes or no.'},{q:'After explaining a medication, the best way to check understanding is to…',o:['ask "Do you understand?"','ask the patient to say it back','repeat it louder','hand over a leaflet only'],c:1,why:'Teach-back shows what the patient actually took in.'}],
explain:{q:'Explain the structure of a good consultation and key communication skills.',pts:['Introduce yourself and confirm identity','Open questions first, then closed','Listen actively and show empathy','Explain simply and check understanding (teach-back)']},
bq:'Why do patients often leave a consultation not remembering what they were told?'},
{id:'consent',sub:'prof',t:'Consent & confidentiality',pre:['comm'],
learn:`<p><b>Valid consent</b> needs: <b>capacity</b> (the person can understand, remember, weigh up and communicate a decision), enough <b>information</b> (benefits, risks, alternatives), a <b>voluntary</b> choice (no pressure), and it must be <b>specific</b> to the procedure. A patient with capacity may refuse or withdraw consent. Record it.</p><p><b>Confidentiality:</b> patient information is protected and shared only on an appropriate legal and professional basis: relevant information may go to authorised members of the care team who need it, other disclosures may need the patient permission, and the law may require or allow disclosure, including to prevent serious harm. Rules vary by country and institution, so follow LAU and local guidance.</p>`,
recall:[{q:'List the elements of valid consent.',a:'Capacity, adequate information, voluntary choice, and specific to the procedure.'},{q:'Can a patient with capacity refuse treatment?',a:'Yes, even if the doctor disagrees.'},{q:'Who may you share patient information with?',a:'Only on an appropriate legal and professional basis: authorised care-team members who need it; other disclosures may need consent or be required or allowed by law.'}],
apply:[{q:'Which would make consent invalid?',o:['The patient asked questions','The patient was told the risks','The patient was pressured by a relative','The patient took time to decide'],c:2,why:'Consent must be voluntary.'},{q:'You want to chat with friends about a patient you saw today. The right move is to…',o:['share it without the name','not discuss identifiable patient details','share it if it is interesting','post it online anonymously'],c:1,why:'Details can identify a patient even without a name.'}],
explain:{q:'Explain valid consent and the duty of confidentiality.',pts:['Consent needs capacity, information and voluntariness','It is specific and can be withdrawn','Confidentiality: share only with those who need to know','Exceptions: the law or serious risk of harm']},
bq:'Why does patient trust matter for making a correct diagnosis?'},
{id:'fa1',sub:'prof',t:'First aid: response & CPR',pre:[],
learn:`<p><i>This is an introduction. Learn the hands-on skills on an accredited first-aid course.</i></p><p><b>1. Danger:</b> check the scene is safe. <b>2. Response:</b> tap the shoulders and shout. <b>3. Send for help:</b> call emergency services (for South African learners, 112 from a mobile or 10177 for an ambulance; verify the current official numbers) and get an AED. <b>4. Airway:</b> tilt the head, lift the chin. <b>5. Breathing:</b> check for no more than 10 seconds whether it is normal; occasional or laboured gasps are not normal breathing.</p><p>Adult not breathing normally? Start <b>CPR</b> as trained: <b>30 compressions then 2 breaths</b>, pushing hard (5 to 6 cm) and fast (<b>100 to 120 per minute</b>) in the centre of the chest, letting the chest recoil. Minimise interruptions. If untrained or unable to give breaths, do hands-only compressions and follow the emergency call handler instructions. Use an <b>AED</b> as soon as it arrives and follow its prompts.</p>`,
recall:[{q:'What is the first thing to check at any emergency?',a:'That the scene is safe for you.'},{q:'What are the recommended adult CPR rate and ratio?',a:'100 to 120 compressions per minute; 30 compressions to 2 breaths.'},{q:'What do you do once you find an unresponsive person who is not breathing normally?',a:'Activate emergency help, arrange for an AED, and start CPR promptly. If alone, follow the call handler instructions and do not delay CPR unnecessarily.'}],
apply:[{q:'A person collapses and does not respond. After making sure the scene is safe, you should…',o:['move them immediately','check response and call for help','give water','wait and see'],c:1,why:'Check response, then send for help and an AED.'},{q:'Which adult compression rate is recommended?',o:['40 to 60 per minute','60 to 80','100 to 120','140 to 160'],c:2,why:'100 to 120 per minute.'}],
explain:{q:'Explain the steps of the first-aid response to a collapsed adult and how CPR is done.',pts:['Check the scene is safe first','Check response, call for help, get an AED','Open the airway, check breathing for no more than 10 seconds','CPR: 30:2, 5 to 6 cm deep, 100 to 120 per minute']},
bq:'Why does starting CPR early matter so much?'},
{id:'fa2',sub:'prof',t:'First aid: injuries',pre:['fa1'],
learn:`<p><i>Educational overview only; take an accredited course.</i></p><p><b>Heavy bleeding:</b> call emergency services and press firmly on the wound with a clean pad and keep pressing; if blood soaks through, add more pads on top instead of lifting the dressing. Do not remove an embedded object; press around it. For life-threatening limb bleeding that pressure does not control, a tourniquet may be needed if one is available and you are trained. <b>Burns:</b> cool under running water for about 20 minutes, remove jewellery near the burn, cover loosely with a clean non-fluffy dressing or suitable covering (no cling film over the face); no ice, creams or butter. Seek urgent help for large, deep, electrical, chemical, face, hand or genital burns. <b>Suspected fracture:</b> keep still, support and immobilise the part, get help. <b>Unconscious but breathing normally:</b> place in the <b>recovery position</b> to keep the airway clear and keep checking breathing. Call emergency services for serious injuries.</p>`,
recall:[{q:'What is the first action for heavy bleeding?',a:'Apply firm direct pressure to the wound.'},{q:'How should a burn be cooled?',a:'Under cool running water for about 20 minutes.'},{q:'What do you do for an unconscious person who is breathing normally?',a:'Place them in the recovery position and keep checking their breathing.'}],
apply:[{q:'Which should NOT be put on a fresh burn?',o:['Cool running water','Cling film covering','Butter','A clean loose dressing'],c:2,why:'Butter and creams trap heat and raise infection risk.'},{q:'A person has a suspected broken arm. You should…',o:['straighten it','support and immobilise it and get help','make them use it','massage it'],c:1,why:'Keep the injured part still and get help.'}],
explain:{q:'Explain first aid for bleeding, burns, fractures and an unconscious breathing person.',pts:['Bleeding: firm direct pressure, keep it on','Burns: cool running water for 20 minutes, cover loosely','Fracture: immobilise, do not straighten','Unconscious and breathing: recovery position']},
bq:'Why is direct pressure the first step for heavy bleeding?'},
{id:'role',sub:'prof',t:'Introduction to the profession',pre:['comm','consent'],
learn:`<p>A doctor does more than diagnose. The <b>clinical loop</b>: <b>communicate</b> → <b>gather information</b> (history, examination, tests) → <b>reason</b> (what could this be?) → <b>decide</b> → <b>act</b> (treat, refer) → <b>document</b> → <b>reassess</b> → <b>escalate</b> when needed, at any stage. The steps overlap in real practice.</p><p>Core values: <b>patient safety first</b>, honesty, respect, confidentiality, teamwork and lifelong learning. Work within your <b>competence</b>, know your limits and ask for help early.</p>`,
recall:[{q:'List the steps of the clinical loop.',a:'Communicate, gather information, reason, decide, act, document, reassess, escalate when needed.'},{q:'What does working within your competence mean?',a:'Doing only what you are trained to do and asking for help beyond it.'},{q:'Name two core professional values.',a:'For example patient safety, honesty, respect, confidentiality, teamwork.'}],
apply:[{q:'You are unsure about a condition that is outside your training. You should…',o:['guess to avoid looking weak','ask a senior for help','ignore it','send the patient home'],c:1,why:'Asking for help protects the patient.'},{q:'Why is documentation part of care?',o:['It is only for lawyers','It lets the whole team see what was found and done','It replaces talking to the patient','It is optional'],c:1,why:'Clear records keep care safe and continuous.'}],
explain:{q:'Explain what doctors do beyond making a diagnosis.',pts:['They communicate, gather, reason, decide and act','They document and reassess','They escalate when out of their depth','Patient safety and honesty come first']},
bq:'Why is reassessing a step in the loop and not an afterthought?'}];
Object.assign(BR,{
terms:{chain:['Medical words are built from parts','Each part has one exact meaning','So a word can be decoded even if you have not seen it','The same word means the same thing everywhere','Fewer mistakes when teams hand over patients'],tie:'You decoded words from their parts, which is how doctors read unfamiliar terms. Precise words keep care safe.',a:'Everyday words are vague, but medical terms have exact meanings every clinician shares. That prevents errors in notes, handovers and prescriptions.'},
anat:{chain:['Anatomical position is the shared reference','Terms are always relative to the patient','So left means the patient left, whoever is looking','A scan, note or handover reads the same for everyone','This prevents wrong-side errors'],tie:'The same fixed viewpoint lets a radiologist, a surgeon and a nurse mean the same place.',a:'A shared reference means everyone describes the same location the same way. Mixing up left and right can lead to wrong-side procedures.'},
comm:{chain:['People under stress retain little','Medical language is unfamiliar','Long explanations overload memory','Small chunks plus teach-back check what landed','Understanding improves safety and following the plan'],tie:'Teach-back is the check you just saw: it turns "did you get that?" into proof.',a:'Stress and jargon reduce what people remember. Explaining in short plain steps and asking the patient to say it back helps them follow the plan.'},
consent:{chain:['Patients disclose sensitive facts only if they trust you','Confidentiality protects that trust','An honest history means a better diagnosis','Consent respects the patient as the decision-maker','Trust improves outcomes and safety'],tie:'Both rules protect the same thing: the trust that makes an honest history possible.',a:'Diagnosis depends on an honest history. Patients share sensitive details only when they trust it stays confidential and that they control decisions about their care.'},
fa1:{chain:['In cardiac arrest the heart stops pumping','Blood flow to the brain stops','Brain cells begin to die within minutes without oxygen','CPR keeps some blood flowing','Early CPR plus a shock from an AED improves survival'],tie:'Compressions do the heart job by hand: they circulate blood until the heart can be restarted.',a:'Without circulation the brain is starved of oxygen and damage starts within minutes. CPR keeps some blood moving until a defibrillator or paramedics arrive.'},
fa2:{chain:['Blood loss lowers the blood volume','Less blood means less oxygen delivered to organs','Pressure slows the loss and lets a clot form','Direct pressure is the priority; avoid unnecessary movement','This buys time until medical help arrives'],tie:'This is the Physics lesson at work: squeezing the vessel raises resistance and reduces flow out of it.',a:'Pressing on the wound slows the loss and allows clotting, keeping enough blood volume to supply the organs until help arrives.'},
role:{chain:['A first impression can be wrong','Patients change over time','Reassessing checks whether treatment works','New findings may change the diagnosis','Escalating early prevents harm'],tie:'Medicine is a loop, not a line: each pass tests your first idea against what the patient does next.',a:'Conditions evolve and first impressions can be wrong. Reassessing checks whether the plan is working and catches deterioration early.'}});

terms:[{s:'The suffix -ectomy means inflammation.',t:false,w:'It means removal. Inflammation is -itis.'},{s:'Hypertension means abnormally low pressure.',t:false,w:'Hyper- means above, so high pressure. Hypo- means below.'}],
anat:[{s:'Distal means closer to the trunk.',t:false,w:'Distal is farther away. Proximal is closer.'},{s:'A sagittal plane divides the body into left and right parts.',t:true,w:'Sagittal planes run front to back and split left from right.'}],
comm:[{s:'Closed questions are the best way to start a consultation.',t:false,w:'Start open so the patient can tell their story, then use closed questions.'},{s:'Asking "Do you understand?" reliably shows the patient understood.',t:false,w:'Many people say yes anyway. Use teach-back.'}],
consent:[{s:'A relative can always give consent for an adult with capacity.',t:false,w:'An adult with capacity decides for themselves.'},{s:'Confidentiality never has any exceptions.',t:false,w:'The law or a serious risk of harm can justify disclosure.'}],
fa1:[{s:'You should start chest compressions before checking the scene is safe.',t:false,w:'Safety first, so you do not become a second casualty.'},{s:'Compressions should be slow and shallow to avoid hurting the person.',t:false,w:'They must be hard and fast. Circulation matters more than ribs.'}],
fa2:[{s:'Ice is the best treatment for a burn.',t:false,w:'Use cool running water. Ice can damage the tissue.'},{s:'An unconscious person who is breathing normally should be left on their back.',t:false,w:'Use the recovery position to keep the airway clear.'}],
