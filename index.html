{id:'redox',sub:'chem',t:'Oxidation & reduction',pre:['ions','stoich'],
learn:`<p><b>Oxidation</b> is loss of electrons and <b>reduction</b> is gain of electrons (OIL RIG: Oxidation Is Loss, Reduction Is Gain). They always happen together: one substance is oxidised while another is reduced. In biology, electrons often travel with hydrogen: <b>NAD⁺</b> is reduced to <b>NADH</b> when it picks up electrons, and NADH gives them up in the mitochondria to make ATP.</p><p>Na → Na⁺ is oxidation (0 to +1); Cl → Cl⁻ is reduction (0 to −1). An <b>oxidising agent</b> accepts electrons and is itself reduced; a <b>reducing agent</b> donates them. Oxygen is a strong oxidising agent, which is why it is the final electron acceptor in respiration.</p>`,
recall:[{q:'What does OIL RIG stand for?',a:'Oxidation Is Loss, Reduction Is Gain (of electrons).'},{q:'What happens to NAD⁺ when it carries electrons?',a:'It is reduced to NADH.'},{q:'Why must oxidation and reduction occur together?',a:'Electrons lost by one substance must be gained by another.'}],
apply:[{q:'In Mg → Mg²⁺ + 2e⁻ the magnesium is…',o:['oxidised','reduced','neutralised','unchanged'],c:0,why:'It loses electrons, so it is oxidised.'},{q:'Which species is the final electron acceptor in aerobic respiration?',o:['oxygen','glucose','NAD⁺','CO₂'],c:0,why:'Electrons from the chain are passed to oxygen, forming water.'}],
explain:{q:'Explain oxidation and reduction and their role in respiration.',pts:['Oxidation is loss of electrons; reduction is gain','They always occur together','NAD⁺ and NADH carry electrons in metabolism','Oxygen is the final electron acceptor in respiration']},
bq:'Why does cyanide stop cells using oxygen even though oxygen is plentiful?',
dp:'Redox potential measures a substance tendency to accept electrons; electrons flow from carriers with lower potential to higher, which is the energy source for the electron transport chain. Oxidative stress occurs when reactive oxygen species such as superoxide overwhelm antioxidant defences (glutathione, catalase, superoxide dismutase) and damage lipids, proteins and DNA. Hydrogen peroxide is used as an antiseptic oxidising agent; vitamins C and E act as antioxidants.',
t2:Q('In the reaction Fe³⁺ + e⁻ → Fe²⁺ the iron is…',['reduced','oxidised','neither','a catalyst only'],0,'It gains an electron, so it is reduced.'),
t3:Q('Which statement about cyanide poisoning is correct?',['Cyanide blocks the final transfer of electrons to oxygen in mitochondria','Cyanide stops haemoglobin carrying oxygen','Cyanide removes oxygen from the air','Cyanide turns NADH into glucose'],0,'Cyanide inhibits cytochrome c oxidase. Carbon monoxide mainly binds haemoglobin and reduces oxygen carrying.')},
{id:'equil',sub:'chem',t:'Equilibrium & buffers',pre:['ph','stoich'],
learn:`<p>Many reactions are <b>reversible</b>: A + B ⇌ C + D. At <b>equilibrium</b> the forward and reverse rates are equal, so concentrations stay constant (the reactions have not stopped). The equilibrium constant K = [products] ÷ [reactants], each raised to its coefficient. <b>Le Chatelier principle:</b> if you disturb a system at equilibrium, it shifts to oppose the change.</p><p>A <b>weak acid</b> HA ⇌ H⁺ + A⁻ only partly dissociates; its strength is given by <b>Ka</b> or <b>pKa</b> (pKa = −log Ka). A <b>buffer</b> is a weak acid with its conjugate base: added H⁺ is mopped up by A⁻, and added OH⁻ by HA. The <b>Henderson-Hasselbalch</b> equation, <b>pH = pKa + log([A⁻]/[HA])</b>, shows that a buffer works best within about 1 pH unit of its pKa.</p>`,
recall:[{q:'What is true of the forward and reverse rates at equilibrium?',a:'They are equal, so concentrations stay constant.'},{q:'State the Le Chatelier principle.',a:'A system at equilibrium shifts to oppose a disturbance.'},{q:'What is a buffer made of?',a:'A weak acid and its conjugate base.'}],
apply:[{q:'A buffer has [A⁻] = [HA]. Its pH equals…',o:['its pKa','7','0','its Ka'],c:0,why:'log(1) = 0, so pH = pKa.'},{q:'Added H⁺ in an acetate buffer is mainly neutralised by…',o:['the conjugate base A⁻','water','the weak acid HA','nothing'],c:0,why:'A⁻ combines with H⁺ to form HA.'}],
explain:{q:'Explain equilibrium, the Le Chatelier principle and how a buffer works.',pts:['Equilibrium: equal forward and reverse rates','Le Chatelier: the system shifts to oppose a disturbance','Weak acids partly dissociate (Ka, pKa)','Buffer = weak acid + conjugate base; pH = pKa + log(A⁻/HA)']},
bq:'How does blood stay at pH 7.4 when your cells constantly make acid?',
dp:'The bicarbonate system has a pKa of about 6.1 yet is a powerful buffer at pH 7.4 because CO₂ is open to the lungs: breathing out CO₂ pulls the equilibrium. Haemoglobin and other proteins are also major buffers. The anion gap, Na⁺ − (Cl⁻ + HCO₃⁻), estimates unmeasured anions; a raised gap points to added acids such as lactate or ketoacids.',
t2:Q('A buffer has pKa 4.8 and [A⁻]/[HA] = 10. Its pH is…',['3.8','4.8','5.8','6.8'],2,'pH = 4.8 + log 10 = 5.8.'),
t3:Q('A patient hyperventilates and blows off CO₂. Using Le Chatelier on CO₂ + H₂O ⇌ H⁺ + HCO₃⁻, blood pH will…',['rise (less H⁺)','fall (more H⁺)','stay exactly the same','rise because bicarbonate increases'],0,'Less CO₂ shifts the equilibrium toward CO₂, lowering H⁺ and raising pH (respiratory alkalosis).')},
{id:'signal',sub:'bio',t:'Cell signalling',pre:['membrane','biomol'],
learn:`<p>Cells communicate with chemical signals. A <b>ligand</b> (hormone, neurotransmitter, drug) binds a <b>receptor</b> and triggers a response. <b>Lipid-soluble</b> signals such as steroid hormones cross the membrane and bind receptors inside the cell, changing gene expression. <b>Water-soluble</b> signals such as insulin and adrenaline bind receptors on the cell surface.</p><p>Surface receptors relay the message by <b>signal transduction</b>: steps involving <b>second messengers</b> (for example cAMP and Ca²⁺) and enzymes called <b>kinases</b> that add phosphate groups. Each step can <b>amplify</b> the signal: one hormone molecule can lead to thousands of activated enzymes. Signals are switched off by removing the ligand and by <b>phosphatases</b>.</p>`,
recall:[{q:'What is a ligand?',a:'A molecule that binds a receptor, such as a hormone, neurotransmitter or drug.'},{q:'Where do steroid hormones bind their receptors?',a:'Inside the cell, because they are lipid soluble and cross the membrane.'},{q:'Name two second messengers.',a:'cAMP and Ca²⁺.'}],
apply:[{q:'Which signal most needs a cell-surface receptor?',o:['insulin','cortisol','oestrogen','testosterone'],c:0,why:'Insulin is a water-soluble protein hormone and cannot cross the membrane.'},{q:'Why does signal transduction amplify a signal?',o:['One activated enzyme can activate many molecules','Receptors divide','Ligands multiply inside the cell','The signal gets louder in the blood'],c:0,why:'Each step in the cascade activates many molecules of the next.'}],
explain:{q:'Explain how a cell responds to a hormone.',pts:['A ligand binds a receptor','Lipid-soluble signals act inside; water-soluble act at the surface','Transduction uses second messengers and kinases','Amplification, and switching off by phosphatases']},
bq:'How can a drug that blocks one receptor change heart rate?',
dp:'G-protein-coupled receptors (GPCRs) are the largest family of drug targets: ligand binding activates a G protein that changes enzyme activity (adenylyl cyclase raises cAMP; phospholipase C raises IP₃ and Ca²⁺). Receptor tyrosine kinases (insulin, growth factors) phosphorylate themselves and other proteins. Receptors can be desensitised or down-regulated with prolonged stimulation, one reason drug tolerance develops. Many cancers carry signalling proteins stuck switched on, such as RAS.',
t2:Q('One hormone activates an enzyme that activates 100 molecules of a second enzyme, each making 1000 product molecules. How many product molecules result from one hormone molecule?',['1100','100 000','1000','100'],1,'1 × 100 × 1000 = 100 000: cascades amplify.'),
t3:Q('Prolonged exposure to a drug often reduces the response to the same dose. Which mechanism contributes?',['Receptor desensitisation or down-regulation','Receptors multiplying','The ligand becoming lipid soluble','Ca²⁺ leaving the body'],0,'Cells reduce receptor number or sensitivity after prolonged stimulation, contributing to tolerance.')},
{id:'metab',sub:'bio',t:'Metabolism: glycolysis to ATP',pre:['atp','enzymes','redox'],
learn:`<p>Glucose is oxidised in stages. <b>Glycolysis</b> (cytoplasm): glucose (6C) → 2 pyruvate (3C), a net 2 ATP and 2 NADH, no oxygen needed. With oxygen, pyruvate enters the mitochondrion and becomes <b>acetyl-CoA</b> (making NADH and releasing CO₂). The <b>citric acid (Krebs) cycle</b> oxidises acetyl-CoA to CO₂ and makes NADH, FADH₂ and a little ATP or GTP. NADH and FADH₂ carry electrons to the <b>electron transport chain</b>, which pumps H⁺ across the inner membrane; H⁺ flowing back through <b>ATP synthase</b> makes most of the ATP (oxidative phosphorylation).</p><p>Without oxygen the chain stops, NADH cannot be re-oxidised, and pyruvate is converted to <b>lactate</b> to regenerate NAD⁺ so glycolysis can continue.</p>`,
recall:[{q:'Where does glycolysis occur and what is its net ATP?',a:'In the cytoplasm; net 2 ATP per glucose.'},{q:'What do NADH and FADH₂ deliver to the electron transport chain?',a:'Electrons.'},{q:'What makes most ATP in aerobic respiration?',a:'ATP synthase driven by the H⁺ gradient across the inner mitochondrial membrane (oxidative phosphorylation).'}],
apply:[{q:'Which stage produces the most ATP?',o:['Glycolysis','Citric acid cycle','Oxidative phosphorylation','Fermentation'],c:2,why:'The electron transport chain and ATP synthase make most of the ATP.'},{q:'Why is lactate formed when mitochondria cannot use pyruvate?',o:['It regenerates NAD⁺ so glycolysis can continue','It makes extra ATP','It removes CO₂','It stores glucose'],c:0,why:'Converting pyruvate to lactate re-oxidises NADH to NAD⁺.'}],
explain:{q:'Explain how a glucose molecule is turned into ATP.',pts:['Glycolysis: cytoplasm, net 2 ATP, pyruvate','Acetyl-CoA and the citric acid cycle make NADH and FADH₂','The electron transport chain and ATP synthase make most ATP','Lactate regenerates NAD⁺ when oxygen is limited']},
bq:'Why can a thiamine (vitamin B1) deficiency cause a build-up of lactate?',
dp:'Phosphofructokinase-1 is the key control point of glycolysis, inhibited by high ATP and citrate and activated by AMP. The brain depends heavily on glucose, so hypoglycaemia quickly causes confusion. Fat is oxidised by beta-oxidation to acetyl-CoA, and in prolonged fasting the liver makes ketone bodies. Uncoupling proteins let H⁺ leak back, releasing heat instead of ATP (brown fat; also the poison 2,4-dinitrophenol).',
t2:Q('One glucose goes through glycolysis. How many pyruvate and how much net ATP are made?',['2 pyruvate, 2 ATP','1 pyruvate, 4 ATP','2 pyruvate, 36 ATP','4 pyruvate, 2 ATP'],0,'Glycolysis gives 2 pyruvate and a net 2 ATP.'),
t3:Q('Heavy drinkers can be thiamine deficient. Why should a patient like this get thiamine along with glucose?',['Glucose metabolism needs thiamine-dependent enzymes, and glucose alone can worsen the deficiency','Thiamine is a sugar','Glucose destroys thiamine','Thiamine is a source of ATP'],0,'Pyruvate dehydrogenase and other enzymes need thiamine. This is a mechanism question, not treatment advice.')},
{id:'cycle',sub:'bio',t:'Cell cycle & cancer',pre:['division','repl'],
learn:`<p>The <b>cell cycle</b> has <b>G1</b> (growth), <b>S</b> (DNA replication), <b>G2</b> (preparation) and <b>M</b> (mitosis). Some cells leave the cycle (<b>G0</b>) and rest or differentiate. <b>Cyclins</b> and <b>cyclin-dependent kinases (CDKs)</b> drive progression, and <b>checkpoints</b> (G1/S, G2/M and the spindle checkpoint) stop the cycle if DNA is damaged or chromosomes are not aligned.</p><p><b>Tumour suppressor</b> genes such as <b>p53</b> act as brakes: they halt the cycle for repair or trigger <b>apoptosis</b> (programmed cell death). <b>Oncogenes</b> such as RAS are accelerators that are stuck on. <b>Cancer</b> arises when mutations accumulate that disable brakes and jam accelerators, so cells divide without control and escape apoptosis.</p>`,
recall:[{q:'List the phases of the cell cycle in order.',a:'G1, S, G2, M.'},{q:'What does a tumour suppressor such as p53 do?',a:'It halts the cycle for repair or triggers apoptosis when DNA is damaged.'},{q:'What is an oncogene?',a:'A gene whose product promotes cell division and, when mutated or overactive, can drive cancer.'}],
apply:[{q:'DNA is replicated in which phase?',o:['G1','S','G2','M'],c:1,why:'S stands for synthesis of DNA.'},{q:'A mutation inactivates p53. What is the likely consequence?',o:['Damaged cells may keep dividing','Cells stop dividing','Apoptosis increases','DNA repair becomes perfect'],c:0,why:'Without the brake, damaged cells can pass the checkpoint.'}],
explain:{q:'Explain how the cell cycle is controlled and how cancer arises.',pts:['Phases G1, S, G2, M','Cyclins, CDKs and checkpoints control progression','Tumour suppressors brake; oncogenes accelerate','Cancer needs several mutations']},
bq:'Why do most cancers arise in older people and need several mutations?',
dp:'p53 is the most commonly mutated gene in human cancers; Li-Fraumeni syndrome is an inherited p53 mutation with high cancer risk. The Rb protein restrains the G1/S transition. The Philadelphia chromosome (a BCR-ABL fusion) makes a constantly active kinase in chronic myeloid leukaemia, targeted by imatinib. In Knudson two-hit thinking, an inherited tumour-suppressor mutation needs only one more somatic hit, which explains early-onset familial cancers.',
t2:Q('A cell has damaged DNA at the G1/S checkpoint. In a healthy cell, p53 would…',['arrest the cycle for repair or trigger apoptosis','speed the cell into S phase','block apoptosis','remove the checkpoint'],0,'p53 halts progression and triggers repair, or apoptosis if damage is severe.'),
t3:Q('Imatinib works in chronic myeloid leukaemia because the cancer is driven by…',['a constantly active BCR-ABL kinase that the drug blocks','loss of p53 only','an extra chromosome 21','a virus that cannot be treated'],0,'The BCR-ABL fusion makes an always-on kinase, and imatinib inhibits it.')},
{id:'tissue',sub:'bio',t:'Tissues & organ systems',pre:['cells'],
learn:`<p>Cells of similar type and function form <b>tissues</b>. The four basic tissue types are <b>epithelial</b> (covers surfaces and lines cavities; secretes and absorbs), <b>connective</b> (supports and connects: bone, blood, fat, cartilage, tendon, with cells in an extracellular matrix), <b>muscle</b> (contracts: skeletal, cardiac, smooth) and <b>nervous</b> (conducts signals: neurons and glia).</p><p>Tissues combine into <b>organs</b>, and organs cooperate in <b>organ systems</b> (cardiovascular, respiratory, digestive). Cells connect through <b>junctions</b>: tight junctions seal gaps, desmosomes anchor cells under stress, and gap junctions let ions pass between cells (as in the heart). Structure fits function: thin, flat epithelium suits gas exchange; thick, layered epithelium suits protection.</p>`,
recall:[{q:'Name the four basic tissue types.',a:'Epithelial, connective, muscle and nervous.'},{q:'Which junction lets ions pass directly between cells?',a:'Gap junctions.'},{q:'What is the extracellular matrix?',a:'Material made by cells outside them (fibres and ground substance) that supports tissue, such as collagen in connective tissue.'}],
apply:[{q:'Which tissue lines the air sacs for gas exchange?',o:['thin flat epithelium','thick connective tissue','skeletal muscle','nervous tissue'],c:0,why:'A thin flat layer keeps the diffusion distance short.'},{q:'Which tissue type includes blood, bone and fat?',o:['connective','epithelial','muscle','nervous'],c:0,why:'These are all connective tissues.'}],
explain:{q:'Explain the four tissue types and how they form organs.',pts:['Four tissue types','Tissues form organs, organs form systems','Junctions: tight, desmosomes, gap','Structure fits function']},
bq:'Why does damage to cardiac muscle matter so much more than damage to the skin surface?',
dp:'Epithelia are classified by layers (simple or stratified) and cell shape (squamous, cuboidal, columnar). Most cancers (carcinomas) arise from epithelium because epithelial cells divide frequently. Collagen defects cause connective tissue diseases (for example Ehlers-Danlos syndromes), and scurvy impairs collagen synthesis because vitamin C is needed to hydroxylate proline. Regeneration varies: the liver regenerates well, neurons and cardiac muscle poorly.',
t2:Q('A lining of several layers of flat cells that resists wear, as in the skin, is…',['stratified squamous epithelium','simple squamous epithelium','simple columnar epithelium','smooth muscle'],0,'Stratified means several layers and squamous means flat cells.'),
t3:Q('Scurvy (vitamin C deficiency) causes bleeding gums and poor wound healing. The best explanation is…',['collagen cannot be made properly, weakening connective tissue','muscle fibres stop contracting','neurons stop firing','epithelium becomes cancerous'],0,'Vitamin C is needed to make stable collagen, which supports vessel walls and gums.')},
{id:'greg',sub:'mb',t:'Gene regulation',pre:['tscr','mut'],
learn:`<p>Every cell holds the same genome but expresses different genes. <b>Gene regulation</b> controls how much of each gene product is made. <b>Promoters</b> are DNA sequences where RNA polymerase starts; <b>transcription factors</b> bind DNA to switch genes on or off; <b>enhancers</b> and silencers can act from a distance. DNA wrapped tightly around histones (<b>heterochromatin</b>) is generally silent, while loosely packed <b>euchromatin</b> is accessible. DNA <b>methylation</b> and histone modification are <b>epigenetic</b> marks that change expression without changing the sequence.</p><p>Bacteria regulate genes in groups called <b>operons</b>. In the <b>lac operon</b> a repressor blocks transcription until lactose is present, so the cell makes lactose-digesting enzymes only when needed. Control also happens after transcription (mRNA stability, microRNAs) and after translation (protein activation and degradation).</p>`,
recall:[{q:'What is a promoter?',a:'A DNA sequence where RNA polymerase binds to start transcription.'},{q:'What do transcription factors do?',a:'They bind DNA to switch genes on or off.'},{q:'What is epigenetics?',a:'Changes in gene expression, such as DNA methylation and histone modification, that do not change the DNA sequence.'}],
apply:[{q:'Tightly packed heterochromatin is generally…',o:['transcriptionally silent','highly active','free of histones','made of RNA'],c:0,why:'Tight packing blocks access for RNA polymerase.'},{q:'In the lac operon the repressor is released when…',o:['lactose is present','glucose is present','RNA polymerase is absent','DNA is methylated'],c:0,why:'Lactose (as allolactose) binds the repressor, freeing the gene to be transcribed.'}],
explain:{q:'Explain how gene expression is regulated.',pts:['Promoters and transcription factors control transcription','Enhancers act at a distance; chromatin accessibility matters','Epigenetic marks change expression without changing sequence','Operons: the lac operon switches on only when lactose is present']},
bq:'How can identical twins with the same DNA differ in disease risk?',
dp:'Most genes are regulated by combinations of transcription factors, and mutations in regulatory regions or transcription-factor genes cause disease. Imprinting is epigenetic silencing of one parental allele (Prader-Willi and Angelman syndromes). X-inactivation silences one X chromosome in female cells. MicroRNAs bind mRNA to block translation or promote its degradation. Steroid hormone receptors act as transcription factors. Azacitidine is a drug that inhibits DNA methylation.',
t2:Q('A lac operon repressor is mutated so it can no longer bind DNA. With no lactose present, the lac genes will be…',['expressed constantly','never expressed','expressed only with lactose','destroyed'],0,'Without a repressor bound, transcription is not blocked.'),
t3:Q('Why can a mutation in a distant enhancer cause disease even though the protein-coding gene is normal?',['It changes how much of the normal protein is made','It changes the amino acid sequence','It deletes the gene','It converts DNA to RNA'],0,'Regulatory mutations alter expression levels, not the protein sequence.')},
{id:'repair',sub:'mb',t:'DNA damage & repair',pre:['repl','mut'],
learn:`<p>DNA is damaged constantly by UV light, chemicals, radiation and normal metabolism, and copying errors also occur. Cells repair it: <b>mismatch repair</b> fixes wrong bases left by replication; <b>base-excision repair</b> removes a single damaged base; <b>nucleotide-excision repair</b> cuts out bulky lesions such as UV-induced thymine dimers; <b>double-strand break repair</b> (homologous recombination or non-homologous end joining) fixes the most dangerous damage.</p><p>If damage is too severe the cell arrests the cycle (via p53) and may undergo apoptosis. When repair genes are faulty, mutations accumulate and cancer risk rises: for example, defective nucleotide-excision repair in <b>xeroderma pigmentosum</b>, defective mismatch repair in <b>Lynch syndrome</b>, and defective homologous recombination with <b>BRCA1/2</b> mutations.</p>`,
recall:[{q:'Name two DNA repair pathways.',a:'For example mismatch repair, base-excision repair, nucleotide-excision repair or double-strand break repair.'},{q:'What kind of damage does UV light mainly cause?',a:'Thymine dimers (bulky lesions repaired by nucleotide-excision repair).'},{q:'Why do repair defects raise cancer risk?',a:'Mutations accumulate in oncogenes and tumour suppressors.'}],
apply:[{q:'Which pathway fixes wrong bases left after replication?',o:['mismatch repair','nucleotide-excision repair','double-strand break repair','transcription'],c:0,why:'Mismatch repair checks the new strand for copying errors.'},{q:'People with xeroderma pigmentosum are severely sun-sensitive because they cannot…',o:['repair UV damage to DNA','make melanin only','replicate DNA','translate mRNA'],c:0,why:'Their nucleotide-excision repair is defective.'}],
explain:{q:'Explain how cells deal with DNA damage.',pts:['DNA is damaged constantly','Pathways: mismatch, base-excision, nucleotide-excision, double-strand break','Severe damage triggers arrest or apoptosis','Faulty repair genes raise cancer risk']},
bq:'Why are PARP inhibitors especially effective in cancers with BRCA mutations?',
dp:'Ionising radiation causes double-strand breaks, the most dangerous lesion. Non-homologous end joining is quick but error-prone; homologous recombination uses the sister chromatid for accurate repair, so it works mainly in S and G2. Lynch syndrome (hereditary non-polyposis colorectal cancer) is caused by mismatch repair gene mutations and gives microsatellite instability. Cisplatin and radiotherapy damage DNA, and cancer cells struggle to repair it.',
t2:Q('Which repair pathway corrects a thymine dimer caused by UV light?',['nucleotide-excision repair','mismatch repair','base-excision repair','translation'],0,'Bulky lesions that distort the helix are cut out by nucleotide-excision repair.'),
t3:Q('A woman carries a BRCA1 mutation. Her breast cancer risk is raised mainly because…',['accurate repair of double-strand DNA breaks is impaired, so mutations accumulate','she makes extra oestrogen receptors only','her cells never divide','her DNA cannot replicate at all'],0,'BRCA1 is needed for homologous recombination repair. Loss of function allows damage and mutations to accumulate.')},
{id:'chrom',sub:'mb',t:'Chromosome abnormalities',pre:['division','inh'],
learn:`<p>Humans normally have 46 chromosomes: 22 pairs of <b>autosomes</b> and 2 sex chromosomes (XX or XY). A <b>karyotype</b> is a picture of the chromosomes arranged in pairs. <b>Aneuploidy</b> is an abnormal chromosome number, usually from <b>non-disjunction</b> in meiosis: trisomy 21 (Down syndrome), trisomy 18 and 13, monosomy X (Turner syndrome, 45,X) and XXY (Klinefelter syndrome).</p><p><b>Structural</b> changes include <b>deletions</b>, <b>duplications</b>, <b>inversions</b> and <b>translocations</b> (a piece moves to another chromosome). A <b>balanced translocation</b> carrier may be healthy but can have children with an unbalanced translocation. Chromosome changes can also arise in body cells and cause cancer (the Philadelphia chromosome).</p>`,
recall:[{q:'What is aneuploidy?',a:'An abnormal number of chromosomes, for example trisomy or monosomy.'},{q:'What most often causes trisomy 21?',a:'Non-disjunction of chromosome 21 in meiosis (usually maternal).'},{q:'What is a translocation?',a:'A piece of one chromosome moves to another chromosome.'}],
apply:[{q:'Turner syndrome has the karyotype…',o:['45,X','47,XXY','47,XX,+21','46,XY'],c:0,why:'One X chromosome is missing.'},{q:'Klinefelter syndrome has the karyotype…',o:['47,XXY','45,X','47,XX,+21','46,XX'],c:0,why:'There is an extra X chromosome in a male.'}],
explain:{q:'Explain chromosome number and structure abnormalities.',pts:['Normal karyotype: 46 chromosomes','Aneuploidy from non-disjunction (trisomy 21, Turner, Klinefelter)','Structural changes: deletion, duplication, inversion, translocation','Balanced translocation carriers can have affected children']},
bq:'Why does the risk of Down syndrome rise with maternal age?',
dp:'Most chromosome-number abnormalities are lost early in pregnancy; trisomies 13, 18 and 21 are among those that can survive to birth. About 95% of Down syndrome is full trisomy 21, about 4% translocation (often Robertsonian) and about 1% mosaic. Screening (combined test, cell-free DNA) estimates risk, and diagnostic tests (amniocentesis, chorionic villus sampling) confirm it. Microarrays detect small deletions and duplications; the 22q11.2 deletion causes DiGeorge syndrome.',
t2:Q('A girl has the karyotype 45,X. How many chromosomes does she have, and what is the condition?',['45; Turner syndrome','47; Down syndrome','46; normal','47; Klinefelter syndrome'],0,'One X is missing: monosomy X, Turner syndrome.'),
t3:Q('A healthy couple has had two miscarriages and a child with Down syndrome caused by a translocation. A reasonable explanation is…',['one parent carries a balanced translocation','the child had a point mutation','the mother ate the wrong food','chromosomes never separate'],0,'A balanced carrier can produce unbalanced gametes, causing miscarriages or an affected child.')},
{id:'gtest',sub:'mb',t:'Genetic testing & interpretation',pre:['inh','mut'],
learn:`<p>A genetic test looks for a variant (change) in DNA, RNA or chromosomes. Results are classified as <b>pathogenic</b>, <b>likely pathogenic</b>, a <b>variant of uncertain significance (VUS)</b>, <b>likely benign</b> or <b>benign</b>. A VUS is not a diagnosis and should not change management on its own.</p><p><b>Penetrance</b> is the chance that a person with a variant shows the condition; <b>expressivity</b> is how severe it is. Not everyone with a pathogenic variant becomes ill (incomplete penetrance). <b>Diagnostic</b> tests confirm a suspected condition, <b>carrier screening</b> finds healthy carriers of recessive variants, <b>predictive</b> tests assess future risk, and <b>screening</b> tests estimate risk without being diagnostic. A negative test does not exclude disease if the test cannot detect that kind of variant. Genetic counselling supports informed choices, consent and privacy.</p>`,
recall:[{q:'What is a variant of uncertain significance?',a:'A variant whose effect on health is not known; it is not a diagnosis.'},{q:'What is penetrance?',a:'The proportion of people with a variant who show the condition.'},{q:'What is carrier screening?',a:'Testing healthy people to find carriers of recessive variants.'}],
apply:[{q:'A test reports a VUS. The correct interpretation is…',o:['It is uncertain; do not treat it as a diagnosis','It proves the disease','It proves the person is healthy','The test failed'],c:0,why:'A VUS has unknown significance.'},{q:'A pathogenic variant has 60% penetrance. This means…',o:['60% of carriers show the condition','60% of the genome is affected','the variant is 60% pathogenic','60% of cells are affected'],c:0,why:'Penetrance is the proportion of carriers who show the condition.'}],
explain:{q:'Explain how genetic test results are interpreted.',pts:['Variants are classified from pathogenic to benign','A VUS is not a diagnosis','Penetrance and expressivity vary','Test types differ; a negative test has limits; counselling and consent matter']},
bq:'Why is genetic counselling needed before and after testing, not just a lab result?',
dp:'Positive predictive value depends on how common the condition is, so the same test gives more false positives in low-risk groups. Cell-free DNA prenatal screening for trisomy 21 has high sensitivity but is screening, not diagnostic. Newborn blood-spot screening (for example for phenylketonuria) allows early treatment. Whole-exome and genome sequencing can find incidental variants. The ACMG framework guides variant classification. Privacy protections for genetic data differ between countries, so local rules apply.',
t2:Q('A screening test is 99% sensitive and 99% specific for a condition with prevalence 1 in 1000. Among 100 000 people screened, about how many true positives and false positives are there?',['99 true, about 1000 false','990 true, 10 false','100 true, 100 false','1000 true, 0 false'],0,'100 have the condition and 99 are detected. Of the 99 900 without it, 1% (about 999) test positive. Most positives are false.'),
t3:Q('Both partners test as carriers of the same autosomal recessive condition. Each pregnancy has what chance of an affected child?',['25%','50%','100%','12.5%'],0,'Two carriers (Aa × Aa) have a 1 in 4 chance of an affected child each pregnancy.')}];
Object.assign(BR,{
redox:{chain:['Respiration passes electrons along a chain of carriers','Each step is a redox reaction','The chain ends by giving electrons to oxygen','Cyanide blocks the last carrier (cytochrome c oxidase)','Electrons back up, oxygen is not used and ATP production collapses'],tie:'Redox is the moving of electrons: stop the final transfer to oxygen and the whole chain stops, as you saw when the chain jammed.',a:'Cyanide inhibits cytochrome c oxidase, the step that passes electrons to oxygen. The chain backs up, oxygen goes unused and ATP production collapses.'},
equil:{chain:['Cells constantly produce CO₂ and acids','CO₂ + H₂O ⇌ H⁺ + HCO₃⁻','Bicarbonate mops up extra H⁺ (buffer)','Breathing out CO₂ shifts the equilibrium (Le Chatelier)','The kidneys adjust bicarbonate over days'],tie:'The ratio of base to acid you moved sets the pH, and breathing shifts the equilibrium to restore it.',a:'The bicarbonate buffer absorbs extra H⁺. Breathing out CO₂ shifts the equilibrium to remove H⁺, and the kidneys slowly adjust bicarbonate.'},
signal:{chain:['Adrenaline binds beta receptors on heart cells','The receptor raises cAMP inside the cell','cAMP activates kinases that increase calcium entry','Heart rate and contraction force rise','A beta-blocker occupies the receptor, so the chain never starts'],tie:'The amplification slider showed how one binding event becomes a large response; blocking the first step stops the whole cascade.',a:'Beta-blockers occupy the beta receptor so adrenaline cannot trigger the cAMP cascade, lowering heart rate and contraction force.'},
metab:{chain:['Pyruvate dehydrogenase converts pyruvate to acetyl-CoA','It needs thiamine (vitamin B1) as a cofactor','Without thiamine pyruvate cannot enter the cycle','Pyruvate is diverted to lactate','Lactate builds up and ATP supply falls, especially in brain and heart'],tie:'The pathway you stepped through shows how one missing cofactor can block the flow at a single step.',a:'Pyruvate dehydrogenase needs thiamine. If it is deficient, pyruvate cannot enter aerobic metabolism and is converted to lactate, so lactate rises and ATP production falls.'},
cycle:{chain:['Each cell division risks a copying error','Checkpoints and repair catch most errors','Cancer needs several hits: brakes off and accelerators on','These mutations accumulate over time and cell divisions','So cancer risk rises with age and with DNA-damaging exposures'],tie:'The checkpoint you saw is the safeguard. Cancer is what happens when several of them are lost.',a:'Cancer typically needs several mutations that disable tumour suppressors and activate oncogenes. These accumulate over time and cell divisions, so risk rises with age and with DNA-damaging exposures such as smoking and UV.'},
tissue:{chain:['Skin epithelium renews itself quickly by cell division','Cardiac muscle cells divide very little in adults','Dead cardiac muscle is replaced mostly by scar (connective tissue)','Scar does not contract','So a heart attack permanently reduces pumping ability'],tie:'Tissue type predicts repair: epithelium regenerates, cardiac muscle largely cannot.',a:'Epithelium regenerates quickly, but adult cardiac muscle has very limited regeneration, so damaged muscle is replaced by non-contracting scar and pumping ability is reduced.'},
greg:{chain:['Twins share the same DNA sequence','Environment and chance affect epigenetic marks','Marks change which genes are expressed','Different expression alters cell behaviour','So disease risk can differ despite identical DNA'],tie:'Regulation, not sequence alone, decides which proteins a cell makes, the same control that makes a neuron differ from a muscle cell.',a:'Epigenetic marks and different environments change which genes are switched on, so twins with the same sequence can have different expression patterns and disease risk.'},
repair:{chain:['BRCA1/2 are needed for accurate double-strand break repair','Cancer cells with BRCA mutations rely on PARP backup repair','A PARP inhibitor blocks that backup','Damage accumulates beyond repair','Cancer cells die, while normal cells with working BRCA cope better'],tie:'Two repair routes, one already lost: removing the second leaves the cell unable to cope. This is called synthetic lethality.',a:'BRCA-mutant cancer cells lack accurate double-strand break repair and depend on PARP-mediated backup repair. Blocking PARP leaves unrepairable damage, so cancer cells die more than normal cells (synthetic lethality).'},
chrom:{chain:['Eggs begin meiosis before birth and pause for decades','Cohesion between chromosomes and spindle function deteriorate with age','Chromosomes are more likely to fail to separate (non-disjunction)','The egg then carries two copies of chromosome 21','Fertilisation produces trisomy 21'],tie:'The meiosis stepper showed chromosomes separating; this is what happens when that separation fails.',a:'Human eggs are held in meiosis for decades and chromosome cohesion weakens with age, so non-disjunction becomes more likely, giving an egg with an extra chromosome 21.'},
gtest:{chain:['A result may be uncertain, risk-based or affect relatives','Penetrance means risk is a probability, not a certainty','Patients must understand limits and options before testing','Results can have family, insurance and employment implications','Counselling supports informed consent and decisions'],tie:'The numbers you worked with (carrier chances, penetrance, false positives) are probabilities, and counselling is how they become understandable choices.',a:'Genetic results are often probabilities, can be uncertain and can affect relatives, so patients need to understand them and give informed consent before and after testing.'}});

{id:'gas',sub:'phys',t:'Gas laws & diffusion',pre:['fluids'],
learn:`<p>Gas <b>pressure</b> comes from molecules colliding with the walls. <b>Boyle's law</b>: at constant temperature P × V is constant, so halving the volume doubles the pressure. <b>Charles's law</b>: at constant pressure, volume rises with absolute temperature (kelvin). Combined: PV = nRT. In a mixture, <b>Dalton's law</b> says the total pressure is the sum of the partial pressures; air is about 21% O₂, so at sea level PO₂ is about 0.21 × 101 kPa (roughly 160 mmHg).</p><p><b>Diffusion</b> is net movement from high to low concentration (or partial pressure). <b>Fick's law</b>: diffusion rate rises with surface area and the concentration (pressure) difference and falls with the diffusion distance. The lungs have a huge surface and a very thin barrier, so gases cross quickly. Breathing uses Boyle's law: the diaphragm contracts, chest volume rises, pressure falls and air flows in.</p>`,
recall:[{q:'State Boyle law.',a:'At constant temperature, pressure × volume is constant: halving the volume doubles the pressure.'},{q:'What does Fick law say about diffusion?',a:'The rate rises with surface area and concentration difference, and falls with diffusion distance.'},{q:'Why does air flow in when the diaphragm contracts?',a:'Chest volume rises, so pressure falls below atmospheric pressure (Boyle law) and air flows in.'}],
apply:[{q:'A gas at 100 kPa is compressed to half its volume at constant temperature. The pressure becomes…',o:['50 kPa','100 kPa','200 kPa','400 kPa'],c:2,why:'P × V is constant, so halving V doubles P.'},{q:'Which change speeds up diffusion across a membrane?',o:['A larger surface area','A thicker membrane','A smaller concentration difference','A longer diffusion distance'],c:0,why:'Rate rises with surface area.'}],
explain:{q:'Explain the gas laws and what controls diffusion.',pts:['Boyle law: PV is constant at constant temperature','Dalton: partial pressures add; air is about 21% oxygen','Fick: rate rises with area and gradient, falls with distance','Breathing: a volume change changes pressure']},
bq:'Why does fluid in the alveoli make a patient breathless and low in oxygen?',
dp:'The alveolar gas equation, PAO₂ = FiO₂ × (Patm − PH₂O) − PaCO₂/R, gives about 100 mmHg breathing air at sea level. At altitude the oxygen fraction is the same but the total pressure is lower, so PO₂ falls. Henry law says dissolved gas is proportional to partial pressure: this is why divers risk decompression sickness and why hyperbaric oxygen raises dissolved oxygen. Gas transfer falls in emphysema (less surface area) and pulmonary fibrosis (a thicker barrier).',
t2:Q('A syringe holds 60 mL of air at 1 atm. The plunger is pushed to 20 mL at constant temperature. The pressure is about…',['0.33 atm','1 atm','3 atm','20 atm'],2,'P₁V₁ = P₂V₂: 1 × 60 = P₂ × 20, so P₂ = 3 atm.'),
t3:Q('A climber at 5000 m breathes air that is still 21% oxygen, yet becomes hypoxic. Why?',['The total pressure is lower, so the partial pressure of oxygen is lower','The oxygen percentage falls to 5%','Haemoglobin stops working','The lungs lose their surface area'],0,'PO₂ = 0.21 × total pressure. Lower total pressure means lower PO₂ and less driving force into the blood.')},
{id:'heat',sub:'phys',t:'Heat & thermoregulation',pre:['energy','homeo'],
learn:`<p><b>Temperature</b> measures the average kinetic energy of particles; <b>heat</b> is energy transferred because of a temperature difference. The <b>specific heat capacity</b> c is the energy needed to raise 1 kg by 1 °C: Q = mcΔT. Water has a high specific heat capacity (about 4200 J/kg·°C), so the body, which is mostly water, warms and cools slowly.</p><p>Heat moves by <b>conduction</b> (contact), <b>convection</b> (moving air or fluid), <b>radiation</b> (infrared) and <b>evaporation</b> (sweat takes about 2.4 MJ per kg evaporated). The body holds its core near 37 °C by balancing heat made (metabolism, exercise) against heat lost. In hot, humid air evaporation is poor, so heat loss falls and core temperature can rise (heat illness). In cold, heat loss can exceed production and the core falls (hypothermia).</p>`,
recall:[{q:'State the equation for the heat needed to change temperature.',a:'Q = m × c × ΔT.'},{q:'Name the four ways the body loses heat.',a:'Conduction, convection, radiation and evaporation.'},{q:'Why is hot, humid weather dangerous for exercise?',a:'Sweat cannot evaporate well, so heat loss falls and core temperature can rise.'}],
apply:[{q:'How much energy raises 2 kg of water by 5 °C (c = 4200 J/kg·°C)?',o:['4200 J','21 000 J','42 000 J','8400 J'],c:2,why:'Q = 2 × 4200 × 5 = 42 000 J.'},{q:'Which heat-loss route works best on a very hot, dry day?',o:['Evaporation of sweat','Conduction to the air','Radiation to the surroundings','Convection only'],c:0,why:'When the air is hotter than the skin, evaporation is the main way to lose heat.'}],
explain:{q:'Explain heat, temperature and how the body keeps its temperature.',pts:['Temperature versus heat; Q = mcΔT','Conduction, convection, radiation, evaporation','Water has a high specific heat capacity','Heat balance sets core temperature']},
bq:'Why is a wet, windy day colder than a dry, still day at the same air temperature?',
dp:'Newton law of cooling: the rate of heat loss is proportional to the temperature difference with the surroundings. Core temperature is controlled by the hypothalamus. Heat stroke is a core temperature above about 40 °C with central nervous system dysfunction and is an emergency; hypothermia is a core temperature below about 35 °C. Children lose heat faster because of a larger surface-area-to-mass ratio.',
t2:Q('A person produces 100 W of heat at rest. How much energy is produced in 1 hour?',['6 kJ','360 kJ','100 kJ','3600 kJ'],1,'100 W is 100 J/s; 100 × 3600 s = 360 000 J = 360 kJ.'),
t3:Q('A runner on a hot, humid day becomes confused and stops sweating. The most important explanation is…',['heat production exceeds heat loss because evaporation is limited, so core temperature rises','sweat glands are designed to run out','the body cools too much','radiation gains heat only in cold air'],0,'Humid air limits evaporation, so heat accumulates. Confusion is a danger sign of heat illness. This is a mechanism question only.')},
{id:'optics',sub:'phys',t:'Optics & vision',pre:['waves'],
learn:`<p><b>Refraction</b> is the bending of light when it passes between materials of different optical density (air to glass, air to cornea). A <b>converging (convex) lens</b> brings parallel rays to a focus at the <b>focal length</b> f; its power is P = 1/f in dioptres (f in metres). A <b>diverging (concave) lens</b> spreads rays.</p><p>In the eye the cornea does most of the focusing and the <b>lens</b> fine-tunes it by changing shape (accommodation) so the image lands on the retina. In <b>myopia</b> (short-sightedness) the image forms in front of the retina: distant objects blur, and a diverging lens corrects it. In <b>hyperopia</b> (long-sightedness) the image forms behind the retina and a converging lens corrects it. <b>Presbyopia</b> is the loss of accommodation with age.</p>`,
recall:[{q:'What is refraction?',a:'The bending of light as it passes between materials of different optical density.'},{q:'Which lens corrects myopia?',a:'A diverging (concave) lens.'},{q:'How is lens power calculated?',a:'P = 1/f with f in metres, giving dioptres.'}],
apply:[{q:'A lens has focal length 0.5 m. Its power is…',o:['0.5 D','2 D','5 D','0.2 D'],c:1,why:'P = 1/0.5 = 2 dioptres.'},{q:'In hyperopia the image forms…',o:['behind the retina','in front of the retina','on the retina','in the lens'],c:0,why:'The eye focuses too weakly for its length.'}],
explain:{q:'Explain how the eye focuses light and how glasses correct errors.',pts:['Refraction and focal length; P = 1/f','Cornea and lens focus light on the retina','Myopia: image in front, diverging lens','Hyperopia: image behind, converging lens; presbyopia with age']},
bq:'Why do people usually need reading glasses in their 40s and 50s?',
dp:'The relaxed eye has a total power of about 60 dioptres: roughly 40 from the cornea and 20 from the lens. Astigmatism occurs when the cornea is not spherical, so light focuses at different points in different directions; cylindrical lenses correct it. Cataract is clouding of the lens. Glaucoma damages the optic nerve, often with raised intraocular pressure. Laser refractive surgery reshapes the cornea to change its power.',
t2:Q('A person cannot see clearly beyond 0.5 m. Which lens power corrects distance vision?',['−2 D','+2 D','−0.5 D','+0.5 D'],0,'A diverging lens with f = −0.5 m has power 1/f = −2 D.'),
t3:Q('A child cannot see the board but reads a book easily. The most likely error and correction are…',['myopia, corrected with a diverging lens','hyperopia, corrected with a converging lens','presbyopia, corrected with a diverging lens','astigmatism, corrected with a flat mirror'],0,'Distant vision is blurred but near vision is good: the image forms in front of the retina, and a diverging lens corrects it.')},
{id:'imaging',sub:'phys',t:'Radiation & medical imaging',pre:['waves','atoms'],
learn:`<p><b>Ionising radiation</b> (X-rays, gamma rays, alpha and beta particles) has enough energy to remove electrons from atoms, which can damage DNA. <b>Non-ionising</b> radiation (visible light, radio waves, ultrasound, the fields of MRI) does not. Dose is measured in <b>sieverts (Sv)</b>; medical doses are in millisieverts (mSv). Natural background is about 2 to 3 mSv a year.</p><p>Imaging methods: <b>X-ray</b> (absorption: dense bone looks white), <b>CT</b> (many X-rays, 3D slices, higher dose), <b>ultrasound</b> (echoes; no ionising radiation), <b>MRI</b> (strong magnet and radio waves excite hydrogen nuclei; no ionising radiation; excellent soft-tissue detail) and <b>nuclear medicine and PET</b> (radiotracers such as technetium-99m or fluorine-18). <b>ALARA</b> (as low as reasonably achievable) and <b>justification</b> (benefit must exceed risk) guide use. Protection uses <b>time, distance and shielding</b>.</p>`,
recall:[{q:'What makes radiation ionising?',a:'It has enough energy to remove electrons from atoms.'},{q:'Which imaging methods do not use ionising radiation?',a:'Ultrasound and MRI.'},{q:'Name the three protection principles.',a:'Time, distance and shielding.'}],
apply:[{q:'Which technique usually gives the highest radiation dose?',o:['Chest X-ray','CT of the abdomen','Ultrasound','MRI'],c:1,why:'CT uses many X-ray exposures, so the dose is higher.'},{q:'Why does bone look white on an X-ray?',o:['It absorbs more X-rays','It emits X-rays','It reflects X-rays','It is transparent'],c:0,why:'Dense tissue absorbs more X-rays, leaving the film or detector less exposed.'}],
explain:{q:'Explain ionising radiation and the main imaging methods.',pts:['Ionising versus non-ionising radiation','X-ray, CT, ultrasound, MRI, nuclear medicine','Dose in sieverts; ALARA and justification','Time, distance, shielding']},
bq:'Why are MRI or ultrasound often preferred to CT in children and pregnancy when they can answer the question?',
dp:'Intensity from a point source falls with the square of the distance: doubling the distance gives a quarter of the dose. A chest X-ray is roughly 0.1 mSv and an abdominal CT roughly 8 to 10 mSv. CT measures X-ray attenuation in Hounsfield units. MRI is unsafe near some ferromagnetic implants and devices, and contrast agents (gadolinium for MRI, iodinated for CT) carry their own risks. PET shows metabolism by tracking a glucose analogue (FDG).',
t2:Q('A source gives 40 µSv/h at 1 m. What is the approximate dose rate at 2 m?',['10 µSv/h','20 µSv/h','80 µSv/h','160 µSv/h'],0,'Inverse square law: doubling the distance gives one quarter.'),
t3:Q('A pregnant patient needs abdominal imaging and an ultrasound can answer the question. The best reasoning is…',['ultrasound avoids ionising radiation, so it is preferred when it is adequate','CT is always better because it is faster','MRI uses X-rays so it should be avoided','imaging should never be used in pregnancy'],0,'Justification and ALARA favour a modality without ionising radiation when it can answer the question. Urgent clinical need can still justify other tests.')}];

gas:{chain:['Oxygen must diffuse across the thin alveolar wall','Fick law: the rate falls as the diffusion distance rises','Fluid in the alveoli thickens the barrier and reduces usable surface','Less oxygen crosses into the blood each second','The patient is breathless and blood oxygen falls'],tie:'The distance slider showed it: increase the thickness and the diffusion rate falls. Fluid in the lungs does exactly that.',a:'Fluid in the alveoli lengthens the diffusion path and reduces usable surface, so less oxygen crosses per second (Fick law). Blood oxygen falls and the patient is breathless.'},
heat:{chain:['Wet skin and clothes conduct heat away faster than dry air','Wind removes the warm layer of air next to the skin (convection)','Evaporation of water takes heat from the body','Heat loss exceeds heat production','The core temperature can fall: hypothermia risk'],tie:'The heat-balance bars showed it: when loss capacity beats production, the body cools.',a:'Wetness increases conduction and evaporative cooling and wind increases convection, so heat loss rises and can exceed heat production, risking hypothermia.'},
optics:{chain:['Near objects need the eye lens to become more curved','The lens is flexible when young','With age it stiffens and loses accommodation','Near objects can no longer be focused on the retina','A converging lens adds the missing focusing power'],tie:'You changed the eye length and lens power: when the lens cannot add power, the image falls behind the retina.',a:'The lens stiffens with age (presbyopia), so it cannot become more curved for near focus. Reading glasses add converging power to compensate.'},
imaging:{chain:['Ionising radiation can damage DNA','Children and growing tissues are more sensitive','The cancer risk from one dose is small but adds up over a lifetime','MRI and ultrasound avoid ionising radiation','So they are chosen when they can answer the clinical question'],tie:'The ionising line on the spectrum is the DNA-damage line. Moving to MRI or ultrasound avoids crossing it.',a:'Ionising radiation can damage DNA, and children have more life ahead and more dividing cells, so avoiding it when another test can answer the question lowers lifetime risk. Ultrasound and MRI do not use ionising radiation.'}});

const W3B=[
{id:'infect',sub:'prof',t:'Infection prevention & control',pre:['cells'],
learn:`<p>Infections spread when a microbe leaves a <b>source</b>, travels by a <b>route</b> and enters a <b>susceptible host</b> (the chain of infection). Breaking any link prevents spread. <b>Standard precautions</b> apply to every patient: <b>hand hygiene</b> at the five moments (before touching a patient, before a clean or aseptic procedure, after body-fluid exposure, after touching a patient, after touching their surroundings), appropriate <b>PPE</b>, safe handling of <b>sharps</b>, cleaning, and respiratory etiquette.</p><p><b>Transmission-based precautions</b> are added for known or suspected infections: <b>contact</b> (gloves and gown), <b>droplet</b> (surgical mask) and <b>airborne</b> (fit-tested respirator and a suitable room). Alcohol hand rub is effective in most situations; wash with soap and water when hands are visibly soiled and for spore-forming organisms such as <i>Clostridioides difficile</i>. Follow local policy.</p>`,
recall:[{q:'What are the links of the chain of infection?',a:'Source, route of transmission and a susceptible host.'},{q:'When must hands be washed with soap and water rather than rubbed with alcohol?',a:'When visibly soiled, and for C. difficile and other spore-forming organisms (and per local policy).'},{q:'Name the three transmission-based precaution types.',a:'Contact, droplet and airborne.'}],
apply:[{q:'Which is one of the five moments for hand hygiene?',o:['Before touching a patient','Only after leaving the ward','Only at the start of a shift','Only after using the toilet'],c:0,why:'Cleaning hands before touching a patient protects the patient.'},{q:'A patient has suspected tuberculosis (airborne spread). Which precaution is needed?',o:['Fit-tested respirator and an appropriate room','A plastic apron only','No precautions','Gloves only'],c:0,why:'Airborne spread needs airborne precautions.'}],
explain:{q:'Explain how infections spread and how to prevent spread.',pts:['Chain of infection: source, route, host','Standard precautions apply to every patient','Hand hygiene at the five moments','Add contact, droplet or airborne precautions as needed']},
bq:'Why is hand hygiene considered the single most important infection control measure?',
dp:'Healthcare-associated infections include catheter-related urinary infection, central line bloodstream infection, surgical site infection and ventilator-associated pneumonia; bundles of simple steps reduce them. Antimicrobial resistance (MRSA, resistant gram-negative bacteria) is driven by antibiotic overuse, and stewardship aims for the right drug, dose and duration. Sharps injuries carry a risk of blood-borne viruses (hepatitis B, hepatitis C, HIV); hepatitis B vaccination protects staff. The order of donning and removing PPE matters, to avoid contaminating yourself.',
t2:Q('A needlestick injury occurs. Besides following local policy, the most appropriate immediate action is to…',['wash the wound with soap and water, then report and seek assessment','ignore it if there is no bleeding','squeeze hard and suck the wound','cover it and continue working'],0,'Wash well, report promptly and get a risk assessment, which may include post-exposure prophylaxis.'),
t3:Q('A ward has several cases of the same drug-resistant infection. Which approach best breaks transmission?',['Hand hygiene, contact precautions, cleaning and antibiotic stewardship','Moving patients between beds without precautions','Giving everyone broad-spectrum antibiotics','Banning all visitors forever'],0,'Combined measures break the chain and reduce pressure for further resistance.')},
{id:'hand',sub:'prof',t:'Patient identification & handover',pre:['comm'],
learn:`<p>Wrong-patient errors are preventable. Use at least <b>two identifiers</b> (for example full name and date of birth) and check them against the wristband and record before any treatment, test, specimen or blood product. Ask the patient to <b>state</b> their name instead of asking 'Are you Mr Smith?'. Never use a room or bed number as an identifier.</p><p>At <b>handover</b> information is easily lost. Use a structured format such as <b>SBAR</b>: <b>Situation</b> (who and what is happening now), <b>Background</b> (relevant history), <b>Assessment</b> (what you think is wrong and how unwell the patient is), <b>Recommendation</b> (what you need or suggest). Speak clearly, use <b>read-back</b> for orders, and say what is still to be done and by when.</p>`,
recall:[{q:'How many patient identifiers should be checked, at minimum?',a:'At least two, such as full name and date of birth.'},{q:'What does SBAR stand for?',a:'Situation, Background, Assessment, Recommendation.'},{q:'Why ask the patient to state their name?',a:'A patient may say yes to a wrong name, so asking them to state it is a more reliable check.'}],
apply:[{q:'Which is not a safe patient identifier?',o:['Bed number','Date of birth','Full name','Hospital number'],c:0,why:'Patients move, so location is not a reliable identifier.'},{q:'In SBAR, "Please review him within 30 minutes" is the…',o:['Recommendation','Situation','Background','Assessment'],c:0,why:'It states what is needed and when.'}],
explain:{q:'Explain safe patient identification and structured handover.',pts:['Use at least two identifiers and check them','Ask the patient to state their name','SBAR structures handover','Read back orders and state outstanding tasks']},
bq:'Why is the handover between shifts a high-risk moment for patients?',
dp:'Wrong-patient and wrong-site events often involve failed identification or communication. The WHO surgical safety checklist has a sign-in, time-out and sign-out. In emergencies use closed-loop communication: the sender gives an instruction, the receiver repeats it, and the sender confirms. Handover works best face to face, with minimal interruption, and should include escalation plans and resuscitation status. Look-alike names and alert fatigue are further risks.',
t2:Q('You are about to take blood. The wristband says "Thandi Mokoena, DOB 12/03/1990" but the form says "DOB 12/03/1991". What should you do?',['Stop and resolve the discrepancy before taking blood','Take the blood and fix the form later','Ask for the first name only','Use the bed number instead'],0,'A mismatch is a safety signal: stop and resolve it before proceeding.'),
t3:Q('A nurse says: "Mr Dube, 68, chest pain for 30 minutes, ECG done, I think he is getting worse, please come now." Which SBAR parts are covered?',['Situation, Background, Assessment and Recommendation','Situation only','Background only','None'],0,'Situation (chest pain), background (age, ECG done), assessment (getting worse), recommendation (come now).')},
{id:'deter',sub:'prof',t:'Recognising deterioration & escalation',pre:['homeo','role'],
learn:`<p>Patients often show warning signs hours before a cardiac arrest or intensive care admission. Track <b>vital signs</b>: respiratory rate, oxygen saturation, blood pressure, heart rate, temperature and level of consciousness (for example AVPU: Alert, Voice, Pain, Unresponsive). Early warning scores such as NEWS2 add points for abnormal values, and a rising score triggers a response. A raised respiratory rate (above about 20 per minute) is one of the earliest and most sensitive signs.</p><p>Use the structured <b>ABCDE</b> approach: <b>A</b>irway, <b>B</b>reathing, <b>C</b>irculation, <b>D</b>isability, <b>E</b>xposure. Treat problems as you find them and <b>call for help early</b> using SBAR and your local escalation policy. Escalate if you are worried even when the numbers look normal: clinical concern is itself a trigger.</p>`,
recall:[{q:'Which vital sign is often the earliest sign of deterioration?',a:'Respiratory rate.'},{q:'What does ABCDE stand for?',a:'Airway, Breathing, Circulation, Disability, Exposure.'},{q:'What does AVPU assess?',a:'Level of consciousness: Alert, Voice, Pain, Unresponsive.'}],
apply:[{q:'A ward patient has a respiratory rate of 28, a heart rate of 120 and is drowsy. The best action is to…',o:['escalate urgently using local policy and SBAR','wait an hour and re-check','document and leave','give a drink'],c:0,why:'Several abnormal signs together need an urgent response.'},{q:'In the ABCDE approach, which comes first?',o:['Airway','Circulation','Exposure','Disability'],c:0,why:'A blocked airway is the most immediately life-threatening problem.'}],
explain:{q:'Explain how to recognise and respond to a deteriorating patient.',pts:['Track respiratory rate, saturation, blood pressure, pulse, temperature, consciousness','Early warning scores trigger escalation','ABCDE: treat problems as you find them','Call for help early; concern alone is a trigger']},
bq:'Why is a rising respiratory rate such an important early warning sign?',
dp:'NEWS2 scores respiratory rate, oxygen saturation, supplemental oxygen, systolic blood pressure, pulse, consciousness and temperature; higher scores mean a more urgent response. Sepsis is life-threatening organ dysfunction caused by infection, and early recognition and treatment are time-critical. Shock index (heart rate ÷ systolic blood pressure) above about 0.9 suggests significant volume loss. Escalation tools include rapid response teams and the phrase "I am concerned" to speak up.',
t2:Q('Heart rate is 120 and systolic BP is 100. What is the shock index, and what does it suggest?',['1.2; possible significant volume loss or shock','0.8; normal','12; very low','0.1; normal'],0,'120 ÷ 100 = 1.2, above about 0.9, which suggests possible shock.'),
t3:Q('A patient looks "off" to an experienced nurse, but all observations are in the normal range. What should the nurse do?',['Escalate on clinical concern and monitor more closely','Ignore it because the numbers are normal','Wait until the score rises','Discharge the patient'],0,'Clinical concern is a legitimate trigger. Scores support judgement; they do not replace it.')},
{id:'docs',sub:'prof',t:'Documentation & record integrity',pre:['consent'],
learn:`<p>The record is a legal and clinical document: if it is not written, it may be treated as not done. Good records are <b>accurate</b>, <b>timely</b> (written as soon as possible after the event), <b>objective</b> (facts, not opinions or insults), <b>legible</b> and <b>attributable</b> (dated, timed and signed with your name and role). Record what you found, what you did, what you told the patient, consent, and the plan with who is responsible.</p><p>Never alter or delete an entry. To correct one, <b>strike through with a single line</b> (or use the system amendment function), then date, time and sign. Do not document an action before it is done. Protect confidentiality: open records only for patients in your care, and log out of systems. Use only approved abbreviations.</p>`,
recall:[{q:'What are the features of a good record?',a:'Accurate, timely, objective, legible and attributable (dated, timed, signed).'},{q:'How should you correct a written error?',a:'Cross it out with a single line, then date, time and sign; never obliterate it.'},{q:'Why should you not look up records of patients not in your care?',a:'It breaches confidentiality; access should be only for care or an authorised purpose.'}],
apply:[{q:'Which entry is objective?',o:['"Patient rude and difficult"','"Patient shouted and refused the dressing; risks explained; patient still declined"','"Patient seems to be a liar"','"Typical drunk"'],c:1,why:'It describes what was seen and said without judgement.'},{q:'You made a mistake in a paper entry. You should…',o:['strike through with one line, then sign, date and time','use correction fluid','tear out the page','scribble over it'],c:0,why:'The original must stay readable.'}],
explain:{q:'Explain what makes a good medical record.',pts:['Accurate, timely, objective, legible, attributable','Record findings, actions, advice, consent, plan','Correct with a single line, date, time, sign','Protect confidentiality of records']},
bq:'Why must the record show what you told the patient about a risk?',
dp:'Electronic records keep an audit trail of who viewed or edited each entry, and inappropriate access can be detected and is a disciplinary matter. Records should include times of events, vital signs, medicines given and communication with relatives (within consent rules). Copy-and-paste can spread errors. Retention periods and patient rights to access records are set by law and vary by country. Never document on behalf of another person.',
t2:Q('You find that an entry you wrote last week had a wrong date. The best action is to…',['add a dated, timed, signed correction that keeps the original visible','delete the entry','leave it and say nothing','ask a colleague to change it quietly'],0,'Corrections must be transparent and traceable.'),
t3:Q('A nurse writes "gave 5 mg" before giving the drug, to save time. Why is this unsafe?',['Documenting before doing can mislead others and record something that never happened','It saves time so it is fine','It makes the notes longer','It only matters for doctors'],0,'The record must reflect what actually happened. Pre-charting risks duplicated or omitted doses.')},
{id:'safety',sub:'prof',t:'Safety culture: errors & teamwork',pre:['role','docs'],
learn:`<p>Errors in healthcare usually come from <b>system</b> weaknesses, not just individual carelessness. The <b>Swiss cheese model</b>: harm occurs when holes in several layers of defence line up. A <b>near miss</b> is an error caught before it reaches the patient; reporting near misses lets teams fix the system. A <b>just culture</b> separates honest mistakes (support and learn) from reckless behaviour (accountability).</p><p>When harm occurs: look after the patient first, tell the patient and family honestly and promptly (<b>duty of candour</b>), report it through the incident system, and take part in learning. Good teams <b>speak up</b>: use clear escalation language (for example CUS: I am <b>C</b>oncerned, <b>U</b>ncomfortable, this is a <b>S</b>afety issue), use closed-loop communication, and welcome challenge whatever the rank. Fatigue, interruptions and heavy workload raise error risk.</p>`,
recall:[{q:'What does the Swiss cheese model say?',a:'Harm happens when holes in several layers of defence line up.'},{q:'What is a near miss?',a:'An error that was caught before it reached the patient.'},{q:'What is duty of candour?',a:'The duty to tell patients honestly when something has gone wrong.'}],
apply:[{q:'Why report near misses?',o:['They reveal weaknesses before a patient is harmed','They prove who to blame','They do not matter','They always mean negligence'],c:0,why:'They show where the defences are weak.'},{q:'A junior doctor spots a possible wrong dose prescribed by a senior. The best action is to…',o:['speak up with clear language and check before giving the drug','give it because the senior is more experienced','say nothing','change the prescription yourself'],c:0,why:'Anyone can spot an error, and checking protects the patient.'}],
explain:{q:'Explain how errors happen and how teams make care safer.',pts:['Most errors are system failures; Swiss cheese model','Report near misses; just culture','Be honest with patients (candour)','Speak up with clear language']},
bq:'Why is a culture where junior staff feel able to challenge seniors safer for patients?',
dp:'Human factors: slips (attention failures), lapses (memory failures) and mistakes (a wrong plan). Checklists, forcing functions and decision support reduce errors. After an incident, root cause analysis looks for contributing system factors rather than one culprit. Clinicians involved in serious events can themselves be affected (the second-victim effect) and need support. Candour and reporting requirements differ by jurisdiction and employer.',
t2:Q('Two medicines have almost identical packaging and a staff member nearly takes the wrong one but notices in time. This is a…',['near miss that should be reported','crime that need not be recorded','success that needs no action','patient complaint only'],0,'It is a near miss: report it so the labelling or storage can be fixed.'),
t3:Q('A serious error harmed a patient. Which response best reflects professional duty?',['Care for the patient, disclose honestly, report, and take part in learning','Hide it to protect the team','Blame the most junior person','Change the notes'],0,'Professional duty includes patient care, honesty, reporting and learning.')},
{id:'bound',sub:'prof',t:'Professional boundaries & cultural humility',pre:['consent','role'],
learn:`<p><b>Professional boundaries</b> keep the relationship focused on the patient's needs. Avoid personal or financial relationships with patients, romantic or sexual relationships with current patients, accepting significant gifts, treating family or friends except in emergencies, and sharing personal contact details. Be careful on <b>social media</b>: never post identifiable patient information, and remember posts reflect on the profession. Declare <b>conflicts of interest</b> (financial, personal or institutional) that could influence your judgement.</p><p><b>Cultural humility</b> means approaching each person as an individual: ask about their beliefs and preferences rather than assuming, examine your own biases, and respect differences in language, religion, gender and background. Offer interpreters, accommodate beliefs about care where safe, and treat everyone without discrimination.</p>`,
recall:[{q:'Why should clinicians avoid treating close family members?',a:'Objectivity and judgement can be compromised, and proper records and consent are harder (except in emergencies).'},{q:'What should you never post on social media?',a:'Information that could identify a patient.'},{q:'What does cultural humility involve?',a:'Asking about individual beliefs and preferences, examining your own biases, and respecting differences without assuming.'}],
apply:[{q:'A patient offers you a very expensive gift after treatment. The best response is to…',o:['politely decline and follow the gift policy','accept and keep it quiet','ask for more','sell it'],c:0,why:'Significant gifts can compromise or appear to compromise judgement.'},{q:'Which statement shows cultural humility?',o:['"What matters most to you in your care?"','"People like you always..."','"I know what your culture wants"','"That belief is silly"'],c:0,why:'It asks the individual instead of assuming.'}],
explain:{q:'Explain professional boundaries and cultural humility.',pts:['Boundaries keep care patient-focused','No inappropriate relationships, gifts or posts','Declare conflicts of interest','Cultural humility: ask, do not assume']},
bq:'Why is a qualified interpreter better than a relative for a medical consultation?',
dp:'Boundary violations often start small (extra contact, favours) and escalate; regulators treat sexual relationships with current patients as serious misconduct. Implicit bias can affect diagnosis and treatment decisions and contributes to health inequalities. Industry gifts and sponsorship can influence prescribing, so many institutions restrict them. Chaperones protect patients and clinicians during intimate examinations. Disclosing conflicts, and stepping back from decisions in which you have an interest, is expected.',
t2:Q('A friend asks you to prescribe a controlled medicine for them. The professional response is to…',['decline politely and advise them to see their own doctor','prescribe it as a favour','prescribe it only once','share pills from a patient'],0,'Treating friends and family can compromise objectivity and proper care.'),
t3:Q('A patient declines a recommended treatment for reasons linked to their beliefs. Which approach reflects cultural humility and professionalism?',['Explore their reasons, explain the options, respect an informed decision by a person with capacity, and document','Tell them their belief is wrong','Ask a relative to decide','Ignore the refusal'],0,'Respectful exploration and respect for an informed refusal by a person with capacity are expected.')}];

deter:{chain:['Many illnesses (sepsis, heart failure, pneumonia, bleeding) disturb oxygen delivery or acid-base balance','The body breathes faster to compensate','Breathing rate rises before blood pressure falls','It can be measured at the bedside','Acting on it early prevents deeper deterioration'],tie:'This is the homeostasis loop: the sensors push breathing up to correct the disturbance before the system fails.',a:'Respiratory rate rises early as compensation for low oxygen, acidosis, pain or sepsis, often before blood pressure falls, so it signals a problem while there is still time to act.'},
