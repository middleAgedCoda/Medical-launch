const W9=[
{id:'biliary',sub:'patho',t:'Gallstones, cholecystitis & pancreatitis',pre:['ibd','liver'],src:'Gastrointestinal 10, 11',
learn:`<p>Bile (made by the liver, stored and concentrated in the <b>gallbladder</b>) emulsifies fat. <b>Gallstones</b> form when bile is supersaturated with cholesterol (most stones) or bilirubin (pigment stones), or when the gallbladder empties poorly; risk factors are female sex, age, obesity, rapid weight loss, pregnancy and haemolysis. Many stones stay silent. A stone that blocks the <b>cystic duct</b> causes <b>biliary colic</b> (steady right upper abdominal pain after fatty meals, lasting hours). If cystic-duct obstruction persists, the gallbladder can become inflamed (acute <b>cholecystitis</b>; secondary bacterial infection may occur but is not required in every case): constant pain, fever and tenderness. A stone in the <b>common bile duct</b> can obstruct bile flow and cause cholestatic liver-test changes, jaundice, dark urine or pale stools; presentation varies. Infection in an obstructed biliary system causes <b>cholangitis</b> (fever, jaundice and pain, though not always the full triad), which can progress to sepsis.</p><p>The pancreatic and bile ducts commonly meet near the ampulla (anatomy varies), so a stone can obstruct pancreatic outflow and trigger premature enzyme activation and inflammatory pathways within the pancreas, causing <b>acute pancreatitis</b>: severe epigastric pain radiating to the back, vomiting and a very high serum lipase or amylase. The commonest causes are <b>gallstones and alcohol</b>. Severe pancreatitis causes a systemic inflammatory response with fluid shifts, shock and organ failure. <b>Chronic pancreatitis</b> (often alcohol) destroys the gland, leading to <b>malabsorption</b> (fatty stools) and diabetes.</p>`,
recall:[{q:'What causes biliary colic?',a:'A gallstone temporarily blocking the cystic duct, causing pain after fatty meals.'},{q:'Name the two commonest causes of acute pancreatitis.',a:'Gallstones and alcohol.'},{q:'Why does a common bile duct stone cause pale stools and dark urine?',a:'Bile cannot reach the gut, and conjugated bilirubin regurgitates into the blood and is excreted in the urine.'}],
apply:[{q:'Fever, jaundice and right upper abdominal pain suggest…',o:['cholangitis','simple biliary colic','chronic pancreatitis','hepatitis A only'],c:0,why:'Infected, obstructed bile (cholangitis) classically gives fever, jaundice and right upper quadrant pain.'},{q:'Which enzyme is typically very high in acute pancreatitis?',o:['lipase','troponin','creatine kinase','prothrombin'],c:0,why:'Inflamed pancreatic cells leak lipase and amylase into the blood.'}],
explain:{q:'Explain how gallstones cause colic, jaundice and pancreatitis.',pts:['Gallstone formation and silent stones','Colic, cholecystitis, obstructive jaundice and cholangitis','Pancreatitis: enzyme activation and systemic response','Chronic pancreatitis: malabsorption and diabetes']},
bq:'Why can untreated cholangitis become life-threatening?',
pc:['Bile becomes supersaturated or empties poorly','A stone forms and obstructs a duct','Bile flow stops and pressure rises behind the stone','Stagnant, obstructed bile can become infected by gut bacteria','If infection occurs, cholangitis can cause fever, jaundice and sepsis','Drainage of the duct plus antibiotics is needed'],
dp:'Charcot triad (fever, jaundice, right upper quadrant pain) suggests cholangitis; adding hypotension and confusion (Reynolds pentad) marks severe disease. Ultrasound is the first test for gallstones; MRCP images the bile ducts non-invasively; ERCP is generally therapeutic in selected obstruction or cholangitis (it can remove stones and drain bile) rather than a routine diagnostic test. Acute pancreatitis is diagnosed when at least two of three are present: characteristic upper abdominal pain, lipase or amylase more than three times the upper limit of normal, and characteristic imaging findings. Severity of pancreatitis is judged by organ failure and local complications, not by the height of the lipase. Hypertriglyceridaemia and hypercalcaemia are other causes. Complications include necrosis, pseudocysts and infection. Steatorrhoea usually appears only after substantial pancreatic exocrine function is lost; the threshold varies and symptoms are influenced by diet and other factors.',
t2:Q('A raised alkaline phosphatase and conjugated bilirubin with pale stools suggests…',['cholestasis from bile duct obstruction','haemolysis','hepatocellular injury only','normal bile flow'],0,'Obstruction raises cholestatic markers and conjugated bilirubin, and bile does not reach the gut.'),
t3:Q('A man with severe epigastric pain radiating to the back and vomiting has a lipase five times the upper limit of normal. Which mechanism best explains this?',['Premature activation of pancreatic enzymes causing autodigestion and inflammation','Acid reflux','A fractured rib','A viral infection of the liver'],0,'Pancreatic enzymes are activated inside the gland and injure it. This is a mechanism question: severe abdominal pain needs medical assessment.')},
{id:'thyroid',sub:'patho',t:'Thyroid disease: hypothyroidism & hyperthyroidism',pre:['axis'],src:'Endocrine 1 to 6',
learn:`<p>The thyroid secretes mainly <b>T4</b> and smaller amounts of <b>T3</b>, under the control of TSH; T4 is converted in tissues to the more biologically active T3. Thyroid hormone sets the body's metabolic rate: it raises oxygen use, heat production, heart rate and contractility (it increases sensitivity to adrenaline) and speeds gut transit. Too little (<b>hypothyroidism</b>) slows everything: tiredness, cold intolerance, weight gain, constipation, slow pulse, dry skin, low mood and slow reflexes. Worldwide the main cause is iodine deficiency; where iodine is sufficient the commonest cause is <b>Hashimoto thyroiditis</b>, autoimmune destruction of the gland (also after surgery or radioiodine, or from some drugs). Too much (<b>hyperthyroidism</b>) speeds everything: weight loss despite appetite, heat intolerance, sweating, fast or irregular pulse (atrial fibrillation), tremor, anxiety and diarrhoea. The commonest cause is <b>Graves disease</b>, in which antibodies stimulate the TSH receptor, causing a diffuse goitre and sometimes eye disease; other causes are toxic nodules and thyroiditis.</p><p>For most patients with suspected primary thyroid dysfunction, TSH is a useful first test, interpreted with free T4 and the clinical context. Primary hypothyroidism usually gives <b>high TSH with low free T4</b>; overt primary hyperthyroidism usually gives <b>suppressed TSH with raised free T4 and/or T3</b>. <b>Central (secondary) hypothyroidism</b>, from pituitary or hypothalamic disease, gives a low or inappropriately normal TSH with a low free T4, and acute illness, pregnancy, some drugs and assay effects can also alter the pattern. A <b>goitre</b> is an enlarged thyroid (iodine deficiency, autoimmune disease, nodules or cancer) and needs assessment. Severe untreated disease is dangerous: myxoedema coma and thyroid storm are emergencies. Treatment replaces the hormone (levothyroxine) or reduces production (antithyroid drugs, radioiodine, surgery).</p>`,
recall:[{q:'What are the characteristic findings of hypothyroidism?',a:'Tiredness, cold intolerance, weight gain, constipation, slow pulse and dry skin.'},{q:'What is the commonest cause of hyperthyroidism?',a:'Graves disease: antibodies stimulate the TSH receptor.'},{q:'How does primary hypothyroidism show on blood tests?',a:'High TSH with low free T4.'}],
apply:[{q:'Weight loss with a fast pulse, tremor and heat intolerance suggests…',o:['hyperthyroidism','hypothyroidism','adrenal failure','anaemia'],c:0,why:'High thyroid hormone speeds metabolism and raises sensitivity to adrenaline.'},{q:'Why does hyperthyroidism cause a fast pulse?',o:['Thyroid hormone raises heart rate and sensitivity to adrenaline','It lowers blood volume only','It blocks the vagus nerve completely','It lowers metabolism'],c:0,why:'Thyroid hormone increases cardiac responsiveness and metabolic demand.'}],
explain:{q:'Explain how thyroid hormone excess or deficiency causes symptoms.',pts:['T4 and T3, control by TSH, metabolic effects','Hypothyroidism: causes and features','Hyperthyroidism and Graves disease','Interpretation of TSH and free T4; goitre']},
bq:'Why does an underactive thyroid cause weight gain and cold intolerance?',
pc:['Thyroid hormone production or action changes','Metabolic rate and heat production change','Cardiac output and gut transit change','Symptoms follow: cold or heat intolerance, weight and bowel change','TSH and free T4 show the pattern','Treatment replaces or reduces the hormone'],
dp:'Subclinical hypothyroidism is a raised TSH with normal free T4 and needs repeat testing and clinical context. Anti-TPO antibodies support Hashimoto disease. Thyroid eye disease can occur in Graves disease and can progress independently of thyroid function. Thyroid nodules are mostly benign; ultrasound and biopsy assess malignancy. Amiodarone and lithium can cause thyroid dysfunction. Uncontrolled overt thyroid disease during pregnancy can harm maternal and fetal outcomes; assessment and treatment depend on type, severity and pregnancy-specific guidance. Thyrotoxicosis is not always from increased synthesis (thyroiditis releases stored hormone), and non-thyroidal illness and assay interference can mimic thyroid disease. Iron and calcium reduce levothyroxine absorption.',
t2:Q('TSH is low and free T4 is high. The most likely explanation is…',['hyperthyroidism','primary hypothyroidism','a normal axis','pituitary failure'],0,'High thyroid hormone suppresses TSH by negative feedback.'),
t3:Q('A woman has tiredness, weight gain and cold intolerance, with a high TSH and anti-TPO antibodies. Which mechanism best explains this?',['Autoimmune destruction of the thyroid (Hashimoto disease) reducing hormone output','Antibodies stimulating the TSH receptor','A TSH-secreting tumour','Iodine excess only'],0,'Anti-TPO antibodies point to autoimmune thyroiditis, with falling hormone output and rising TSH.')},
{id:'adrenal',sub:'patho',t:'Adrenal disorders: Cushing, Addison & aldosterone',pre:['axis'],src:'Endocrine 4 to 6, 10',
learn:`<p>The adrenal cortex makes three families of steroids: <b>cortisol</b> (stress and metabolism, controlled by ACTH, with a daily rhythm that peaks in the morning), <b>aldosterone</b> (sodium retention and potassium loss, controlled mainly by the renin–angiotensin system and potassium) and <b>androgens</b>. The medulla makes adrenaline.</p><p><b>Cushing syndrome</b> is prolonged excess cortisol, most often from steroid medicines; endogenous causes are an ACTH-secreting pituitary tumour, an adrenal tumour or ectopic ACTH. Effects follow cortisol's actions: central weight gain, thin skin and bruising, striae, muscle weakness, high glucose, hypertension, bone loss, mood change and infection risk, and the normal daily rhythm is lost. <b>Adrenal insufficiency</b> is cortisol deficiency: <b>primary</b> (Addison disease, usually autoimmune; aldosterone is lost too, giving low sodium, high potassium and low blood pressure, with skin pigmentation from high ACTH) or <b>central or glucocorticoid-induced</b> (pituitary or hypothalamic disease, or suppression after prolonged glucocorticoid use; aldosterone is usually preserved). Features: fatigue, weight loss, low blood pressure, low glucose and nausea. In stress or illness it can progress to <b>adrenal crisis</b> (shock), a medical emergency.</p><p><b>Primary aldosteronism</b> (excess aldosterone, for example from an adrenal adenoma) causes renin-independent aldosterone excess and hypertension; potassium may be low but is often normal. Screening is considered in guideline-defined groups, including resistant hypertension and selected patients with early-onset hypertension or associated findings. <b>Phaeochromocytoma</b> is a rare catecholamine-secreting tumour causing episodes of headache, sweating, palpitations and hypertension.</p>`,
recall:[{q:'What are the three groups of adrenal cortical hormones?',a:'Cortisol, aldosterone and adrenal androgens.'},{q:'Why does primary adrenal failure cause low sodium and high potassium?',a:'Aldosterone is lost as well, so the kidney retains less sodium and excretes less potassium.'},{q:'Name the commonest cause of Cushing syndrome.',a:'Long-term glucocorticoid medicine.'}],
apply:[{q:'Hypertension with low potassium suggests…',o:['primary aldosteronism','primary adrenal failure','hypothyroidism','anaemia'],c:0,why:'Excess aldosterone retains sodium and wastes potassium.'},{q:'Skin pigmentation with low blood pressure and high potassium suggests…',o:['primary adrenal failure','Cushing syndrome','secondary adrenal failure','hyperthyroidism'],c:0,why:'Loss of cortisol and aldosterone, with high ACTH driving pigmentation.'}],
explain:{q:'Explain the main adrenal disorders and how their features follow from hormone actions.',pts:['Cortisol, aldosterone and androgens','Cushing syndrome: causes and features','Primary versus secondary adrenal insufficiency','Aldosteronism and phaeochromocytoma']},
bq:'Why does secondary adrenal insufficiency not cause the high potassium seen in Addison disease?',
pc:['Cortisol production falls (damage or suppression)','Feedback and ACTH levels change','In primary failure aldosterone is lost too','Sodium falls, potassium rises and blood pressure falls','Fatigue, low glucose, nausea and hypotension appear','Crisis can follow stress or illness without replacement'],
dp:'The dexamethasone suppression test and late-night salivary cortisol screen for Cushing syndrome, and, once endogenous hypercortisolism is confirmed, ACTH classifies it as ACTH-dependent or ACTH-independent; further testing separates pituitary from ectopic sources, and exogenous glucocorticoid exposure must be considered. The short synacthen test assesses adrenal reserve. Suspected adrenal crisis is a medical emergency: urgent emergency assessment and protocol-based treatment with parenteral hydrocortisone and fluids should not be delayed for confirmatory testing, and patients with a prescribed emergency plan follow it while seeking emergency care. The aldosterone-to-renin ratio screens for primary aldosteronism. Phaeochromocytoma is diagnosed with plasma or urinary metanephrines, and alpha blockade comes before beta blockade. Incidentally found adrenal masses need functional and malignancy assessment. Congenital adrenal hyperplasia (21-hydroxylase deficiency) causes cortisol deficiency with androgen excess. Screening tests for Cushing syndrome are followed by confirmatory testing, some antihypertensives alter the aldosterone-to-renin ratio, and stopping long-term glucocorticoids is planned by a clinician.',
t2:Q('Which finding best fits primary adrenal insufficiency (Addison disease)?',['Low sodium, high potassium and hypotension','High sodium and low potassium','Hypertension with low potassium','Normal electrolytes always'],0,'Loss of aldosterone as well as cortisol causes sodium loss and potassium retention.'),
t3:Q('A patient who took prednisolone for years stops it suddenly and develops weakness, nausea and low blood pressure. The best mechanism is…',['suppression of the hypothalamic–pituitary–adrenal axis by long-term steroids, so the adrenals cannot make enough cortisol when the medicine is stopped abruptly','a pituitary tumour','excess aldosterone','a thyroid storm'],0,'Long-term glucocorticoids suppress CRH and ACTH, so the adrenals become underactive, with recovery after stopping varying between people; the risk depends on dose, duration and individual factors, and abrupt withdrawal or severe illness can precipitate adrenal insufficiency. This is a mechanism question: such symptoms need urgent medical help, and long-term steroids are stopped under medical guidance with a planned taper.')},
{id:'haem',sub:'patho',t:'Haemolysis, sickle cell disease & marrow failure',pre:['anemia'],src:'Blood 1 to 7',
learn:`<p>Anaemia from <b>increased destruction</b> of red cells is <b>haemolysis</b>: red cells survive for much less than their normal 120 days. Clues: raised <b>reticulocytes</b> (the marrow compensates), raised unconjugated bilirubin (jaundice), raised LDH, low haptoglobin and sometimes dark urine. Causes are inherited (sickle cell disease, thalassaemia, G6PD deficiency, hereditary spherocytosis) or acquired (autoimmune haemolysis, mechanical valves, infection, drugs).</p><p><b>Sickle cell disease</b> is an inherited haemoglobin disorder: a single amino-acid substitution (glutamate to valine) in the beta chain makes <b>HbS</b>, which polymerises when deoxygenated and bends red cells into rigid sickles. Sickled cells break down (haemolytic anaemia) and block small vessels (<b>vaso-occlusion</b>), causing painful crises, acute chest syndrome, stroke and organ damage. Triggers: low oxygen, dehydration, infection and cold. Carriers (sickle trait) are usually well. <b>Thalassaemias</b> are reduced globin chain production, causing small, pale cells and anaemia of varying severity.</p><p>Anaemia from <b>marrow failure</b> (aplastic anaemia, infiltration, drugs) usually comes with low white cells and platelets: infection and bleeding appear along with tiredness. <b>Leukaemia</b> is malignant proliferation of white cell precursors that crowd the marrow: anaemia, infection (the cells do not work properly) and bleeding (low platelets), often with a very abnormal white count and blasts on the blood film. A low platelet count can cause petechiae and mucosal bleeding, especially when severe or combined with other haemostatic problems; risk depends on count, function, cause and context. Causes include marrow failure, immune destruction (ITP) and consumption.</p>`,
recall:[{q:'Name four laboratory clues of haemolysis.',a:'Raised reticulocytes, raised unconjugated bilirubin, raised LDH and low haptoglobin.'},{q:'What change in haemoglobin causes sickle cell disease?',a:'A beta-globin substitution (glutamate to valine) makes HbS, which polymerises when deoxygenated.'},{q:'Why does leukaemia cause infection, anaemia and bleeding together?',a:'Malignant cells crowd out normal marrow production of red cells, working white cells and platelets.'}],
apply:[{q:'A raised reticulocyte count in anaemia suggests…',o:['the marrow is responding, as in blood loss or haemolysis','marrow failure','iron overload','a normal marrow only'],c:0,why:'The marrow releases young red cells when it compensates.'},{q:'Which trigger can promote sickling?',o:['dehydration or low oxygen','extra hydration','high oxygen','a normal diet'],c:0,why:'Low oxygen and dehydration favour HbS polymerisation.'}],
explain:{q:'Explain haemolysis, sickle cell disease and marrow failure.',pts:['Haemolysis and its laboratory clues','Sickle cell disease: HbS, sickling, vaso-occlusion','Thalassaemia and marrow failure','Leukaemia and low platelets: infection and bleeding']},
bq:'Why do sickle cell patients get painful crises and strokes?',
pc:['HbS is present in red cells','Deoxygenation promotes HbS polymerisation; dehydration and infection or inflammation can increase the likelihood of vaso-occlusion and crisis','Red cells sickle and become rigid','Sickled cells haemolyse and block small vessels','Tissue ischaemia causes pain crises, chest syndrome and stroke','Preventive care and disease-modifying treatment can reduce complications; acute complications need prompt assessment and condition-specific management'],
dp:'Haemoglobin electrophoresis or HPLC diagnoses haemoglobinopathies. Repeated splenic infarction in sickle cell disease causes functional asplenia and a risk of overwhelming infection, so vaccines and prophylaxis are used. Hydroxycarbamide raises fetal haemoglobin and reduces crises. G6PD deficiency causes haemolysis after oxidant stress such as some drugs or fava beans. The direct antiglobulin (Coombs) test identifies autoimmune haemolysis. TTP is a haematological emergency, usually involving severe ADAMTS13 deficiency and platelet-rich microthrombi, thrombocytopenia and microangiopathic haemolysis; do not wait for the full classic pentad before urgent specialist assessment. Acute leukaemias present over days to weeks and need urgent assessment. Haemolysis can be intravascular (haemoglobinaemia, haemoglobinuria, low haptoglobin) or extravascular (mainly in the spleen); reticulocytes may be inappropriately low when marrow or nutrient problems coexist, and pancytopenia raises concern for aplastic anaemia or marrow infiltration.',
t2:Q('Which set of results best fits haemolysis?',['raised reticulocytes, raised unconjugated bilirubin and low haptoglobin','low reticulocytes and raised ferritin','normal bilirubin with microcytosis','raised platelets only'],0,'Increased destruction with marrow compensation produces this pattern.'),
t3:Q('A child with sickle cell disease has a fever. Why does this require urgent assessment?',['Sickle cell disease can impair splenic function, increasing the risk of rapidly serious infection','Sickling prevents fever','Fever cures sickling','Infection never occurs in this disease'],0,'Functional asplenia is common in many forms of sickle cell disease, and fever may signal serious infection, so the patient follows their urgent-care plan. This is a mechanism question: fever in sickle cell disease needs urgent care.')},
{id:'neuromusc',sub:'patho',t:'Weakness: nerve, junction, muscle & motor neuron',pre:['neurod'],src:'Neurology 6 to 11',
learn:`<p>Weakness is best understood by where along the pathway the fault lies. <b>Upper motor neuron (UMN)</b> lesions (brain or spinal cord) release the reflex arc from control: classically <b>weakness with increased tone (spasticity), brisk reflexes and an upgoing plantar response</b>, with little wasting; in the first hours or days after an acute cord or brain lesion, tone and reflexes can be reduced (spinal shock), and patterns vary by site and timing. <b>Lower motor neuron (LMN)</b> lesions (anterior horn cell, nerve root or peripheral nerve) interrupt the final path: <b>weakness with reduced tone, reduced or absent reflexes, wasting and fasciculations</b>. Isolated disease of the <b>neuromuscular junction</b> or <b>muscle</b> usually gives weakness without sensory loss (sensory findings suggest another or additional process): in <b>myasthenia gravis</b> antibodies block acetylcholine receptors, so weakness worsens with use (fatigable) and affects the eyes, face, swallowing and breathing; in myopathy there is proximal weakness (difficulty rising from a chair) with normal sensation.</p><p><b>Peripheral neuropathy</b> damages nerves, usually the longest first, giving a glove-and-stocking pattern of numbness, tingling, burning pain and weakness; common causes are diabetes, alcohol, B₁₂ deficiency, some drugs, and inherited or autoimmune disease. <b>Guillain–Barré syndrome</b> is an acute, usually post-infectious, autoimmune attack on peripheral nerves causing ascending weakness and loss of reflexes over days; it can paralyse the breathing muscles. <b>Motor neuron disease</b> destroys both upper and lower motor neurons, causing progressive weakness, wasting and fasciculation with brisk reflexes, without sensory loss. <b>Demyelination</b> slows conduction in peripheral nerves (as in Guillain–Barré) or central tracts (multiple sclerosis).</p>`,
recall:[{q:'How do UMN and LMN lesions differ in tone and reflexes?',a:'UMN: increased tone and brisk reflexes; LMN: reduced tone and reduced or absent reflexes.'},{q:'What happens in myasthenia gravis?',a:'Antibodies block acetylcholine receptors at the neuromuscular junction, causing fatigable weakness.'},{q:'What pattern does diabetic neuropathy typically follow?',a:'A glove-and-stocking pattern of sensory loss and pain, starting in the feet.'}],
apply:[{q:'Weakness, wasting, fasciculations and absent reflexes suggest…',o:['a lower motor neuron lesion','an upper motor neuron lesion','a myasthenic crisis only','normal ageing'],c:0,why:'Interrupting the final common path gives flaccid, wasted muscle with lost reflexes.'},{q:'Ascending weakness over days with absent reflexes after a recent infection suggests…',o:['Guillain–Barré syndrome','multiple sclerosis','myasthenia gravis','a stroke'],c:0,why:'A post-infectious autoimmune attack on peripheral nerves.'}],
explain:{q:'Explain how the site of the fault shapes the pattern of weakness.',pts:['Pathway thinking: UMN, LMN, junction, muscle','Neuropathy: causes and patterns','Guillain–Barré and respiratory risk','Motor neuron disease and myasthenia gravis']},
bq:'Why must breathing be monitored closely in Guillain–Barré syndrome and myasthenic crisis?',
pc:['A disorder affects a motor neuron, peripheral nerve, neuromuscular junction or muscle','Depending on the site, signalling, transmission or muscle contraction is impaired','Weakness appears with a characteristic tone and reflex pattern','Respiratory muscles may be involved','Breathing capacity falls and can fail','Respiratory support and treating the cause are needed'],
dp:'Nerve conduction studies separate demyelinating from axonal neuropathy; EMG shows denervation. Acetylcholine receptor antibodies are positive in many patients with generalised myasthenia gravis, but negative tests do not exclude it and MuSK or other antibodies may be relevant; thymoma is assessed according to the recommended diagnostic pathway. Myasthenic crisis can be triggered by infection or some drugs. Lambert–Eaton syndrome (often paraneoplastic) improves briefly with repeated use. Guillain–Barré is treated with immunoglobulin or plasma exchange, with attention to autonomic instability. Riluzole modestly prolongs survival in motor neuron disease. Spinal cord compression is an emergency, with a sensory level and sphincter disturbance. Red flags include breathing or swallowing difficulty and autonomic instability in Guillain–Barré; no single pattern is absolute.',
t2:Q('Which combination fits an upper motor neuron lesion?',['spasticity, brisk reflexes and an upgoing plantar response','flaccidity, absent reflexes and fasciculations','weakness with normal tone and reflexes only','sensory loss only'],0,'Loss of descending inhibition releases the reflex arc.'),
t3:Q('A patient has weakness that is worse at the end of the day, with drooping eyelids and double vision. Which mechanism best explains this?',['antibodies reducing functional acetylcholine receptors at the neuromuscular junction','demyelination of the spinal cord','loss of dopamine neurons','a lower motor neuron lesion in the leg'],0,'Fewer receptors mean transmission fails with repeated activity, producing fatigable weakness of the eyes and face.')},
{id:'tbi',sub:'patho',t:'Head injury, intracranial pressure & spinal cord injury',pre:['stroke','mening'],src:'Neurology 2 to 4, 10',
learn:`<p>The skull is rigid, so the brain, blood and CSF share a fixed volume (<b>Monro–Kellie doctrine</b>). A growing mass, bleed or swelling is first compensated by displacing CSF and venous blood, so pressure stays near normal (in a supine adult often quoted as roughly 5 to 15 mmHg, though interpretation depends on measurement method, posture and clinical context). When compensation is exhausted, a small extra volume causes a steep rise in <b>intracranial pressure (ICP)</b>. Cerebral perfusion pressure is <b>CPP = mean arterial pressure − ICP</b>, so rising ICP reduces blood flow to the brain; in severe adult TBI, guidelines commonly use a CPP target around 60 to 70 mmHg, individualised to the patient and monitoring; it is not a universal target for every brain injury. Very high pressure pushes brain tissue across the dural folds or through the foramen magnum (<b>herniation</b>), compressing the brainstem. Herniation may cause a new dilated or poorly reactive pupil, declining consciousness and, late, the Cushing response (hypertension, bradycardia and irregular breathing); these are emergency signs but are not always present and must not be awaited.</p><p><b>Traumatic brain injury</b> has a <b>primary</b> injury at impact (contusion, diffuse axonal injury, haematoma) and a <b>secondary</b> injury from hypoxia, hypotension, swelling, seizures and raised ICP, which treatment tries to prevent. Bleeding types: <b>extradural</b> (a torn meningeal artery, often after a skull fracture; lens-shaped; may follow a lucid interval), <b>subdural</b> (torn bridging veins; crescent-shaped; common in older people and alcohol users, can present late) and <b>subarachnoid</b> (blood in the CSF). <b>Spinal cord injury</b> can cause paralysis and loss of sensation below the level and, if high, breathing and autonomic failure; the cord can swell, and low blood pressure adds secondary injury, so early spinal protection and perfusion matter.</p>`,
recall:[{q:'State the Monro–Kellie doctrine.',a:'The skull is a fixed space shared by brain, blood and CSF, so an increase in one must be offset by a decrease in another.'},{q:'Write the equation for cerebral perfusion pressure.',a:'CPP = mean arterial pressure − intracranial pressure.'},{q:'What is the difference between primary and secondary brain injury?',a:'Primary injury occurs at impact; secondary injury follows from hypoxia, hypotension, swelling and raised ICP.'}],
apply:[{q:'MAP is 90 mmHg and ICP is 30 mmHg. The CPP is…',o:['60 mmHg','120 mmHg','30 mmHg','90 mmHg'],c:0,why:'CPP = MAP − ICP = 90 − 30.'},{q:'A lens-shaped bleed after a skull fracture with a lucid interval suggests…',o:['an extradural haematoma','a subdural haematoma','a subarachnoid haemorrhage','a stroke'],c:0,why:'An arterial tear under a fracture gives an extradural bleed.'}],
explain:{q:'Explain how raised intracranial pressure develops and damages the brain.',pts:['Monro–Kellie and compensation','CPP and herniation','Primary versus secondary injury; haematoma types','Spinal cord injury and perfusion']},
bq:'Why can a patient with a head injury look well and then deteriorate hours later?',
pc:['Head injury causes bleeding or swelling inside the skull','Compensation displaces CSF and venous blood','Compensation is exhausted and ICP rises steeply','Cerebral perfusion pressure falls','Brain tissue shifts and compresses the brainstem (herniation)','If raised ICP and reduced cerebral perfusion persist, secondary brain injury can become severe or irreversible; outcome depends on severity, duration and timely care'],
dp:'The Glasgow Coma Scale grades consciousness (eye, verbal and motor responses). Anticoagulants and age increase the risk of delayed bleeding after a head injury. Raised ICP requires urgent specialist and emergency management. In monitored settings, care may include optimising oxygenation and blood pressure, positioning, sedation, hyperosmolar therapy or surgery as indicated. Hyperventilation is reserved for selected short-term rescue situations because cerebral vasoconstriction can reduce blood flow; it is not routine prophylaxis. Neurogenic shock (hypotension with bradycardia) can follow high spinal cord injury, and the spine is protected until cleared. Chronic subdural haematomas can follow minor trauma in older people and present as confusion or headache weeks later. Assess the cervical spine, expect concussion, post-traumatic seizures and anticoagulant-related bleeding risk, and use serial neurological observations.',
t2:Q('If mean arterial pressure is 80 mmHg and ICP rises from 10 to 40 mmHg, what happens to cerebral perfusion pressure?',['It falls from 70 to 40 mmHg','It rises to 120 mmHg','It stays at 80 mmHg','It rises to 40 mmHg'],0,'CPP = MAP − ICP, so 80 − 10 = 70 falls to 80 − 40 = 40.'),
t3:Q('A man hit his head, was briefly unconscious, seemed well, then became drowsy with a dilated pupil. Which mechanism best explains the deterioration?',['an expanding intracranial haematoma or swelling exhausting compensation, raising ICP and causing herniation','simple tiredness','low blood sugar only','a viral illness'],0,'Compensation can hide an early rise, then ICP climbs steeply and compresses the brainstem. The pattern does not uniquely identify the bleed type. This is a mechanism question: such symptoms are an emergency.')}];
