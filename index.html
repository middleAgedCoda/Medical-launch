const DEEP={
atoms:{dp:'The atomic mass on the periodic table is a weighted average of isotope masses. Some isotopes are stable and others are radioactive. Unstable nuclei undergo alpha or beta decay, which changes the nucleus, often followed by gamma emission, which releases excess energy without changing the numbers of protons or neutrons. Technetium-99m has a half-life of about 6 hours: long enough to image, short enough to limit the radiation dose to the patient.',
 t2:Q('Technetium-99m has a half-life of about 6 hours. A 400 MBq dose is given. About how much activity remains after 24 hours?',['200 MBq','100 MBq','50 MBq','25 MBq'],3,'24 hours is 4 half-lives: 400, 200, 100, 50, 25 MBq.'),
 t3:Q('Radioactive iodine-131 is used to treat an overactive thyroid. Why does it selectively irradiate the thyroid?',['Iodine-131 is chemically different from normal iodine','The thyroid takes up iodine to make hormone, and I-131 behaves like ordinary iodine','The thyroid is the only organ near the neck','I-131 only emits radiation inside the thyroid'],1,'Same number of protons means the same chemistry. The thyroid actively takes up and concentrates iodide, so I-131 accumulates there far more than elsewhere (not exclusively: salivary glands and stomach also take up some), and its radiation damages the nearby tissue.')},
shells:{dp:'Shells simplify quantum energy levels. Ionisation energy falls down a group (outer electrons are farther away and more shielded) and rises across a period (nuclear charge rises while shielding does not fully offset it, so the effective pull on the same shell is stronger). That is why potassium is more reactive than sodium, and why Na and K both form 1+ ions so readily.',
 t2:Q('Potassium and sodium are in the same group. Which statement best explains why potassium loses its outer electron more easily?',['It has more protons, which push electrons away','Its outer electron is in a shell farther from the nucleus and more shielded','It has a full outer shell','It has fewer neutrons'],1,'A more distant, more shielded outer electron is held less tightly.'),
 t3:Q('Lithium is used to treat bipolar disorder and its ion can partly mimic sodium in the body. Which property makes this plausible?',['It forms a 1+ ion like sodium, having one outer electron','It has the same mass as sodium','It is a halogen','It has a full outer shell'],0,'Group 1 elements share one outer electron and form 1+ ions, so Li⁺ can enter cells through some Na⁺ pathways. This is only the first step: lithium acts on other targets too, so shell chemistry alone does not explain its therapeutic effect.')},
ions:{dp:'The Nernst equation gives an ion equilibrium potential: E = (61.5/z) × log₁₀([out]/[in]) mV at 37 °C, where z is the signed charge (+1 for K⁺) and the logarithm is base 10. For K⁺ (about 4 mM outside, 140 mM inside) E_K is about −95 mV (often quoted as about −90 mV). Resting neurons sit near −70 mV, closer to E_K than to the equilibrium potentials of other ions because the resting membrane is far more permeable to K⁺, though other ions and pumps also contribute.',
 t2:Q('Blood K⁺ rises from 4 to 8 mM while intracellular K⁺ stays at 140 mM. Using E = 61.5 × log([out]/[in]), what happens to the K⁺ equilibrium potential?',['It becomes more negative, about −110 mV','It becomes less negative, about −76 mV','It stays at about −95 mV','It becomes positive'],1,'log(8/140) = −1.24, so E = −76 mV, up from about −95 mV.'),
 t3:Q('A patient with severe hyperkalaemia (K⁺ 8 mmol/L) has peaked T waves and palpitations. Which explanation fits?',['Raised extracellular K⁺ depolarises cell membranes and disturbs cardiac electrical activity','Raised K⁺ makes the membrane more negative so cells fire more','K⁺ blocks all Na⁺ channels permanently','K⁺ raises blood pH'],0,'A higher outside K⁺ shifts the K⁺ equilibrium potential upward and depolarises cells. With sustained depolarisation, voltage-gated Na⁺ channels become inactivated, so conduction slows and dangerous arrhythmias can follow.')},
bonds:{dp:'Hydrogen bonds (roughly 5 to 30 kJ/mol, varying with environment) are far weaker than typical covalent bonds (often 150 to 450 kJ/mol) but hold together water, DNA base pairs and protein secondary structure. Being weak and numerous is what lets DNA unzip and proteins fold and change shape.',
 t2:Q('Why does water boil at a much higher temperature than hydrogen sulfide (H₂S)?',['Water molecules form hydrogen bonds with each other','Water has a higher molar mass','Water is ionic','H₂S has stronger covalent bonds'],0,'Boiling overcomes the attractions between molecules, not the O–H bonds inside them. Water hydrogen bonds need extra energy to overcome.'),
 t3:Q('Why do lipid-soluble anaesthetics cross the blood-brain barrier more easily than charged, water-soluble drugs?',['They dissolve in the nonpolar membrane interior, whereas charged molecules are held out','Charged molecules are too small','The brain has no membranes','Fat-soluble drugs are always larger'],0,'Nonpolar, non-ionised molecules partition into the lipid bilayer, while charged molecules are surrounded by water and cross poorly. Real brain entry also depends on size, transporters and efflux pumps, so lipid solubility is a major factor but not the only one.')},
moles:{dp:'Clinical units: 1 mmol/L of Na⁺ is 1 mEq/L, but for a divalent ion mEq = mmol × valence, so 1 mmol/L Ca²⁺ is 2 mEq/L. Osmolarity counts dissolved particles: 0.9% NaCl (154 mmol/L), if fully dissociated, gives a calculated 308 mOsm/L, close to plasma (about 285 to 295). Tonicity is different: it describes the effect on cell volume and depends on solutes that cannot freely cross the membrane. Normal saline is isotonic.',
 t2:Q('0.9% NaCl has 9 g NaCl per litre (molar mass 58.5 g/mol). About how many mmol of Na⁺ are in 500 mL?',['38 mmol','77 mmol','154 mmol','308 mmol'],1,'9 ÷ 58.5 = 0.154 mol/L, so 500 mL holds about 77 mmol.'),
 t3:Q('Educational calculation only: a hypothetical prescription is 40 mg of a medicine supplied as 10 mg/mL. What volume contains that dose, and why do units matter?',['4 mL; confusing mg with µg would be a 1000-fold error','0.25 mL; a unit error would be harmless','40 mL; units are irrelevant','4 mL; units are irrelevant'],0,'40 ÷ 10 = 4 mL. A unit mix-up changes the dose by a factor of 1000. Real administration also needs the prescription, patient, drug, route and safety checks.')},
ph:{dp:'The Henderson-Hasselbalch equation for blood: pH = 6.1 + log([HCO₃⁻] / (0.03 × PCO₂)), where 0.03 is the CO₂ solubility coefficient in mmol/L per mmHg. With HCO₃⁻ 24 mmol/L and PCO₂ 40 mmHg this gives 6.1 + log 20 = 7.40. The lungs adjust PCO₂ through ventilation; the kidneys adjust HCO₃⁻ and acid excretion. They work together, and compensation takes minutes for the lungs and days for the kidneys.',
 t2:Q('Blood has HCO₃⁻ 24 mmol/L and PCO₂ 80 mmHg (hypoventilation). Using pH = 6.1 + log(HCO₃⁻ / (0.03 × PCO₂)), the pH is closest to…',['7.40','7.10','7.70','6.10'],1,'0.03 × 80 = 2.4; 24 ÷ 2.4 = 10; log 10 = 1; pH = 7.1.'),
 t3:Q('A patient with severe vomiting loses stomach acid (HCl). What disturbance is expected and why?',['Metabolic alkalosis: H⁺ is lost, leaving bicarbonate relatively high','Metabolic acidosis: HCl is added to blood','Respiratory acidosis: CO₂ is retained','No change because buffers prevent it'],0,'Losing gastric HCl removes H⁺ and raises pH: metabolic alkalosis. Chloride and volume depletion help maintain it, so the full picture also depends on the patient.')},
cells:{dp:'Mitochondria have their own circular DNA and ribosomes and divide independently, supporting the endosymbiont theory that they descend from engulfed bacteria. Human mitochondrial DNA is generally inherited from the mother. Mitochondrial disorders can come from mutations in mitochondrial or nuclear DNA and often affect high-energy tissues such as muscle, brain and heart, though the features depend on the disorder.',
 t2:Q('A cell shows abundant rough ER and a large Golgi apparatus. Which cell is this most likely?',['A cell secreting large amounts of protein, such as a plasma cell','A red blood cell','A fat-storing cell','A cell making only steroid hormones'],0,'Rough ER and Golgi make, fold and ship proteins. Steroid-making cells have mostly smooth ER.'),
 t3:Q('A child has muscle weakness, poor exercise tolerance and raised resting blood lactate. A mitochondrial disorder is suspected. Why would this raise lactate?',['Cells shift to anaerobic glycolysis, which produces lactate','Mitochondria make lactate directly','Lactate is a vitamin','Mitochondria remove lactate by diffusion'],0,'Without working mitochondria, cells cannot fully oxidise pyruvate, so more of it is converted to lactate and blood lactate rises (lactate handling also varies between disorders).')},
membrane:{dp:'The Na⁺/K⁺-ATPase pumps 3 Na⁺ out and 2 K⁺ in per ATP, which gives a small direct push toward a negative inside (it is electrogenic). Its bigger job is maintaining the Na⁺ and K⁺ gradients that, with selective permeability, set the resting membrane potential. The Na⁺ gradient it builds drives secondary active transport, such as sodium-glucose co-transport in the gut and kidney.',
 t2:Q('A red blood cell is placed in 0.45% NaCl, which is hypotonic relative to the cell. What happens?',['It swells and may burst','It shrinks','Nothing happens','It divides'],0,'Water moves in by osmosis toward the higher solute concentration inside the cell.'),
 t3:Q('Digoxin inhibits the Na⁺/K⁺-ATPase in heart muscle. Which sequence explains the stronger contraction?',['Intracellular Na⁺ rises, so Na⁺/Ca²⁺ exchange removes less Ca²⁺ and intracellular Ca²⁺ rises','Intracellular K⁺ rises and directly causes contraction','The pump makes more ATP','Ca²⁺ channels close'],0,'A weaker Na⁺ gradient means less Ca²⁺ is pushed out, so more Ca²⁺ is available (and more is stored in the sarcoplasmic reticulum) for contraction. Digoxin has a narrow safety margin: this is a mechanism question, not dosing advice.')},
biomol:{dp:'Protein structure has four levels: primary (amino acid sequence), secondary (alpha helices and beta sheets held by hydrogen bonds), tertiary (3D fold from side-chain interactions) and quaternary (several chains, as in haemoglobin with four). In sickle cell disease, glutamate is replaced by valine at position 6 of the mature beta-globin chain, creating a sticky hydrophobic patch.',
 t2:Q('Haemoglobin is made of four polypeptide chains. Which level of structure is this?',['Primary','Secondary','Tertiary','Quaternary'],3,'Quaternary structure is the assembly of several chains.'),
 t3:Q('In sickle cell disease a polar glutamate is replaced by nonpolar valine in beta-globin. Why do red cells sickle when deoxygenated?',['The hydrophobic patch makes haemoglobin molecules stick together and polymerise','Valine breaks the iron atom','Valine makes haemoglobin ionic','DNA stops being copied'],0,'Deoxygenated HbS polymerises into fibres that distort the red cell.')},
enzymes:{dp:'Michaelis-Menten: v = Vmax [S] / (Km + [S]). Km is the substrate concentration giving half of Vmax and reflects affinity (low Km, high affinity). Competitive inhibitors raise the apparent Km without changing Vmax and are overcome by more substrate; pure non-competitive inhibitors lower Vmax without changing Km, and mixed inhibitors change both (real inhibitors are often mixed).',
 t2:Q('An enzyme has Vmax 100 µmol/min and Km 2 mM. At [S] = 2 mM the rate is…',['25','50','75','100'],1,'When [S] = Km the rate is half of Vmax.'),
 t3:Q('Methanol poisoning is treated with ethanol or fomepizole. Which principle explains this?',['Competition for alcohol dehydrogenase: ethanol competes with methanol as a substrate and fomepizole inhibits the enzyme, slowing production of toxic products','Ethanol denatures the enzyme','Ethanol raises Vmax','Ethanol changes blood pH'],0,'Ethanol competes with methanol for the enzyme and fomepizole inhibits it, so less formaldehyde and formate is made. This is a mechanism question only: methanol poisoning is a medical emergency.')},
atp:{dp:'Aerobic respiration yields about 30 to 32 ATP per glucose: 2 from glycolysis, about 2 ATP equivalents from the Krebs cycle (as GTP or ATP) and roughly 26 to 28 from oxidative phosphorylation (estimates, not fixed values), driven by the proton gradient across the inner mitochondrial membrane through ATP synthase. Cyanide inhibits cytochrome c oxidase (complex IV), preventing electron transfer to oxygen and severely impairing ATP production.',
 t2:Q('A cell switches from aerobic respiration to anaerobic glycolysis. To make the same ATP it must use glucose about…',['the same amount','2 times as fast','15 times as fast','100 times as fast'],2,'About 30 ATP per glucose versus about 2: roughly 15 times as much glucose.'),
 t3:Q('After cyanide exposure a patient has high blood oxygen but cells cannot use it. Why?',['Cyanide blocks cytochrome c oxidase, so mitochondria cannot use oxygen to make ATP','Cyanide removes oxygen from blood','Cyanide makes ATP','Cyanide destroys DNA'],0,'The electron transport chain stops, so oxygen is not consumed and ATP production collapses.')},
division:{dp:'The cell cycle is controlled by cyclins and cyclin-dependent kinases with checkpoints at G1/S, G2/M and the spindle. p53 halts the cycle when DNA is damaged. Non-disjunction in meiosis gives gametes with extra or missing chromosomes; most Down syndrome is full trisomy 21, usually from maternal meiotic non-disjunction, which becomes more likely with advancing maternal age; a minority is due to translocation or mosaicism.',
 t2:Q('A human body cell with 46 chromosomes has replicated its DNA and is at metaphase of mitosis. How many sister chromatids are present?',['23','46','92','184'],2,'After replication each of the 46 chromosomes has 2 chromatids: 92.'),
 t3:Q('A baby is born with trisomy 21. What error could produce this?',['Non-disjunction: chromosome 21 failed to separate during meiosis in a parent gamete','A point mutation in one gene','Failed DNA replication after birth','Fertilisation by two sperm'],0,'A gamete carrying two copies of chromosome 21 plus the normal one from the other parent gives three copies.')},
dna:{dp:'Chargaff rules: in double-stranded DNA A equals T and G equals C, so purines equal pyrimidines. DNA is wound around histone octamers into nucleosomes. The human genome is about 3 billion base pairs with roughly 20,000 protein-coding genes, and only about 1 to 2 percent of it codes for protein.',
 t2:Q('Double-stranded DNA is 30% adenine. What percentage is guanine?',['20%','30%','40%','70%'],0,'A = T = 30% makes 60%; the other 40% is split G = C = 20% each.'),
 t3:Q('Cisplatin chemotherapy cross-links guanine bases. Why does this kill dividing cancer cells?',['It distorts DNA with cross-links, interfering with replication and transcription and triggering cell death','It adds extra A–T pairs','It removes the nucleus','It makes DNA single-stranded permanently'],0,'Cisplatin forms DNA adducts and cross-links that distort DNA and interfere with replication and transcription. The damage can trigger apoptosis, especially in fast-dividing cells.')},
repl:{dp:'DNA polymerase builds only in the 5′ to 3′ direction, so the leading strand is made continuously and the lagging strand in Okazaki fragments joined by ligase. Telomeres shorten each division because the lagging strand cannot copy the very end; most cancers maintain telomeres by reactivating telomerase, and a minority use alternative lengthening of telomeres (ALT).',
 t2:Q('Which enzyme joins Okazaki fragments on the lagging strand?',['Helicase','DNA ligase','RNA polymerase','Topoisomerase'],1,'Ligase seals the gaps between fragments.'),
 t3:Q('Fluoroquinolone antibiotics inhibit bacterial DNA gyrase (a topoisomerase). Why does this stop bacterial growth?',['Replication cannot proceed because supercoiling ahead of the fork cannot be relieved','It stops protein folding','It dissolves the cell wall','It blocks ATP synthase'],0,'Topoisomerases relieve the tension created as the helix unwinds. Without them the fork stalls.')},
tscr:{dp:'Eukaryotic mRNA is processed: a 5′ cap, a 3′ poly-A tail and splicing, where introns are removed and exons joined. Alternative splicing lets one gene give several proteins. Promoters and transcription factors control when a gene is read, and enhancers can act from a distance.',
 t2:Q('A gene has 3 exons and 2 introns. What is present in the mature mRNA?',['3 exons and 2 introns','3 exons only','2 introns only','5 exons'],1,'Introns are spliced out; exons are joined.'),
 t3:Q('Some patients with beta-thalassaemia have a mutation creating an abnormal splice site in the beta-globin gene. Why does this reduce haemoglobin production?',['Abnormal splicing produces faulty or reduced mature mRNA, so less functional beta-globin is made','The mutation removes iron','It makes red cells divide faster','It adds extra haemoglobin genes'],0,'Wrong splicing changes or destroys the mRNA message.')},
tlat:{dp:'Translation has initiation (the small subunit finds AUG), elongation (A, P and E sites) and termination (release factors at a stop codon). The genetic code is degenerate (several codons per amino acid) and nearly universal. Secreted proteins are made on rough ER, guided by a signal peptide.',
 t2:Q('A coding sequence is 300 bases long, including one stop codon at its end. How many amino acids does the protein have?',['100','99','300','97'],1,'300 ÷ 3 = 100 codons, one of which is the stop, leaving 99.'),
 t3:Q('Erythromycin binds the bacterial 50S ribosomal subunit and blocks elongation. Why is it relatively safe for human cells?',['Human cytoplasmic ribosomes (60S and 40S) differ in structure, so the drug binds bacteria selectively','Humans have no ribosomes','It only acts on viruses','The liver destroys it'],0,'Selective toxicity depends on structural differences between bacterial and human ribosomes.')},
mut:{dp:'Insertions or deletions of multiples of three keep the reading frame (in-frame); others cause frameshifts. Triplet repeat expansion causes Huntington disease (CAG repeats). Sickle cell disease is a missense mutation, and the common cystic fibrosis variant F508del (p.Phe508del, formerly ΔF508) removes one phenylalanine from the CFTR protein; it is a three-base, in-frame deletion, so the reading frame is kept but protein folding is disrupted.',
 t2:Q('A coding region loses three consecutive bases. Compared with losing one base, the likely effect is…',['milder: one amino acid lost and the rest unchanged','more severe: a complete frameshift','no effect ever','exactly the same'],0,'Three bases is one codon, so the frame is preserved.'),
 t3:Q('Duchenne muscular dystrophy can be caused by a nonsense mutation in the dystrophin gene. Why is the protein usually absent?',['A premature stop codon produces a truncated, unstable protein','The mutation is silent','The protein becomes hyperactive','It only affects lipids'],0,'Translation ends early and the short protein is usually degraded.')},
inh:{dp:'Not all inheritance is simple Mendelian. X-linked recessive conditions (haemophilia, Duchenne) affect males more because they have one X. Codominance (ABO: A and B both expressed) and incomplete dominance occur. For a two-allele locus, Hardy-Weinberg gives p + q = 1 and genotype frequencies p², 2pq and q², assuming random mating and, ideally, a large population with no selection, mutation or migration.',
 t2:Q('In a population at Hardy-Weinberg equilibrium, an autosomal recessive condition affects about 1 in 2500 people (q² = 0.0004). What is the carrier frequency 2pq?',['1 in 2500','1 in 50','1 in 25','1 in 5'],2,'q = 0.02, p = 0.98, 2pq = 0.039, about 1 in 25.'),
 t3:Q('A woman who carries one copy of a haemophilia A variant (X-linked recessive) has a son with an unaffected man. What is the chance the son is affected?',['0%','25%','50%','100%'],2,'Each son gets either her normal X or the X with the allele, with equal probability. (Per pregnancy the chance of an affected child is 25%, because only half of children are sons.)')},
units:{dp:'Dimensional analysis checks equations: F = ma has units kg·m/s², which is the newton. Clinically 1 mmHg is about 133 Pa and 1 L = 1000 mL. Blood glucose may be reported in mmol/L or mg/dL. For glucose specifically, mmol/L × about 18 = mg/dL (5 mmol/L is about 90 mg/dL); other substances have different factors because their molecular masses differ.',
 t2:Q('Glucose is 5.4 mmol/L. Using 1 mmol/L ≈ 18 mg/dL, the value in mg/dL is about…',['30','97','180','540'],1,'5.4 × 18 ≈ 97 mg/dL.'),
 t3:Q('Educational calculation only: assume a hypothetical medicine is prescribed at 15 µg/kg and the child weighs 12 kg. What is the calculated dose, and which unit error gives a 1000-fold overdose?',['180 µg; reading it as mg','18 µg; reading it as ng','1.8 µg; reading it as mg','180 mg; reading it as µg'],0,'15 × 12 = 180 µg. Reading µg as mg would give 180 mg, a thousand times too much.')},
motion:{dp:'Impulse (force × time) equals the change in momentum (mv). Lengthening the stopping time lowers the average force: the principle behind seat belts, crumple zones and helmets. Terminal velocity occurs when drag equals weight, so the net force is zero.',
 t2:Q('A 70 kg person moving at 20 m/s is brought to rest in 0.1 s without rebounding. The average net force on them is…',['140 N','1 400 N','14 000 N','140 000 N'],2,'F = change in momentum ÷ time = 70 × 20 ÷ 0.1 = 14 000 N. This is the net force on the whole person, not on any single organ.'),
 t3:Q('Why does a longer stopping distance (a stretching belt or an airbag) reduce organ injury?',['It lowers the deceleration and so the force on tissues','It increases the mass of the person','It increases the speed','It removes inertia'],0,'For the same starting speed, a longer stopping distance means a longer stopping time and a smaller average deceleration (a = v²/2d), so a smaller average force. Injury also depends on how the force is spread over the body.')},
energy:{dp:'Muscle efficiency is only about 20 to 25%: most chemical energy becomes heat. As a rough illustration, a resting adult has a basal metabolic power of about 70 to 100 W (roughly 1400 to 2100 kcal per day; 1 kcal = 4184 J). It varies with size, body composition, age, sex and physiological state. During exercise heat must be lost by sweating, convection and radiation to avoid hyperthermia.',
 t2:Q('In a simplified model, a person lifts a 10 kg box 1.5 m (g = 10 m/s²) and 25% of the chemical energy supplied becomes useful work. About how much chemical energy is supplied?',['150 J','300 J','600 J','1500 J'],2,'Work = mgh = 150 J; 150 ÷ 0.25 = 600 J.'),
 t3:Q('Why can a marathon runner overheat on a hot humid day even at a constant pace?',['Most metabolic energy becomes heat, and humid air limits cooling by sweat evaporation','Running produces no heat','Humidity raises muscle efficiency','Energy is not conserved in muscle'],0,'Heat production continues, but evaporation cools poorly in humid air.')},
fluids:{dp:'Poiseuille: flow is proportional to ΔP × r⁴ / (η × L). In the idealised model (laminar flow in a rigid tube), halving the radius at the same pressure difference cuts flow 16-fold. Real vessels are compliant and flow is pulsatile, so this is a model, not an exact prediction. Arteriole diameter is a major determinant of systemic vascular resistance; the effect of an arterial narrowing depends on its location, severity and the collateral circulation. Mean arterial pressure is about diastolic plus one third of the pulse pressure.',
 t2:Q('A vessel radius is halved with the pressure difference unchanged. By Poiseuille law, flow falls to…',['1/2','1/4','1/8','1/16'],3,'Flow depends on r⁴, and (1/2)⁴ = 1/16.'),
 t3:Q('A patient has blood pressure 150/90 mmHg. The mean arterial pressure (diastolic + one third of pulse pressure) is about…',['90 mmHg','110 mmHg','120 mmHg','150 mmHg'],1,'Pulse pressure is 60, one third is 20, so MAP = 90 + 20 = 110 mmHg.')},
elec:{dp:'Ohm law applies to resistors; ion channels are described by conductance (g = 1/R) and gating. The membrane acts as a capacitor and a resistor, which sets how fast voltage changes. A defibrillator delivers a brief, controlled shock whose delivered current and energy depend on the waveform, chest impedance and electrode contact; good pad contact lowers impedance and supports effective delivery. Real use is learned through approved training: this is conceptual only.',
 t2:Q('A 12 V supply drives current through a 4 Ω resistor in series with a 2 Ω resistor. The current is…',['1 A','2 A','3 A','6 A'],1,'Total resistance 6 Ω, so I = 12 ÷ 6 = 2 A.'),
 t3:Q('A defibrillator is applied with poor pad contact and no conductive gel. Why does less current reach the heart?',['Poor contact raises the resistance, so for a given voltage less current flows (I = V/R)','Poor contact raises the current','Voltage and resistance are unrelated','Gel is a source of energy'],0,'Higher resistance at the interface reduces current for the same voltage.')},
waves:{dp:'Diagnostic ultrasound uses about 2 to 15 MHz: higher frequency gives better resolution but poorer penetration. Doppler shifts in echo frequency measure the velocity of moving blood. Reflection depends on differences in acoustic impedance, which is why gel removes the air gap. X-rays and gamma rays are ionising; diagnostic ultrasound and MRI are not. Non-ionising does not mean risk-free: MRI has magnetic-field, implant and heating hazards, and ultrasound exposure is also managed carefully.',
 t2:Q('An ultrasound echo returns after a total round-trip time of 130 µs. With v = 1540 m/s in tissue, the reflecting structure is at a depth of about…',['5 cm','10 cm','20 cm','1 cm'],1,'Depth = v × t ÷ 2 = 1540 × 130×10⁻⁶ ÷ 2 ≈ 0.10 m.'),
 t3:Q('A cardiologist measures blood flow velocity with Doppler ultrasound. What effect makes this possible?',['The echo frequency shifts when the reflecting blood cells are moving','Blood absorbs all sound','Sound turns into light','Blood emits radiation'],0,'The Doppler shift is proportional to the velocity of the reflector.')},
algebra:{dp:'Logarithm rules: log(ab) = log a + log b and log(aⁿ) = n log a. The natural log ln is the inverse of eˣ, and ln 2 ≈ 0.693, which is where the first-order half-life t½ = 0.693/k comes from (it applies to exponential processes C = C₀e^(−kt), not to zero-order ones). Biology uses log axes for quantities spanning orders of magnitude, such as pH and drug concentration.',
 t2:Q('If pH = −log[H⁺], what is [H⁺] when pH = 7.4?',['4 × 10⁻⁸ mol/L','7.4 × 10⁻⁷ mol/L','4 × 10⁻⁷ mol/L','7.4 mol/L'],0,'10⁻⁷·⁴ ≈ 4 × 10⁻⁸ mol/L, about 40 nmol/L.'),
 t3:Q('Educational calculation only: assume a hypothetical dose of 0.5 mg/kg and a supply of 25 mg/mL. For a 60 kg patient, what volume contains the calculated dose?',['0.83 mL','1.2 mL','12 mL','750 mL'],1,'Dose = 30 mg; volume = 30 ÷ 25 = 1.2 mL. This checks arithmetic, not whether a dose is clinically appropriate.')},
funcs:{dp:'Many physiological relationships are non-linear. The oxygen-haemoglobin dissociation curve is sigmoidal because of cooperative binding, which lets haemoglobin load oxygen fully in the lungs and unload it efficiently in tissues. Straight-line fits should only be used where the relationship is approximately linear, and extrapolating beyond the data can mislead.',
 t2:Q('On the steep middle section of the S-shaped oxygen-haemoglobin curve, a small fall in tissue PO₂ causes…',['a large fall in haemoglobin saturation, unloading oxygen','no release of oxygen','a large uptake of oxygen','a straight-line response'],0,'Where the curve is steep, a small change in PO₂ means a large change in saturation. The amount actually delivered also depends on haemoglobin concentration and blood flow.'),
 t3:Q('A graph of a drug measured effect against dose rises and then flattens. What is the most reasonable interpretation within the dose range studied?',['More dose adds little extra measured effect, while side effects may still rise','The drug has stopped working for good','The dose is too low','Effect is proportional to dose'],0,'A plateau suggests diminishing additional benefit for that measured effect. It does not mean risks have stopped increasing.')},
limits:{dp:'A function is continuous at a point if its limit equals its value there. The same idea underlies steady state: for a constant infusion with first-order elimination, C(t) = Css (1 − e^(−kt)), which tends to Css as t → ∞. In a standard model, steady state is approached after about 4 to 5 half-lives (about 94% after four, 97% after five); this is a rule of thumb that depends on the drug and regimen.',
 t2:Q('As t → ∞, what does C(t) = 10(1 − e^(−0.5t)) approach?',['0','5','10','∞'],2,'e^(−0.5t) tends to 0, so C tends to 10.'),
 t3:Q('In a standard model of a constant-rate infusion with first-order elimination, why does the blood level level off instead of rising forever?',['Elimination rises with concentration until it matches the infusion rate (steady state)','The infusion rate drops to zero automatically','The drug stops being absorbed','The body stops eliminating it'],0,'At steady state input equals output, so the level stops changing.')},
deriv:{dp:'The chain rule gives d/dt e^(−kt) = −k e^(−kt). Maxima and minima occur where the derivative is zero, and the second derivative gives curvature. Velocity is the derivative of position, and the maximum rate of ventricular pressure rise (dP/dtmax) is used as an index of contractility, though it is affected by loading conditions and heart rate.',
 t2:Q('A drug level is C(t) = 20e^(−0.2t) mg/L. What is dC/dt at t = 0?',['−20','−4','4','0.2'],1,'dC/dt = −0.2 × 20 e^0 = −4 mg/L per hour.'),
 t3:Q('Intracranial pressure rises by 2 mmHg per minute after a head injury. What does 2 mmHg per minute represent mathematically?',['The derivative (rate of change) of pressure with respect to time','The integral of pressure','A limit as time goes to infinity','A constant pressure'],0,'A rate of change is a derivative.')},
rates:{dp:'First-order elimination removes a roughly fixed fraction per unit time; zero-order elimination removes a roughly fixed amount while the pathway is saturated. Ethanol is often approximated as zero-order; phenytoin has capacity-limited (nonlinear) elimination, so near saturation a small dose increase can cause a disproportionate rise in blood level.',
 t2:Q('A drug has t½ = 6 h and starts at 80 mg/L. What is the concentration after 18 h?',['40','20','10','5'],2,'18 h is 3 half-lives: 80, 40, 20, 10.'),
 t3:Q('Phenytoin has capacity-limited (saturable) elimination near therapeutic doses. Why can a small dose increase be dangerous?',['Elimination is already near its maximum, so the level rises disproportionately','Elimination becomes faster','The half-life shortens','Absorption stops'],0,'Near saturation, elimination cannot rise in proportion to concentration, so extra drug accumulates disproportionately.')},
integ:{dp:'For a single IV dose under linear pharmacokinetics, AUC (to infinity) = Dose ÷ Clearance. In a one-compartment model C = C₀e^(−kt), integrating gives AUC = C₀/k; that second form depends on the model. Clearance is the volume of plasma cleared of drug per unit time. Integrals also give areas in ECG and pressure-volume loops; the area enclosed by the ventricular pressure-volume loop is the stroke work.',
 t2:Q('A single IV dose of 500 mg is given and clearance is 5 L/h. What is the AUC (Dose ÷ CL)?',['2.5 mg·h/L','100 mg·h/L','500 mg·h/L','2500 mg·h/L'],1,'500 ÷ 5 = 100 mg·h/L.'),
 t3:Q('Two formulations of the same drug and dose give the same peak level, but one has half the AUC over the same interval. What does this directly suggest?',['That formulation gives lower systemic exposure over that interval; the clinical meaning depends on the drug','It is more toxic','Only the peak matters','It has half the clearance'],0,'AUC reflects total exposure, which depends on how much drug reaches the circulation. It does not on its own prove the effect is weaker.')},
terms:{dp:'Plurals follow Latin and Greek rules (diagnosis, diagnoses; vertebra, vertebrae). Abbreviations are dangerous: "U" for units and "QD" for daily have caused errors and are banned in many hospitals, so write units and frequencies in full. Look-alike sound-alike drug names (hydralazine and hydroxyzine) can cause serious errors. Safeguards include tall-man lettering where adopted, clear prescribing, checking the drug and patient, and read-back for verbal orders; no single safeguard removes the risk.',
 t2:Q('Hyponatraemia means…',['high sodium in the blood','low sodium in the blood','low potassium in the blood','inflammation of the blood'],1,'hypo (low) + natr (sodium) + aemia (blood condition).'),
 t3:Q('A prescription reads "5 U insulin". Why should the abbreviation "U" be avoided?',['It can be misread (for example as 0), causing a serious dosing error','It is an SI unit','It is too long','It is not a real unit'],0,'A badly written U can look like a zero, turning 5 units into 50. Write units in full.')},
anat:{dp:'Axial CT and MRI images are conventionally displayed as if viewed from the patient feet, so the patient right appears on the left of the image. Always check the image labels and orientation markers. Surface landmarks help locate deeper structures, for example the sternal angle at the level of the 2nd rib. Body cavities: dorsal (cranial and spinal) and ventral (thoracic and abdominopelvic).',
 t2:Q('On an axial CT image viewed from the feet, the patient right side appears on the…',['left of the image','right of the image','top','bottom'],0,'Radiological convention shows the patient right on the viewer left.'),
 t3:Q('A note says "left kidney" because the writer used their own left. Which rule prevents this error?',['Always describe left and right from the patient perspective and confirm the side before a procedure','Always use the surgeon perspective','Use alphabetical order','Avoid side words'],0,'Anatomical terms are fixed to the patient so everyone means the same side.')},
comm:{dp:'Structured models help: Calgary-Cambridge guides consultations and SPIKES guides breaking bad news (Setting, Perception, Invitation, Knowledge, Emotions, Strategy). Active listening uses silence, reflection and summarising. Many adults find medical information hard to understand, so use plain language and teach-back. When a language barrier could affect safe or informed care, arrange a qualified interpreter under local policy; do not assume a relative is an appropriate substitute.',
 t2:Q('A patient says "I get this tightness in my chest sometimes." Which reply best shows active listening?',['"Sometimes? Tell me more about when it happens."','"It is probably nothing."','"Do you smoke?"','"Take this tablet."'],0,'It reflects, invites more detail and avoids premature reassurance.'),
 t3:Q('You must tell a patient that a scan shows a serious abnormality. In SPIKES, what comes before giving the information?',['Find out what the patient already understands and how much they want to know','Read out the full report immediately','Leave quickly','Discuss costs'],0,'The Perception and Invitation steps prepare the patient and respect their wishes.')},
consent:{dp:'Capacity is decision-specific and time-specific, and is assumed unless shown otherwise; an unwise decision does not by itself show a lack of capacity. Minors: laws vary on age of consent and competence of mature minors. If urgent treatment is necessary and the patient cannot make or communicate the decision, treatment may proceed without prior consent where the law and professional standards allow. Consider any known valid refusal or advance directive. Always follow local law and institutional policy.',
 t2:Q('An adult with decision-making capacity refuses a blood transfusion for religious reasons, though the doctor thinks it would help. The correct action is to…',['respect the informed refusal after exploring their understanding and explaining the risks and alternatives','transfuse anyway','ask a relative to override','ignore the refusal'],0,'A patient with capacity may refuse treatment.'),
 t3:Q('An unconscious trauma patient with a life-threatening bleed arrives with no relatives. Which principle usually allows immediate treatment?',['Emergency (implied) consent in the best interests of the patient','Waiting for a lawyer','Waiting until they wake','Treating only with written consent'],0,'Treatment needed to save life may proceed when consent cannot be obtained, unless there is a known valid refusal; local law and policy apply.')},
fa1:{dp:'The chain of survival: early recognition and call for help, early CPR, early defibrillation, and post-resuscitation care. Shockable rhythms are ventricular fibrillation and pulseless ventricular tachycardia; an AED analyses the rhythm and advises a shock only for those. In shockable cardiac arrest, early defibrillation is strongly linked to better survival, and delay reduces the chance of survival; the size of the effect varies with the circumstances.',
 t2:Q('An AED analyses the rhythm and says "no shock advised". What should you do?',['Continue CPR until help arrives or the person recovers','Stop and wait','Remove the pads and leave','Give a drink'],0,'Not shockable does not mean not in arrest. Keep doing CPR.'),
 t3:Q('Why start chest compressions before the AED arrives?',['They keep some blood flowing to the brain and heart while definitive treatment is arranged, improving the chance of survival','They restart the heart by themselves in most cases','They are painless','They are only for children'],0,'Compressions maintain circulation until a defibrillator or paramedics arrive.')},
fa2:{dp:'Shock (inadequate tissue perfusion) after blood loss shows pale, cold, clammy skin, a fast weak pulse and drowsiness: call emergency services, control the bleeding, keep the person still and warm, position them appropriately for their injuries and breathing, and give no food or drink. Tourniquets are for life-threatening limb bleeding not controlled by pressure. Burn severity depends on depth and the percentage of body surface area; the rule of nines estimates it in adults (head and neck 9%, each arm 9%, each leg 18%, front of trunk 18%, back of trunk 18%, perineum about 1%; it is an approximation and differs for children).',
 t2:Q('In the rule of nines for an adult, a burn covering the whole front of the trunk is about…',['9%','18%','27%','36%'],1,'The front of the trunk is 18% of body surface area.'),
 t3:Q('A person with heavy bleeding becomes pale, cold, clammy and drowsy with a fast weak pulse. What is the likely cause and the priority?',['Hypovolaemic shock from blood loss: control bleeding, keep them still, call emergency services','A cold: give fluids','An allergy: give food','A fracture only'],0,'Signs of poor perfusion after bleeding point to shock from low blood volume.')},
role:{dp:'Clinical decisions use pattern recognition and hypothetico-deductive reasoning and are vulnerable to cognitive biases such as anchoring, confirmation bias and premature closure. Safety tools include checklists, structured handover (SBAR: Situation, Background, Assessment, Recommendation) and speaking up. Evidence-based medicine combines the best available evidence with clinical expertise and the individual patient values and circumstances, and requires judging the quality and applicability of that evidence.',
 t2:Q('What does SBAR stand for?',['Situation, Background, Assessment, Recommendation','Safety, Breathing, Airway, Response','Symptoms, Blood, Allergies, Review','Sign, Behaviour, Action, Result'],0,'SBAR is a structured handover and escalation framework.'),
 t3:Q('A doctor sticks to the first diagnosis despite new findings that do not fit. Which bias is this and what helps?',['Anchoring; reassess and consider alternatives','Altruism; speed up','Humility; avoid tests','Optimism; wait'],0,'Anchoring is fixing on an early idea. Deliberately reassessing counters it.')}
};

const W1=[
{id:'ratios',sub:'math',t:'Fractions, ratios & proportion',pre:[],
learn:`<p>A <b>ratio</b> compares quantities (1:4 means 1 part to 4 parts). A <b>fraction</b> is part of a whole, and a <b>proportion</b> says two ratios are equal. Two quantities are <b>directly proportional</b> when y = kx (double x, double y) and <b>inversely proportional</b> when y = k/x (double x, halve y).</p><p><b>Units are part of the number.</b> Convert before you calculate: 1 g = 1000 mg, 1 mg = 1000 µg, 1 L = 1000 mL. A rate such as mg per mL or mg per kg lets you scale: amount = rate × quantity. Check that the units cancel to leave the unit you want (dimensional analysis).</p>`,
recall:[{q:'What does it mean for y to be directly proportional to x?',a:'y = kx: doubling x doubles y.'},{q:'Give two metric conversions used in dosing.',a:'1 g = 1000 mg and 1 mg = 1000 µg (also 1 L = 1000 mL).'},{q:'What is dimensional analysis?',a:'Checking that the units cancel to give the unit you want.'}],
apply:[{q:'A drug is 20 mg per 4 mL. How many mg are in 10 mL?',o:['5','50','8','80'],c:1,why:'20 ÷ 4 = 5 mg/mL, and 5 × 10 = 50 mg.'},{q:'With a fixed voltage, current is inversely proportional to resistance. If resistance doubles, the current…',o:['doubles','halves','is unchanged','quadruples'],c:1,why:'Inverse proportion: doubling one halves the other.'}],
explain:{q:'Explain ratios, direct and inverse proportion, and why units matter.',pts:['Ratios and proportions scale quantities','Direct: y = kx; inverse: y = k/x','Convert units before calculating (1 g = 1000 mg)','Dimensional analysis checks the answer']},
bq:'Why do almost all drug doses depend on both a rate and an amount?',
dp:'Percentages, fractions and ratios are the same idea in different forms: 25% = 1/4, a part-to-whole fraction, but 1:3 as a part-to-part ratio. Beware dilution notation: 1:10 can mean 1 part in 10 total or 1 part plus 10 parts. Dimensional analysis multiplies by conversion factors written as fractions equal to 1 so the units cancel, for example 70 kg × 15 µg/kg = 1050 µg = 1.05 mg.',
t2:Q('Educational calculation: a dose is 15 µg/kg. For a 70 kg adult, what is the dose in mg?',['0.105 mg','1.05 mg','10.5 mg','1050 mg'],1,'15 × 70 = 1050 µg, which is 1.05 mg.'),
t3:Q('Educational calculation: a solution contains 500 mg in 250 mL. What volume contains 1.2 g?',['300 mL','600 mL','120 mL','2400 mL'],1,'500 ÷ 250 = 2 mg/mL. Converting 1.2 g to 1200 mg first, 1200 ÷ 2 = 600 mL.')},
{id:'scinot',sub:'math',t:'Scientific notation & logarithms',pre:['ratios'],
learn:`<p><b>Scientific notation</b> writes a number as m × 10ⁿ with 1 ≤ m < 10: 0.00042 = 4.2 × 10⁻⁴ and 3 600 000 = 3.6 × 10⁶. Each step in the exponent is a factor of ten. Metric prefixes are powers of ten: kilo 10³, milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹.</p><p>A <b>logarithm</b> (base 10) is the exponent: log₁₀(1000) = 3 and log₁₀(0.001) = −3. Logs squeeze huge ranges into small numbers, which is why pH and many concentration graphs use them. <b>pH = −log₁₀[H⁺]</b>, so a rise of 1 in pH means ten times less H⁺.</p>`,
recall:[{q:'Write 0.00042 in scientific notation.',a:'4.2 × 10⁻⁴.'},{q:'What is log₁₀(1000)?',a:'3.'},{q:'What does a 1-unit rise in pH mean for [H⁺]?',a:'It falls by a factor of ten.'}],
apply:[{q:'Which number equals 5.6 × 10⁻³?',o:['0.0056','0.056','5600','0.00056'],c:0,why:'Move the decimal point 3 places left.'},{q:'If [H⁺] = 10⁻⁵ mol/L, the pH is…',o:['−5','5','9','0.00001'],c:1,why:'pH = −log₁₀(10⁻⁵) = 5.'}],
explain:{q:'Explain scientific notation and what a logarithm is.',pts:['m × 10ⁿ with 1 ≤ m < 10','Prefixes are powers of ten','A log is an exponent','pH is a log scale: 1 unit = ten times']},
bq:'Why do scientists plot some medical data on a log scale?',
dp:'Significant figures show precision: report no more digits than the measurement justifies. Logs turn multiplication into addition: log(a × b) = log a + log b. The decibel scale is logarithmic: every 10 dB is a tenfold change in intensity.',
t2:Q('[H⁺] changes from 4 × 10⁻⁸ to 4 × 10⁻⁷ mol/L. How does pH change?',['It rises by 1','It falls by 1','It falls by 10','It does not change'],1,'H⁺ rises tenfold, so pH falls by 1 (for example 7.4 to 6.4).'),
t3:Q('A drug concentration falls tenfold every 3 hours. On a graph of log₁₀ concentration against time, the line is…',['a straight line sloping down','a curve rising steeply','a horizontal line','a parabola'],0,'A constant fold-change per unit time is exponential decay, which is a straight line on a log axis.')},
{id:'stats',sub:'math',t:'Percentages & basic statistics',pre:['scinot'],
learn:`<p><b>Percentage</b> = part ÷ whole × 100. <b>Absolute change</b> is the plain difference (10% to 5% is a 5 percentage-point fall); <b>relative change</b> is the difference as a fraction of the starting value (the same fall is a 50% relative fall). Mixing them up is a classic way to mislead.</p><p>The <b>mean</b> is the average, the <b>median</b> is the middle value and the <b>standard deviation (SD)</b> measures spread. An outlier moves the mean far more than the median. For roughly normal data about 95% of values lie within 2 SD of the mean, which is how many reference ranges are built. <b>Correlation is not causation.</b></p>`,
recall:[{q:'What is the difference between absolute and relative change?',a:'Absolute is the plain difference; relative is the difference as a fraction of the starting value.'},{q:'Which is affected more by an outlier, the mean or the median?',a:'The mean.'},{q:'About what share of normal data lies within 2 SD of the mean?',a:'About 95%.'}],
apply:[{q:'A risk falls from 4% to 2%. The relative risk reduction is…',o:['2%','50%','4%','0.5%'],c:1,why:'The fall of 2 points is half of the starting 4%.'},{q:'Values: 4, 5, 5, 6, 40. The best measure of the typical value is the…',o:['mean (12)','median (5)','range','maximum'],c:1,why:'The outlier 40 drags the mean up; the median stays at 5.'}],
explain:{q:'Explain absolute versus relative change and the mean, median and SD.',pts:['Percent = part ÷ whole × 100','Absolute versus relative change','Mean, median and SD; outliers move the mean','Correlation is not causation']},
bq:'Why can a headline saying a treatment cuts risk by 50% be misleading?',
dp:'Number needed to treat (NNT) = 1 ÷ absolute risk reduction: a fall from 4% to 2% (ARR 0.02) gives NNT = 50. A p-value is the probability of data at least this extreme if there were no true effect; it is not the probability the hypothesis is true. A 95% confidence interval is a range that would contain the true value in 95% of repeated studies. Statistical significance is not the same as clinical importance.',
t2:Q('A treatment lowers the risk of an outcome from 4% to 2%. What is the number needed to treat?',['25','50','100','2'],1,'ARR = 0.02, so NNT = 1 ÷ 0.02 = 50.'),
t3:Q('Ice-cream sales and drowning deaths rise together across the months of the year. What is the most reasonable conclusion?',['A shared factor such as hot weather probably explains both','Ice cream causes drowning','Drowning causes ice-cream sales','The data must be wrong'],0,'Correlation does not show causation. Season and temperature are likely confounders.')},
{id:'stoich',sub:'chem',t:'Equations & stoichiometry',pre:['moles'],
learn:`<p>A <b>chemical equation</b> shows reactants → products. Atoms are conserved, so an equation must be <b>balanced</b>: the same number of each kind of atom on both sides. Change the <b>coefficients</b> (the numbers in front), never the subscripts: 2 H₂ + O₂ → 2 H₂O.</p><p>Coefficients are also <b>mole ratios</b>: 2 mol H₂ reacts with 1 mol O₂ to give 2 mol H₂O. The <b>limiting reagent</b> is the reactant that runs out first and sets how much product forms. <b>Percentage yield</b> = actual ÷ theoretical × 100.</p>`,
recall:[{q:'Why must a chemical equation be balanced?',a:'Atoms are conserved, so each element must have the same count on both sides.'},{q:'What do coefficients tell you?',a:'The mole ratio of the substances.'},{q:'What is the limiting reagent?',a:'The reactant that runs out first and limits the amount of product.'}],
apply:[{q:'2 H₂ + O₂ → 2 H₂O. How many mol of water form from 3 mol of H₂ (with plenty of O₂)?',o:['1.5','3','6','2'],c:1,why:'The ratio H₂ : H₂O is 1 : 1, so 3 mol makes 3 mol.'},{q:'How many mol of O₂ react completely with 4 mol of H₂ in 2 H₂ + O₂ → 2 H₂O?',o:['1','2','4','8'],c:1,why:'The ratio H₂ : O₂ is 2 : 1, so 4 mol needs 2 mol.'}],
explain:{q:'Explain how to balance an equation and use mole ratios.',pts:['Atoms are conserved, so equations balance','Change coefficients, not subscripts','Coefficients give mole ratios','The limiting reagent sets the amount of product']},
bq:'Cells burn glucose with oxygen to make CO₂ and water. What does the balanced equation say about oxygen use?',
dp:'The respiratory quotient (RQ) is CO₂ produced ÷ O₂ consumed: 1.0 for carbohydrate (6 ÷ 6), about 0.7 for fat and about 0.8 for protein, so it shows which fuel is being burned. Percentage yield is below 100% because of side reactions, incomplete reactions and losses. A balanced equation says what happens, not how fast.',
t2:Q('C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. A cell burns 0.5 mol of glucose. How many mol of CO₂ are made?',['0.5','3','6','1'],1,'The ratio is 1 : 6, so 0.5 × 6 = 3 mol.'),
t3:Q('A patient is burning mostly carbohydrate. The respiratory quotient (CO₂ out ÷ O₂ in) is closest to…',['0.7','1.0','2.0','0.1'],1,'Glucose gives 6 CO₂ for 6 O₂, a ratio of 1.0. Fat gives about 0.7.')},
{id:'soln',sub:'chem',t:'Solutions & dilution',pre:['moles','ratios'],
learn:`<p>A <b>solution</b> is a <b>solute</b> dissolved in a <b>solvent</b> (in the body, usually water). Concentration can be molarity (mol/L), mass per volume (mg/mL) or <b>percent weight/volume</b>: 1% w/v = 1 g per 100 mL = 10 g/L.</p><p><b>Dilution</b> adds solvent, so the amount of solute stays the same: <b>C₁V₁ = C₂V₂</b>. Diluting 10 mL of a 5 mg/mL solution to 50 mL gives 1 mg/mL. Beware of ratio notation: '1 in 10' usually means 1 part in 10 parts in total, while '1:10' can mean 1 part plus 10 parts. State it clearly.</p>`,
recall:[{q:'What stays the same when you dilute a solution?',a:'The amount of solute.'},{q:'What does 1% w/v mean?',a:'1 g per 100 mL (10 g per litre).'},{q:'State the dilution equation.',a:'C₁V₁ = C₂V₂.'}],
apply:[{q:'20 mL of a 10 mg/mL solution is diluted to 100 mL. The new concentration is…',o:['1 mg/mL','2 mg/mL','5 mg/mL','50 mg/mL'],c:1,why:'(10 × 20) ÷ 100 = 2 mg/mL.'},{q:'How many grams of solute are in 500 mL of a 2% w/v solution?',o:['1 g','10 g','100 g','0.1 g'],c:1,why:'2 g per 100 mL, so 10 g in 500 mL.'}],
explain:{q:'Explain solutions, concentration units and dilution.',pts:['Solute dissolved in solvent','Units: mol/L, mg/mL, % w/v','Dilution keeps the solute amount: C₁V₁ = C₂V₂','Ratio notation can be ambiguous']},
bq:'Why do pharmacies and laboratories write dilutions very explicitly?',
dp:'Serial dilutions repeat a fixed step (for example tenfold) to span many orders of magnitude, and concentrations multiply down the series (10⁻¹, 10⁻², 10⁻³). Molarity changes slightly with temperature because volume changes. For an ionic solute, osmolarity is molarity times the number of particles formed (NaCl gives about 2).',
t2:Q('You need 200 mL of a 0.5 mg/mL solution from a 10 mg/mL stock. How much stock is needed?',['5 mL','10 mL','20 mL','50 mL'],1,'C₁V₁ = C₂V₂ gives V₁ = (0.5 × 200) ÷ 10 = 10 mL, then add solvent up to 200 mL.'),
t3:Q('Educational calculation: a 1 mg/mL stock is diluted tenfold three times in a row. What is the final concentration?',['0.1 mg/mL','0.01 mg/mL','0.001 mg/mL','0.0001 mg/mL'],2,'Three tenfold steps: 1, 0.1, 0.01, 0.001 mg/mL.')},
{id:'organic',sub:'chem',t:'Organic chemistry & functional groups',pre:['bonds'],
learn:`<p><b>Organic chemistry</b> is the chemistry of carbon. Carbon forms <b>four</b> covalent bonds, so it builds chains, rings and branches. <b>Hydrocarbons</b> (carbon and hydrogen only) are nonpolar and do not mix with water.</p><p>A molecule's behaviour comes from its <b>functional groups</b>: <b>hydroxyl</b> –OH (alcohols; polar, hydrogen bonds), <b>carbonyl</b> C=O (aldehydes and ketones), <b>carboxyl</b> –COOH (acidic: donates H⁺), <b>amino</b> –NH₂ (basic: accepts H⁺), <b>sulfhydryl</b> –SH (forms disulfide bonds) and <b>phosphate</b> (carries charge and energy). <b>Isomers</b> have the same formula but different structures.</p>`,
recall:[{q:'How many covalent bonds does carbon usually form?',a:'Four.'},{q:'Which functional group makes a molecule acidic?',a:'The carboxyl group (–COOH).'},{q:'What is an isomer?',a:'A molecule with the same formula but a different structure.'}],
apply:[{q:'Every amino acid has a carboxyl group and which other group?',o:['hydroxyl','amino','sulfhydryl','phosphate'],c:1,why:'Amino acids have both a carboxyl and an amino group.'},{q:'Why is a long hydrocarbon chain insoluble in water?',o:['It is nonpolar','It is ionic','It is acidic','It is too small'],c:0,why:'Nonpolar molecules cannot form favourable interactions with polar water.'}],
explain:{q:'Explain why functional groups matter in organic molecules.',pts:['Carbon forms four bonds and builds chains and rings','Hydrocarbons are nonpolar','Functional groups decide properties','Isomers share a formula but differ in structure']},
bq:'Why do amino acids behave as both an acid and a base?',
dp:'Stereoisomers matter in medicine: enantiomers are mirror images and can behave differently in the body, and thalidomide is a famous reminder that drug shape matters. Protein amino acids are L-forms and most sugars are D-forms. A carbon bonded to four different groups is chiral. Phosphorylation, adding a phosphate group, switches many proteins on or off.',
t2:Q('Which functional group do alcohols contain?',['carbonyl','hydroxyl','amino','carboxyl'],1,'Alcohols contain the hydroxyl group, –OH.'),
t3:Q('Aspirin is a weak acid because it contains a carboxyl group. In the very acidic stomach, a weak-acid drug is more likely to be…',['uncharged and so absorbed more easily','charged and so absorbed more easily','destroyed','unable to dissolve at all'],0,'At low pH the carboxyl group keeps its H⁺ and stays uncharged, and uncharged molecules cross membranes more easily.')},
{id:'osmo',sub:'chem',t:'Osmosis & tonicity',pre:['membrane','moles'],
learn:`<p><b>Osmosis</b> is the net movement of water across a selectively permeable membrane toward the side with more solute that cannot cross. <b>Osmolarity</b> counts all dissolved particles; <b>tonicity</b> describes the effect of a solution on cell volume and depends only on solutes that cannot freely cross the membrane.</p><p>Relative to a cell: <b>isotonic</b> (no net water movement), <b>hypotonic</b> (water enters, the cell swells and may burst), <b>hypertonic</b> (water leaves, the cell shrinks). Normal saline (0.9% NaCl) is isotonic with red blood cells. A solute that enters cells freely, such as urea, does not hold water outside, so its solution can act hypotonic even at high osmolarity.</p>`,
recall:[{q:'Define osmosis.',a:'The net movement of water across a selectively permeable membrane toward the side with more non-penetrating solute.'},{q:'What happens to a red blood cell in a hypotonic solution?',a:'Water enters; it swells and may burst.'},{q:'What is the difference between osmolarity and tonicity?',a:'Osmolarity counts all particles; tonicity depends on solutes that cannot cross the membrane and describes the effect on cell volume.'}],
apply:[{q:'A red blood cell is placed in 3% NaCl. What happens?',o:['It swells','It shrinks','It stays the same','It divides'],c:1,why:'3% NaCl is hypertonic, so water leaves the cell.'},{q:'Which solution is isotonic with red blood cells?',o:['0.9% NaCl','0.45% NaCl','3% NaCl','distilled water'],c:0,why:'0.9% NaCl matches the effective solute concentration of plasma.'}],
explain:{q:'Explain osmosis, osmolarity and tonicity.',pts:['Osmosis is net water movement across a selective membrane','Osmolarity counts particles; tonicity depends on non-penetrating solutes','Hypotonic swells, isotonic no change, hypertonic shrinks','Penetrating solutes such as urea do not set tonicity']},
bq:'Why must intravenous fluids be matched to the body fluids?',
dp:'Plasma osmolality is about 285 to 295 mOsm/kg and is tightly controlled by antidiuretic hormone (ADH): rising osmolality triggers thirst and ADH release, so the kidneys retain water. 5% dextrose is isotonic in the bag, but the glucose is metabolised, leaving free water, so it acts like a hypotonic fluid in the body. Oncotic pressure from plasma proteins, mainly albumin, pulls fluid back into capillaries.',
t2:Q('A solution is 0.45% NaCl (half normal saline). Relative to a red blood cell it is…',['hypotonic','isotonic','hypertonic','impossible to say'],0,'It has fewer non-penetrating solute particles than the cell, so water enters the cell.'),
t3:Q('A patient receives a large volume of 5% dextrose. After the glucose is metabolised, the fluid acts like…',['free water that lowers plasma osmolality','concentrated saline','pure protein','nothing at all'],0,'Glucose is taken up and used, leaving water that dilutes body fluids and can lower plasma sodium.')},
{id:'ap',sub:'bio',t:'Resting & action potential',pre:['ions','membrane'],
learn:`<p>A resting neuron sits at about <b>−70 mV</b> inside relative to outside. This <b>resting potential</b> exists because the membrane is far more permeable to K⁺ (through leak channels) than to Na⁺, so K⁺ leaves down its gradient and the inside becomes negative. The Na⁺/K⁺ pump maintains the gradients.</p><p>An <b>action potential</b> is a brief, all-or-none reversal of the voltage. If a stimulus depolarises the cell to <b>threshold</b> (about −55 mV), voltage-gated <b>Na⁺ channels open</b>, Na⁺ rushes in and the cell depolarises toward +30 mV (a positive feedback loop). Then Na⁺ channels inactivate and voltage-gated <b>K⁺ channels open</b>: K⁺ leaves and the cell <b>repolarises</b>, briefly overshooting below rest. During the <b>refractory period</b> a new action potential is hard or impossible, so the signal travels one way along the axon.</p>`,
recall:[{q:'What mainly sets the resting potential?',a:'The membrane is far more permeable to K⁺ than to Na⁺, so K⁺ leaving makes the inside negative.'},{q:'What opens at the start of an action potential?',a:'Voltage-gated Na⁺ channels.'},{q:'What does all-or-none mean?',a:'Once threshold is reached the action potential has the same size; below threshold there is none.'}],
apply:[{q:'Which ion movement causes the rising phase of the action potential?',o:['Na⁺ entering','K⁺ entering','Na⁺ leaving','Cl⁻ leaving'],c:0,why:'Voltage-gated Na⁺ channels open and Na⁺ flows in.'},{q:'What causes repolarisation?',o:['K⁺ leaving the cell','Na⁺ entering','Ca²⁺ leaving','Cl⁻ entering'],c:0,why:'K⁺ channels open and K⁺ leaves while Na⁺ channels inactivate.'}],
explain:{q:'Explain the resting potential and the stages of an action potential.',pts:['Resting potential about −70 mV from K⁺ permeability and gradients','Threshold opens voltage-gated Na⁺ channels (positive feedback)','K⁺ channels open and Na⁺ channels inactivate: repolarisation','All-or-none, with a refractory period so the signal travels one way']},
bq:'How can a local anaesthetic numb part of the body?',
dp:'Myelin insulates axons, and action potentials jump between the nodes of Ranvier (saltatory conduction), speeding conduction; demyelination in multiple sclerosis slows or blocks it. The Goldman-Hodgkin-Katz equation extends Nernst by weighting each ion by its permeability, which explains why the resting potential (about −70 mV) lies near E_K (about −95 mV) but not on it. Hyperkalaemia depolarises the resting potential, inactivating Na⁺ channels and reducing excitability.',
t2:Q('If the membrane were permeable only to K⁺, the resting potential would be close to…',['E_K, about −95 mV','E_Na, about +60 mV','0 mV','+30 mV'],0,'With only K⁺ permeability the potential approaches the K⁺ equilibrium potential.'),
t3:Q('Tetrodotoxin from the pufferfish blocks voltage-gated Na⁺ channels. What is the most direct effect on nerves?',['Action potentials cannot be generated or conducted, causing paralysis','Action potentials fire continuously','The resting potential becomes +30 mV','K⁺ channels stay open permanently'],0,'Without Na⁺ channels there is no rising phase, so nerves and muscles cannot be activated.')},
{id:'homeo',sub:'bio',t:'Homeostasis & feedback',pre:['cells','enzymes'],
learn:`<p><b>Homeostasis</b> keeps internal conditions (temperature, glucose, pH, blood pressure) within narrow limits around a <b>set point</b>. A control loop has a <b>sensor</b> (detects the variable), a <b>control centre</b> (compares it with the set point) and an <b>effector</b> (acts to correct it).</p><p><b>Negative feedback</b> opposes a change and stabilises the variable: too hot, so you sweat and skin vessels dilate; too much glucose, so insulin is released. <b>Positive feedback</b> amplifies a change and drives a process to completion: oxytocin and labour contractions, or blood clotting. Many diseases are failures of a feedback loop, such as diabetes mellitus.</p>`,
recall:[{q:'List the three parts of a control loop.',a:'Sensor, control centre and effector.'},{q:'What does negative feedback do?',a:'It opposes a change and brings the variable back toward the set point.'},{q:'Give one example of positive feedback.',a:'Oxytocin and labour contractions (or blood clotting).'}],
apply:[{q:'Body temperature rises and the body sweats. This is…',o:['negative feedback','positive feedback','no feedback','an error'],c:0,why:'The response opposes the change.'},{q:'Which is a positive feedback example?',o:['Insulin lowering blood glucose','Sweating when hot','Oxytocin strengthening labour contractions','Shivering when cold'],c:2,why:'Contractions release more oxytocin, which strengthens contractions.'}],
explain:{q:'Explain homeostasis and the difference between negative and positive feedback.',pts:['Homeostasis keeps variables near a set point','Sensor, control centre, effector','Negative feedback stabilises','Positive feedback amplifies to completion']},
bq:'What goes wrong in type 1 diabetes in terms of a feedback loop?',
dp:'With finite feedback gain, a persistent disturbance leaves a steady-state offset from the set point (offset = disturbance ÷ gain). In a fever, pyrogens raise the hypothalamic set point, so the body shivers and conserves heat until the new, higher temperature is reached. Hormone loops often involve a hypothalamus, pituitary and target gland, with negative feedback from the hormone to the upstream glands (thyroid hormone lowers TSH release). Positive feedback loops need a built-in stop, such as delivery ending oxytocin release.',
t2:Q('A heat load pushes a controlled variable up by 4 units per time. The negative feedback gain is 2. At steady state the deviation from the set point is about…',['0.5 units','2 units','4 units','8 units'],1,'Steady-state deviation = disturbance ÷ gain = 4 ÷ 2 = 2 units.'),
t3:Q('In a fever from infection, the body shivers and constricts skin vessels even though temperature is already above normal. The best explanation is that…',['pyrogens raise the hypothalamic set point, so the body acts to reach the higher temperature','the sensors are broken','negative feedback has stopped','heat production is not regulated'],0,'Feedback is still working, but toward a higher set point.')}];

organic:{chain:['Every amino acid has a carboxyl group and an amino group','The carboxyl group can donate H⁺ (acid)','The amino group can accept H⁺ (base)','So amino acids buffer changes in pH','Proteins inherit this: their side groups give them charge and shape'],tie:'The molecule viewer showed the groups that act as acid or base. The pH lesson showed what donating and accepting H⁺ does.',a:'They carry a carboxyl group that donates H⁺ and an amino group that accepts it, which lets amino acids and proteins buffer pH changes.'},
osmo:{chain:['Cell membranes are permeable to water, not to most solutes','Water follows non-penetrating solutes','Very dilute fluid pulls water into cells','Very concentrated fluid pulls water out','Isotonic fluids avoid damaging cell volume'],tie:'The cell slider showed it: change the outside concentration and the cell swells or shrinks. The wrong fluid does that inside the body.',a:'Water crosses cell membranes freely, so a fluid much more dilute or more concentrated than body fluids shifts water into or out of cells and can harm them. Isotonic fluids avoid this.'},
ap:{chain:['A pain signal is a train of action potentials in a nerve','Each one needs voltage-gated Na⁺ channels to open','A local anaesthetic blocks those channels','Threshold is never reached, so no action potential forms','The pain message cannot travel to the brain'],tie:'The stimulus slider showed it: no threshold, no action potential. Block the Na⁺ channels and threshold cannot be reached.',a:'Local anaesthetics such as lidocaine block voltage-gated Na⁺ channels in nerve fibres, so action potentials cannot form or travel and the pain signal does not reach the brain.'},
homeo:{chain:['After a meal blood glucose rises','Beta cells in the pancreas sense it and release insulin','Insulin makes cells take up glucose','Blood glucose falls back to the set point','In type 1 diabetes the beta cells are destroyed, so the loop has no insulin effector'],tie:'The slider showed that weaker feedback means a bigger deviation from the set point. With no insulin response the deviation grows large.',a:'The loop breaks because insulin-producing beta cells are lost, so glucose cannot be brought back toward the set point after meals and stays high unless insulin is replaced.'}});
